<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Games — QR 👑</title>
<style>
  :root {
    --bg: #12122b;
    --ink: #eef0ff;
    --gold: #ffd166;
    --gold2: #f4a10c;
    --mint: #6ee7b7;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(110, 231, 183, 0.10), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(255, 209, 102, 0.10), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow: hidden;
  }

  /* Փայլող աստղիկները ֆոնին */
  .star {
    position: fixed;
    color: var(--gold);
    animation: twinkle 2.4s infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.9; transform: scale(1.15); } }

  /* Պաստառը՝ ոսկե շրջանակով */
  .poster {
    position: relative;
    z-index: 1;
    width: min(94vw, 460px);
    background: #1d1d3f;
    border: 4px solid var(--gold);
    border-radius: 26px;
    box-shadow: 0 0 0 6px #1d1d3f, 0 0 0 8px rgba(255, 209, 102, 0.35), 0 24px 60px rgba(0, 0, 0, 0.6);
    padding: 26px 22px 22px;
    text-align: center;
  }

  .crown { font-size: 46px; line-height: 1; animation: bob 1.8s infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-5deg); } }

  h1 {
    font-size: clamp(1.9rem, 8vw, 2.6rem);
    letter-spacing: 0.03em;
    margin-top: 4px;
    background: linear-gradient(180deg, #ffe9a8, var(--gold) 55%, var(--gold2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .slogan { color: #9a9ec7; font-size: 0.92rem; margin-top: 6px; }

  .badge {
    display: inline-block;
    margin-top: 12px;
    background: var(--gold);
    color: #2e2410;
    font-weight: bold;
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 0.95rem;
  }

  .heroes { font-size: clamp(22px, 6vw, 30px); margin-top: 14px; letter-spacing: 0.18em; }
  .heroes span { display: inline-block; animation: hop 1.6s infinite; }
  .heroes span:nth-child(2n) { animation-delay: 0.2s; }
  .heroes span:nth-child(3n) { animation-delay: 0.4s; }
  @keyframes hop { 50% { transform: translateY(-5px); } }

  .qr {
    background: #fff;
    padding: 16px;
    border-radius: 20px;
    border: 4px solid var(--gold);
    width: min(72vw, 40vh, 300px);
    margin: 16px auto 0;
  }
  .qr svg { display: block; width: 100%; height: auto; }

  .scanme {
    margin-top: 12px;
    font-weight: bold;
    font-size: clamp(1.05rem, 4.5vw, 1.3rem);
    color: var(--mint);
  }
  .url {
    margin-top: 6px;
    font-size: clamp(1rem, 4vw, 1.25rem);
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  .back { margin-top: 14px; font-size: 0.9rem; }
  .back a { color: #9a9ec7; text-decoration: none; }

  /* Տպելիս՝ մաքուր սպիտակ պաստառ */
  @media print {
    body { background: #fff; }
    .star { display: none; }
    .poster { background: #fff; color: #12122b; box-shadow: none; border-color: #b8860b; }
    .slogan { color: #555; }
    .scanme { color: #12122b; }
    .back { display: none; }
    h1 { color: #b8860b; background: none; -webkit-background-clip: initial; background-clip: initial; }
  }
</style>
</head>
<body>

<div class="poster">
  <div class="crown">👑</div>
  <h1>GOLDEN GAMES</h1>
  <p class="slogan">✵ թե ուզմես ուրեմն կրենալել դես․ լիլը կլի, տյու ուզող ասա ✵</p>

  <div class="badge">🎮 10 ԽԱՂ · ԲՈԼՈՐՆ ԱՆՎՃԱՐ</div>

  <div class="heroes">
    <span>🐱</span><span>🚗</span><span>🎹</span><span>🚀</span><span>🧠</span><span>🎣</span><span>🌀</span><span>⚡</span>
  </div>

  <div class="qr">

  </div>

  <p class="scanme">📸 Սկանի՛ր ու խաղա՛</p>
  <p class="url">aren-alpha.vercel.app</p>

  <p class="back"><a href="./index.html">← Golden Games</a></p>
</div>

<script>
// Փայլող աստղիկներ ենք շաղ տալիս ֆոնին
for (let i = 0; i < 26; i++) {
  const s = document.createElement('span');
  s.className = 'star';
  s.textContent = i % 3 === 0 ? '✦' : '✧';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  s.style.fontSize = (8 + Math.random() * 16) + 'px';
  s.style.animationDelay = (Math.random() * 2.4) + 's';
  document.body.appendChild(s);
}
</script>
</body>
</html>
