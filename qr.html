<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Խաղա՛ Արենի խաղերը 📱</title>
<style>
  :root {
    --bg: #12122b;
    --ink: #eef0ff;
    --accent: #ffd166;
    --accent2: #6ee7b7;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(110, 231, 183, 0.1), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(255, 209, 102, 0.09), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
  }
  .joy { font-size: 56px; animation: bounce 1.6s infinite; }
  @keyframes bounce { 50% { transform: translateY(-10px) rotate(-6deg); } }
  h1 { color: var(--accent); font-size: clamp(1.5rem, 6vw, 2.4rem); }
  .sub { color: #9a9ec7; font-size: clamp(1rem, 3.5vw, 1.2rem); }

  .qr {
    background: #fff;
    padding: 22px;
    border-radius: 24px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    width: min(78vw, 46vh, 380px);
  }
  .qr svg { display: block; width: 100%; height: auto; }

  .url {
    font-size: clamp(1.05rem, 4vw, 1.5rem);
    font-weight: bold;
    color: var(--accent2);
    letter-spacing: 0.02em;
  }
  .hint { color: #9a9ec7; font-size: 0.95rem; }
  .back { margin-top: 6px; }
  .back a { color: var(--accent); }

  /* Տպելիս՝ սպիտակ ֆոն, մաքուր պաստառ */
  @media print {
    body { background: #fff; color: #12122b; }
    .sub, .hint { color: #444; }
    .qr { box-shadow: none; border: 3px solid #12122b; }
    .url { color: #12122b; }
    .back { display: none; }
  }
</style>
</head>

<div class="joy">🕹️</div>
<h1>Խաղա՛ Արենի խաղերը</h1>
