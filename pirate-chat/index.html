// ——— Ձայնիկ՝ հաղորդագրության «բլյուպ» ———
let audioCtx = null;
function blip(freq) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.12);
}

// ——— Հաղորդագրություն ավելացնելը ———
function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ——— Կապիտանի ուղեղը ———
function captainReply(text) {
  const t = text.toLowerCase();
  for (const rule of RULES) {
    for (const key of rule.keys) {
      if (t.includes(key)) return pick(rule.answers);
    }
  }
  // ոչինչ չգտավ → ընդհանուր պատասխան՝ քո բառերով
  const shortText = text.length > 25 ? text.slice(0, 25) + '…' : text;
  return pick(FALLBACKS).replace('__', shortText);
}

// ——— Խոսակցությունը ———
let busy = false;
function send(text) {
  if (!text.trim() || busy) return;
  busy = true;
  addMsg(text, 'me');
  blip(500);

  // կապիտանը «մտածում է»…
  const typing = addMsg('Կապիտանը գրում է… ✍️', 'bot');
  typing.classList.add('typing');

  setTimeout(() => {
    typing.remove();
    addMsg(captainReply(text), 'bot');
    blip(700);
    busy = false;
  }, 700 + Math.random() * 800);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  send(input.value);
  input.value = '';
});

document.querySelectorAll('.chips button').forEach(btn => {
  btn.addEventListener('click', () => send(btn.dataset.say));
});
