// Երբ ոչ մի բանալի բառ չի գտնում, կապիտանը խոստովանում է
// ու տալիս «գանձի քարտեզ»՝ կոճակ, որ բացում է որոնումը ինտերնետում
const FALLBACKS = [
  'Արրր, «__»… Այս մեկը սնդուկումս չկա։ Բայց ահա՛ գանձի քարտեզը — սեղմիր ու պատասխանը կգտնես։ 🗺️',
  'Հմմ, «__»… Թութակս էլ չգիտի, իսկ նա ամեն ինչ գիտի (իր կարծիքով)։ Վերցրու քարտեզս ու ինքդ գտիր։ 🦜',
  'Յո-հո-հո՜, ծանր հարց է, նավաստի՛։ Իմ սնդուկը այստեղ անզոր է, բայց քարտեզս քեզ կտանի պատասխանի մոտ։ ⚓',
];

// ——— Ձայնիկ՝ հաղորդագրության «բլյուպ» ———
let audioCtx = null;
function blip(freq) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.12);
}

// ——— Հաղորդագրություն ավելացնելը ———
// searchQuery կա → վերջում ավելացնում ենք «գանձի քարտեզ» կոճակը,
// որ բացում է ինտերնետի որոնումը հենց այդ հարցով
function addMsg(text, who, searchQuery) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (searchQuery) {
    const a = document.createElement('a');
    a.className = 'search-link';
    a.href = 'https://www.google.com/search?q=' + encodeURIComponent(searchQuery);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '🗺️ Գտնել պատասխանը ինտերնետում';
    div.appendChild(document.createElement('br'));
    div.appendChild(a);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Գիտելիքների սնդուկի բոլոր փաստերը մի տեղում՝ «Փաստ» կոճակի համար
const CHEST_TOPICS = ['տիեզերք', 'դինոզավր', 'կետ', 'ամենաարագ', 'ֆուտբոլ', 'հայաստան', 'սիրտ', 'մեղու'];
const FACT_POOL = [];
for (const r of RULES) {
  if (CHEST_TOPICS.some(k => r.keys.includes(k))) FACT_POOL.push(...r.answers);
}

// ——— Կապիտանի ուղեղը ———
// Վերադարձնում է {text, search}. search-ը լցվում է միայն այն դեպքում,
// երբ կապիտանը պատասխանը չգիտի ու «քարտեզ» է առաջարկում
function captainReply(text) {
  const t = text.toLowerCase();
  // «փաստ» խնդրեց → բացում ենք գիտելիքների սնդուկը
  if (t.includes('փաստ')) return { text: pick(FACT_POOL) };
  for (const rule of RULES) {
    for (const key of rule.keys) {
      if (t.includes(key)) return { text: pick(rule.answers) };
    }
  }
  // ոչինչ չգտավ → խոստովանում է ու տալիս որոնման քարտեզը
  const shortText = text.length > 25 ? text.slice(0, 25) + '…' : text;
  return { text: pick(FALLBACKS).replace('__', shortText), search: text };
}

// ——— Խոսակցությունը ———
let busy = false;
function send(text) {
  if (!text.trim() || busy) return;
  busy = true;
  addMsg(text, 'me');
  blip(500);

  // կապիտանը «մտածում է»…
  const typing = addMsg('Կապիտանը գրում է… ✍️', 'bot');
  typing.classList.add('typing');

  setTimeout(() => {
    typing.remove();
    const reply = captainReply(text);
    addMsg(reply.text, 'bot', reply.search);
    blip(700);
    busy = false;
  }, 700 + Math.random() * 800);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  send(input.value);
  input.value = '';
});

document.querySelectorAll('.chips button').forEach(btn => {
  btn.addEventListener('click', () => send(btn.dataset.say));
});
