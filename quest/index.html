<html lang="hy">

<title>Ոսկե Արշավ 🗺️ · Golden Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0f1424; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #f5eede;
    padding-bottom: 24px;
    transition: padding-bottom 0.2s ease;
  }
  /* բաց վահանակը ծածկում է ներքևի կանգառները — տեղ ենք ավելացնում, որ դրանք վեր սահեն */
  body.panelOpen { padding-bottom: 210px; }

  /* ——— վերևի գոտին՝ վերնագիր ու առաջընթաց ——— */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(#141a2c, rgba(20,26,44,0.88));
    border-bottom: 2px solid rgba(240,200,90,0.35);
    padding: 46px 12px 9px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.12rem; color: #f0c85a; letter-spacing: 0.5px; }
  header p { margin: 3px 0 8px; font-size: 0.72rem; opacity: 0.75; }
  .bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px;
           background: linear-gradient(90deg, #f0c85a, #ffe9a8); transition: width 0.6s ease; }
  .barTxt { margin-top: 5px; font-size: 0.72rem; color: #ffe9a8; }
  #allBtn {
    margin-top: 6px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; color: #f5eede;
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.28);
  }
  #allBtn.on { background: rgba(240,200,90,0.18); border-color: #f0c85a; color: #ffe9a8; }
  #allNote { margin-top: 4px; font-size: 0.66rem; color: #ffe9a8; opacity: 0.8; line-height: 1.35; }
  #allNote[hidden] { display: none !important; }
  #endBtn {
    margin: 6px 0 0 6px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; font-weight: bold; color: #10162a;
    background: #f0c85a; border: 1.5px solid #f0c85a;
  }
  #endBtn[hidden] { display: none !important; }

  /* ——— քարտեզը ——— */
  #mapWrap { width: 100%; overflow-x: hidden; }
  #map { display: block; width: 100%; height: auto; }

  .stopHit { cursor: pointer; }
  .stopLbl { font: bold 13px Arial, sans-serif; fill: #f5eede; paint-order: stroke; stroke: rgba(10,14,26,0.85); stroke-width: 4px; }
  .stopNum { font: bold 17px Arial, sans-serif; fill: #10162a; text-anchor: middle; dominant-baseline: central; }
  .stopNumLock { fill: #cfd6e6; }

  /* ——— ներքևի վահանակը ——— */
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: #1b2238; border-top: 2px solid rgba(240,200,90,0.5);
    border-radius: 16px 16px 0 0; padding: 14px 16px 20px;
    box-shadow: 0 -8px 26px rgba(0,0,0,0.5);
  }
  #panel[hidden] { display: none !important; }
  #pStop { font-size: 0.72rem; color: #f0c85a; letter-spacing: 1px; }
  #pGame { margin: 2px 0 6px; font-size: 1.15rem; }
  #pTask { margin: 0 0 4px; font-size: 0.92rem; line-height: 1.4; }
  #pNow { margin: 0 0 12px; font-size: 0.78rem; opacity: 0.7; }
  .btns { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 12px 8px; border-radius: 12px; border: 2px solid transparent;
    font-size: 0.92rem; font-family: inherit; color: #10162a; background: #f0c85a;
    font-weight: bold; text-align: center; text-decoration: none; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: #f5eede; border-color: rgba(255,255,255,0.3); }
  .btn.off { background: rgba(255,255,255,0.12); color: #cfd6e6; font-weight: normal; }

  /* ——— ավարտի տոնը ——— */
  #win {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,11,22,0.93);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #win[hidden] { display: none !important; }
  #win .crown { font-size: 4.6rem; animation: pop 1.6s ease-in-out infinite; }
  @keyframes pop { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.12) rotate(4deg); } }
  #win h2 { margin: 10px 0 6px; font-size: 1.4rem; color: #f0c85a; }
  #win p { margin: 0 0 18px; font-size: 0.92rem; line-height: 1.5; max-width: 340px; }
  #confetti { position: fixed; inset: 0; z-index: 49; pointer-events: none; }
  #confetti[hidden] { display: none !important; }

  /* ——— սկզբի պատմությունը ——— */
  #story {
    position: fixed; inset: 0; z-index: 45;
    background: rgba(8,11,22,0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 26px;
  }
  #story[hidden] { display: none !important; }
  #story .crown { font-size: 3.4rem; }
  #story h2 { margin: 8px 0 10px; font-size: 1.25rem; color: #f0c85a; }
  #story p { margin: 0 0 20px; font-size: 0.9rem; line-height: 1.55; max-width: 330px; }
</style>

<script>
// ——————————————————————————————————————
//  ՈՍԿԵ ԱՐՇԱՎ 🗺️ — Արենի միտքն է
//  Խաղերը մեկ մեծ ճանապարհ են դառնում։ Ամեն կանգառ մի խաղ է
//  իր առաջադրանքով։ Կատարում ես՝ կանգառը ոսկեզօծվում է,
//  ճանապարհը բացվում է առաջ, իսկ վերջում՝ Ոսկե Թագը տուն է գալիս։
// ——————————————————————————————————————

let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}

const TRL = {
  hy: {
    title: 'Ոսկե Արշավ 🗺️', sub: 'Մեկ ճանապարհ · տասներկու կանգառ · մեկ ոսկե թագ',
    story: 'Ոսկե Թագը գողացել են Golden Games-ից 👑 Ճանապարհը ոլորվում է ծովի, սարերի ու քաղաքի միջով։ Ամեն կանգառում քեզ մի խաղ է սպասում։ Կատարիր առաջադրանքը՝ կանգառը կոսկեզօծվի, ու ճանապարհը կբացվի դեպի հաջորդը։',
    begin: '🚩 Ճանապարհ ընկնել',
    stop: n => 'ԿԱՆԳԱՌ ' + n, prog: (n, m) => n + '/' + m + ' կանգառ',
    go: '▶ Գնալ խաղալու', done: '✅ Կատարված է', locked: n => '🔒 Նախ ավարտիր ' + n + '-րդ կանգառը',

  if (s.unit === 'chain') return v + T.u.chain;
  if (s.unit === 'letters') return v + '/20';
  if (s.unit === 'fl') return v + T.u.fl;
  return v + T.u.pt;
}
function recordOf(s) {
  let v = 0;
  try { v = Number(localStorage.getItem(s.key) || 0) || 0; } catch (e) {}
  return v;
}

// ——— ձայնը 🔊 (առաջին հպումից նոր է միանում) ———
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.13, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.15));
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + (dur || 0.15));
}

// ——— հեռախոսի ուրվական-մկնիկը. հպումից հետո mouse-ը կրկնում է հպումը ———
let lastTouchAt = 0;
document.addEventListener('touchstart', () => { lastTouchAt = Date.now(); initAudio(); }, { passive: true });
function ghost() { return Date.now() - lastTouchAt < 700; }

// ——— կրկնակի արագ հպումը էկրանը մեծացնում էր ———
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

const SVGNS = 'http://www.w3.org/2000/svg';
const road = document.getElementById('road');
const roadGold = document.getElementById('roadGold');
const gStops = document.getElementById('stops');
const panel = document.getElementById('panel');

let openIndex = -1;
let doneArr = [], reached = 0;

// «Ժամանակավոր բոլորը բացի ու ոսկեզօծի» — Արենի խնդրանքն է։
// Այս ռեժիմում ամբողջ ճանապարհը ոսկի է դառնում ու վերջը կարելի է տեսնել,
// բայց localStorage-ի իսկական ռեկորդներին ձեռք չենք տալիս — անջատում ես, ու
// քարտեզը նորից ճշմարիտն է ցույց տալիս։
// Ժամանակավորը թող իսկապես ժամանակավոր լինի. ոսկեզօծումը ապրում է միայն
// այս այցի ընթացքում։ Խաղ ես մտնում ու ետ գալիս — մնում է. կայքը նորից ես
// բացում — քարտեզը ինքնաբերաբար վերադառնում է ճշմարիտին։
let preview = false;
try {
  preview = sessionStorage.getItem('aren-quest-openall') === '1';
  localStorage.removeItem('aren-quest-openall');   // հին այցերից մնացածը մաքրում ենք
} catch (e) {}
let realArr = [];
function isOpen(i) { return preview || i <= reached; }

// ——— ճանապարհի վրայի կետերը ———
// Ամեն կանգառ նստում է ճանապարհի վրա՝ հավասար հեռավորությամբ։
function stopPoint(i) {
  const len = road.getTotalLength();
  const f = (i + 0.62) / (STOPS.length + 0.25);
  return { p: road.getPointAtLength(len * f), at: len * f };
}

function render() {
  realArr = STOPS.map(s => recordOf(s) >= s.goal);
  doneArr = preview ? STOPS.map(() => true) : realArr.slice();
  // քանի կանգառ է անընդմեջ արված — այնքան է ճանապարհը բացվել
  reached = 0;
  while (reached < STOPS.length && doneArr[reached]) reached++;

  // վերնագրերը
  document.getElementById('hTitle').textContent = T.title;
  document.getElementById('hSub').textContent = T.sub;
  document.getElementById('barFill').style.width = (reached / STOPS.length * 100) + '%';
  document.getElementById('barTxt').textContent = T.prog(reached, STOPS.length);
  const ab = document.getElementById('allBtn');
  ab.textContent = preview ? T.allLock : T.allOpen;
  ab.classList.toggle('on', preview);
  const an = document.getElementById('allNote');
  an.textContent = T.allNote;
  an.hidden = !preview;
  const eb = document.getElementById('endBtn');
  eb.textContent = T.seeEnd;
  eb.hidden = reached < STOPS.length;
  document.title = T.title + ' · Golden Games';
  document.documentElement.lang = ggLang;

  // ոսկե ճանապարհը՝ մինչև վերջին բացված կանգառը
  const len = road.getTotalLength();
  roadGold.setAttribute('d', road.getAttribute('d'));
  document.getElementById('roadDash').setAttribute('d', road.getAttribute('d'));
  const gold = reached === 0 ? 0 : stopPoint(reached - 1).at;
  roadGold.setAttribute('stroke-dasharray', gold + ' ' + (len + 10));
  roadGold.setAttribute('opacity', gold > 0 ? '1' : '0');

  // ամրոցը լուսավորվում է, երբ ամեն ինչ արված է
  document.getElementById('castleGlow').setAttribute('opacity', reached === STOPS.length ? '0.95' : '0.35');

  gStops.textContent = '';
  STOPS.forEach((s, i) => {
    const { p } = stopPoint(i);
    const isDone = doneArr[i];
    const open = isOpen(i);                  // բացված է, թե դեռ փակ
    const cur = i === reached;               // հենց հիմա այստեղ ես

    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'stopHit');
    g.dataset.i = i;

    if (cur) {
      const ring = document.createElementNS(SVGNS, 'circle');
      ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y); ring.setAttribute('r', 26);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#ffe9a8'); ring.setAttribute('stroke-width', '2.5');
      ring.setAttribute('opacity', '0.9');
      const an = document.createElementNS(SVGNS, 'animate');
      an.setAttribute('attributeName', 'r'); an.setAttribute('values', '19;30;19');
      an.setAttribute('dur', '1.6s'); an.setAttribute('repeatCount', 'indefinite');
      const an2 = document.createElementNS(SVGNS, 'animate');
      an2.setAttribute('attributeName', 'opacity'); an2.setAttribute('values', '0.9;0.15;0.9');
      an2.setAttribute('dur', '1.6s'); an2.setAttribute('repeatCount', 'indefinite');
      ring.appendChild(an); ring.appendChild(an2);
      g.appendChild(ring);
    }

    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 17);
    c.setAttribute('fill', isDone ? 'url(#goldG)' : (open ? '#f5eede' : '#5a6078'));
    c.setAttribute('stroke', '#10162a'); c.setAttribute('stroke-width', '3');
    g.appendChild(c);

    if (isDone) {
      // ոսկե կանգառի նշանը՝ թռչող թև, ոչ թե emoji
      const ok = document.createElementNS(SVGNS, 'path');
      ok.setAttribute('d', 'M ' + (p.x - 7) + ' ' + p.y + ' l 5 6 l 9 -11');
      ok.setAttribute('fill', 'none'); ok.setAttribute('stroke', '#10162a');
      ok.setAttribute('stroke-width', '3.4'); ok.setAttribute('stroke-linecap', 'round');
      ok.setAttribute('stroke-linejoin', 'round');
      g.appendChild(ok);
    } else {
      const n = document.createElementNS(SVGNS, 'text');
      n.setAttribute('x', p.x); n.setAttribute('y', p.y + 0.5);
      n.setAttribute('class', 'stopNum' + (open ? '' : ' stopNumLock'));
      n.textContent = String(i + 1);
      g.appendChild(n);
    }

    // անունը՝ այն կողմում, որտեղ տեղ կա
    const left = p.x > 200;
    const lbl = document.createElementNS(SVGNS, 'text');
    lbl.setAttribute('x', left ? p.x - 25 : p.x + 25);
    lbl.setAttribute('y', p.y + 5);
    lbl.setAttribute('text-anchor', left ? 'end' : 'start');
    lbl.setAttribute('class', 'stopLbl');
    lbl.setAttribute('opacity', open ? '1' : '0.55');
    lbl.textContent = s.g;
    g.appendChild(lbl);

    // մեծ անտեսանելի շրջան, որ մատով հեշտ լինի դիպչել
    const hit = document.createElementNS(SVGNS, 'circle');
    hit.setAttribute('cx', p.x); hit.setAttribute('cy', p.y); hit.setAttribute('r', 32);
    hit.setAttribute('fill', 'transparent');
    g.appendChild(hit);

    gStops.appendChild(g);
  });
}

// ——— վահանակը բացել ———
function openStop(i) {
  const s = STOPS[i];
  openIndex = i;
  const v = recordOf(s);
  document.getElementById('pStop').textContent = T.stop(i + 1);
  document.getElementById('pGame').textContent = s.g;
  document.getElementById('pTask').textContent = taskText(s);
  document.getElementById('pNow').textContent = realArr[i] ? T.done : T.now(nowText(s, v));
  const go = document.getElementById('pGo');
  if (isOpen(i)) {
    go.textContent = T.go;
    go.setAttribute('href', s.href);
    go.classList.remove('off');
  } else {
    go.textContent = T.locked(reached + 1);
    go.removeAttribute('href');
    go.classList.add('off');
  }
  document.getElementById('pClose').textContent = T.close;
  panel.hidden = false;
  document.body.classList.add('panelOpen');
  tone(520, 0.1, 'sine');
}
function closePanel() { panel.hidden = true; document.body.classList.remove('panelOpen'); openIndex = -1; }

gStops.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  initAudio();
  const g = e.target.closest('.stopHit');
  if (!g) return;
  openStop(Number(g.dataset.i));
});
document.getElementById('allBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  initAudio(); tone(preview ? 440 : 700, 0.14, 'triangle');
  preview = !preview;
  try { sessionStorage.setItem('aren-quest-openall', preview ? '1' : '0'); } catch (e) {}
  if (!preview) hideWin();
  render();
  if (openIndex >= 0) openStop(openIndex);   // բաց վահանակը թարմացնում ենք
  if (preview) setTimeout(showWin, 420);     // ոսկեզօծեցինք — հիմա վերջը տես
});
document.getElementById('endBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  showWin();
});
document.getElementById('pClose').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  closePanel();
});
document.getElementById('pGo').addEventListener('click', (e) => {
  if (!e.currentTarget.getAttribute('href')) e.preventDefault();
});

// ——— ամրոցին դիպչելով նորից կարող ես տոնը տեսնել ———
document.getElementById('castle').style.cursor = 'pointer';
document.getElementById('castle').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  if (reached === STOPS.length) showWin();
});

// ——————————————————————————————————————
//  ՏՈՆԸ 🎉 — երբ Ոսկե Թագը տուն է գալիս
// ——————————————————————————————————————
const cvs = document.getElementById('confetti');
const cx2 = cvs.getContext('2d');
let bits = [], confRaf = 0;

function showWin() {
  document.getElementById('wTitle').textContent = T.winT;
  document.getElementById('wText').textContent = T.winS;
  document.getElementById('wHome').textContent = T.home;
  document.getElementById('wClose').textContent = T.close;
  document.getElementById('win').hidden = false;
  startConfetti();
  fanfare();
}
function hideWin() {
  document.getElementById('win').hidden = true;
  cvs.hidden = true;
  cancelAnimationFrame(confRaf); confRaf = 0; bits = [];
}
document.getElementById('wClose').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  hideWin();
});

function startConfetti() {
  cvs.hidden = false;
  cvs.width = innerWidth; cvs.height = innerHeight;
  const cols = ['#f0c85a', '#ffe9a8', '#e0a93c', '#f5eede', '#7fd1c1', '#e8756a'];
  bits = [];
  for (let i = 0; i < 90; i++) {
    bits.push({
      x: Math.random() * cvs.width,
      y: -Math.random() * cvs.height,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 9,
      vy: 1.4 + Math.random() * 2.4,
      vx: (Math.random() - 0.5) * 1.4,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.2,
      c: cols[Math.floor(Math.random() * cols.length)],
    });
  }
  if (!confRaf) confRaf = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
  cx2.clearRect(0, 0, cvs.width, cvs.height);
  for (const b of bits) {
    b.x += b.vx; b.y += b.vy; b.a += b.va;
    if (b.y > cvs.height + 20) { b.y = -20; b.x = Math.random() * cvs.width; }
    cx2.save();
    cx2.translate(b.x, b.y); cx2.rotate(b.a);
    cx2.fillStyle = b.c;
    cx2.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    cx2.restore();
  }
  confRaf = requestAnimationFrame(stepConfetti);
}
function fanfare() {
  initAudio();
  if (!actx) return;
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.16), i * 150));
}

// ——————————————————————————————————————
//  ՄԵԿՆԱՐԿԸ
// ——————————————————————————————————————
render();

// պատմությունը ցույց ենք տալիս միայն առաջին անգամ
let seen = false;
try { seen = localStorage.getItem('aren-quest-seen') === '1'; } catch (e) {}
const story = document.getElementById('story');
if (!seen) {
  document.getElementById('sTitle').textContent = T.title;
  document.getElementById('sText').textContent = T.story;
  document.getElementById('sBtn').textContent = T.begin;
  story.hidden = false;
}
document.getElementById('sBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  initAudio(); tone(660, 0.16, 'triangle');
  story.hidden = true;
  try { localStorage.setItem('aren-quest-seen', '1'); } catch (e) {}
  scrollToCurrent();
});

// ճանապարհը ներքևից է սկսվում — իջնում ենք այնտեղ, որտեղ հիմա ես
function scrollToCurrent() {
  const svg = document.getElementById('map');
  const k = svg.getBoundingClientRect().width / 400;   // viewBox-ից էկրան
  const i = Math.min(reached, STOPS.length - 1);
  const { p } = stopPoint(i);
  const top = svg.getBoundingClientRect().top + scrollY;
  scrollTo({ top: Math.max(0, top + p.y * k - innerHeight * 0.55), behavior: 'smooth' });
}
if (seen) scrollToCurrent();

// թագը վերադարձավ — տոնում ենք մեկ անգամ, ինքնաբերաբար
let celebrated = false;
try { celebrated = localStorage.getItem('aren-quest-crown') === '1'; } catch (e) {}
if (!preview && reached === STOPS.length && !celebrated) {
  try { localStorage.setItem('aren-quest-crown', '1'); } catch (e) {}
  story.hidden = true;
  setTimeout(showWin, 500);
}

addEventListener('resize', () => { if (!cvs.hidden) { cvs.width = innerWidth; cvs.height = innerHeight; } });
</script>
