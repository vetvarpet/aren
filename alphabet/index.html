<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Alphabet 🔤</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1d1430; }
  body {
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif;
    color: #f5eede;
    background: linear-gradient(#2a1e3f, #16243f);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 54px 12px 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
  }

  #hud {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: #bdb2d8;
  }
  #hud b { color: #ffd76e; }
  #roundName {
    font-size: 1rem;
    color: #ffd76e;
    text-align: center;
    line-height: 1.25;
  }
  #prompt {
    font-size: 0.86rem;
    color: #cbb8dd;
    text-align: center;
    min-height: 1.2em;
  }

  /* «hidden» պիտակը պարտվում է display:flex/grid-ին — ուժեղացնում ենք */
  #ov[hidden], #qBig[hidden], #qSeq[hidden], #qPic[hidden] { display: none !important; }

  #qwrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 168px;
    width: 100%;
  }
  #qBig {
    font-size: 5.4rem;
    line-height: 1;
    color: #ffd76e;
    text-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  #qSeq { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .seqBox {
    min-width: 54px;
    height: 64px;
    padding: 0 6px;
    border-radius: 12px;
    background: #2d2350;
    border: 2px solid #4d3f80;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1rem;
    color: #ffd76e;
  }
  .seqBox.q { border-style: dashed; color: #8d7fbb; }
  #qPic { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #picCv { width: 132px; height: 112px; display: block; }
  #qWord { font-size: 1.5rem; color: #ffd76e; letter-spacing: 1px; }
  #qTr { font-size: 0.8rem; color: #a79bc4; min-height: 1em; }

  #opts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 330px;
  }
  #opts button {
    font-family: inherit;
    font-size: 2rem;
    font-weight: bold;
    color: #f3ecff;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    border-radius: 14px;
    padding: 10px 4px;
    min-height: 64px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s, background 0.12s, border-color 0.12s;
  }
  #opts button:active { transform: scale(0.94); }
  #opts button.good { background: #1f6e4e; border-color: #6ee7b7; color: #dfffef; }
  #opts button.bad { background: #6e2230; border-color: #ff7b6b; color: #ffe3df; }

  #msg { min-height: 1.4em; font-size: 0.95rem; font-weight: bold; color: #6ee7b7; text-align: center; }

  #ov {
    position: fixed; inset: 0; z-index: 8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 26px 18px;
    background: rgba(12, 8, 24, 0.9);
  }
  #ovTitle { font-size: 1.7rem; color: #ffd76e; }
  #ovText { font-size: 0.95rem; color: #dfd2ea; line-height: 1.5; max-width: 330px; white-space: pre-line; }
  #ovMash {
    font-size: 0.84rem; color: #9ad6ff; line-height: 1.45; max-width: 330px;
    border-top: 2px solid rgba(255,255,255,0.14);
    border-bottom: 2px solid rgba(255,255,255,0.14);
    padding: 8px 4px;
  }
  #ovBest { font-size: 1rem; color: #6ee7b7; }
  #ovTap { margin-top: 8px; font-size: 1.1rem; color: #6ee7b7; }
</style>

function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

  c.fillStyle = '#f6f4ee'; c.beginPath(); c.arc(0, 0, 34, 0, 6.3); c.fill();
  c.strokeStyle = '#2b3550'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 34, 0, 6.3); c.stroke();
  c.fillStyle = '#2b3550';
  const pent = (cx, cy, r, rot) => {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * Math.PI * 2 / 5;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.closePath(); c.fill();
  };
  pent(0, 0, 12, -Math.PI / 2);
  pent(0, -26, 8, Math.PI / 2);
  pent(-25, 8, 8, -Math.PI / 2);
  pent(25, 8, 8, -Math.PI / 2);
}
const PAINT = {
  sun: paintSun, banana: paintBanana, book: paintBook, pumpkin: paintPumpkin, bell: paintBell,
  butterfly: paintButterfly, clock: paintClock, plane: paintPlane, moon: paintMoon, apple: paintApple,
  tree: paintTree, cat: paintCat, bread: paintBread, fish: paintFish, pencil: paintPencil,
  boat: paintBoat, dog: paintDog, drop: paintDrop, mountain: paintMountain, rose: paintRose,
  house: paintHouse, elephant: paintElephant, snake: paintSnake, ball: paintBall,
};
function drawPic(id) {
  pc.setTransform(1, 0, 0, 1, 0, 0);
  pc.clearRect(0, 0, pcv.width, pcv.height);
  pc.save();
  pc.translate(pcv.width / 2, pcv.height / 2);
  pc.scale(2, 2);   // կտավը կրկնակի մեծ է՝ որ հեռախոսին սուր երևա
  PAINT[id](pc);
  pc.restore();
}

// ——— Խաղի վիճակը ———
const QN = 20;
let state = 'menu', endedAt = 0;
let qi = 0, score = 0, answer = '', locked = false;
let usedPics = [];
let best = 0;
try { best = Number(localStorage.getItem('aren-alphabet-best') || 0); } catch (e) {}

const elHud = document.getElementById('hud');
const elRound = document.getElementById('roundName');
const elPrompt = document.getElementById('prompt');
const elOpts = document.getElementById('opts');
const elMsg = document.getElementById('msg');
const qBig = document.getElementById('qBig');
const qSeq = document.getElementById('qSeq');
const qPic = document.getElementById('qPic');
const ov = document.getElementById('ov');

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Երեք «խաբող» տարբերակ՝ ճիշտից տարբեր
function decoys(pool, right, n) {
  const rest = pool.filter(x => x !== right);
  return shuffle(rest.slice()).slice(0, n);
}

function syncHud() {
  elHud.innerHTML = '';
  const a = document.createElement('span');
  a.textContent = T.qLbl(Math.min(qi + 1, QN));
  const b = document.createElement('span');
  b.innerHTML = T.sc + '<b>' + score + '</b>';
  elHud.appendChild(a); elHud.appendChild(b);
}

function nextQuestion() {
  locked = false;
  elMsg.textContent = '';
  qBig.hidden = true; qSeq.hidden = true; qPic.hidden = true;
  const round = qi % 3;   // 0 → տառի զույգ, 1 → հաջորդ տառը, 2 → նկարը
  let opts = [];

  if (round === 0) {
    const i = Math.floor(Math.random() * UP.length);
    const upFirst = Math.random() < 0.5;       // երբեմն մեծատառն ենք ցույց տալիս, երբեմն՝ փոքրը
    elRound.textContent = T.rn1;
    elPrompt.textContent = upFirst ? T.r1a : T.r1b;
    qBig.textContent = upFirst ? UP[i] : LOW[i];
    qBig.hidden = false;
    answer = upFirst ? LOW[i] : UP[i];
    opts = decoys(upFirst ? LOW : UP, answer, 3).concat([answer]);
  } else if (round === 1) {
    const i = Math.floor(Math.random() * (UP.length - 3));
    elRound.textContent = T.rn2;
    elPrompt.textContent = '';
    qSeq.innerHTML = '';
    for (let k = 0; k < 3; k++) {
      const d = document.createElement('div');
      d.className = 'seqBox';
      d.textContent = UP[i + k];
      qSeq.appendChild(d);
    }
    const q = document.createElement('div');
    q.className = 'seqBox q';
    q.textContent = '?';
    qSeq.appendChild(q);
    qSeq.hidden = false;
    answer = UP[i + 3];
    opts = decoys(UP, answer, 3).concat([answer]);
  } else {
    if (!usedPics.length) usedPics = shuffle(PICS.map((_, k) => k));
    const p = PICS[usedPics.pop()];
    elRound.textContent = T.rn3;
    elPrompt.textContent = '';
    drawPic(p[0]);
    document.getElementById('qWord').textContent = p[1];
    // Հայերենով խաղալիս թարգմանությունը ավելորդ է
    document.getElementById('qTr').textContent = ggLang === 'hy' ? '' : T.w[p[0]];
    qPic.hidden = false;
    answer = p[2];
    opts = decoys(UP, answer, 3).concat([answer]);
  }

  shuffle(opts);
  elOpts.innerHTML = '';
  opts.forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch;
    b.dataset.ch = ch;
    b.addEventListener('pointerdown', (e) => {
      if (isGhost(e)) return;
      e.preventDefault();
      answerTap(b, ch);
    });
    elOpts.appendChild(b);
  });
  syncHud();
}

function answerTap(btn, ch) {
  if (state !== 'play' || locked) return;
  initAudio();
  locked = true;
  const right = ch === answer;
  if (right) {
    score++;
    btn.classList.add('good');
    elMsg.textContent = T.yes;
    elMsg.style.color = '#6ee7b7';
    sYes();
  } else {
    btn.classList.add('bad');
    // ճիշտ պատասխանը միշտ ցույց ենք տալիս՝ որ սովորի
    for (const b of elOpts.children) if (b.dataset.ch === answer) b.classList.add('good');
    elMsg.textContent = T.no;
    elMsg.style.color = '#ffb3a7';
    sNo();
  }
  syncHud();
  qi++;
  setTimeout(() => {
    if (state !== 'play') return;
    if (qi >= QN) endGame();
    else { sNext(); nextQuestion(); }
  }, right ? 750 : 1250);
}

function startGame() {
  state = 'play';
  qi = 0; score = 0; usedPics = [];
  ov.hidden = true;
  nextQuestion();
}

function endGame() {
  state = 'over';
  endedAt = Date.now();
  sEnd();
  if (score > best) {
    best = score;
    try { localStorage.setItem('aren-alphabet-best', best); } catch (e) {}
    confetti();
  }
  document.getElementById('ovTitle').textContent = score >= QN ? T.perfect : T.done;
  document.getElementById('ovText').textContent = T.sc + score + ' / ' + QN;
  document.getElementById('ovMash').textContent = T.mash;
  document.getElementById('ovBest').textContent = T.best + best;
  document.getElementById('ovTap').textContent = T.again;
  ov.hidden = false;
}

// ——— Հպումները ———
// Հեռախոսը հպումից հետո «ուրվական» մկնիկ է ուղարկում — հիշում ենք վերջին հպումը
let lastTouchAt = 0;
function isGhost(e) {
  if (e.pointerType === 'touch') { lastTouchAt = Date.now(); return false; }
  return Date.now() - lastTouchAt < 700;
}
ov.addEventListener('pointerdown', (e) => {
  if (isGhost(e)) return;
  e.preventDefault();
  initAudio();
  if (state === 'over' && Date.now() - endedAt < 1100) return;   // սպասիր, որ պատահական չսկսես
  startGame();
});

function confetti() {
  const stuff = ['🎉', '🔤', '⭐', '💛', '🎊', '✨'];
  for (let k = 0; k < 34; k++) {
    const s = document.createElement('span');
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.cssText = 'position:fixed;top:-50px;z-index:20;pointer-events:none;left:' + (Math.random() * 100) + 'vw;font-size:' + (16 + Math.random() * 20) + 'px;transition:transform ' + (2 + Math.random() * 2) + 's linear';
    document.body.appendChild(s);
    requestAnimationFrame(() => { s.style.transform = 'translateY(115vh) rotate(720deg)'; });
    setTimeout(() => s.remove(), 4600);
  }
}

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// ——— Մեկնարկի էկրանը ———
document.getElementById('ovTitle').textContent = T.title;
document.getElementById('ovText').textContent = T.h1 + '\n' + T.h2;
document.getElementById('ovMash').textContent = T.mash;
document.getElementById('ovBest').textContent = best > 0 ? T.best + best : '';
document.getElementById('ovTap').textContent = T.start;
elRound.textContent = T.title;
elPrompt.textContent = T.h2;
elHud.textContent = '';
</script>
