    lake: { pic: '🌊', txt: 'The golden fish swims by the shore. “The stamp is in the crow’s nest at the top of the tallest tree. But careful — the branches are thin.”', ch: [
      ['Climb the tree, whatever happens 🌳', 'end_tree'],
      ['Ask the fish for three wishes 🐟', 'end_wish'],
    ]},
    lamp: { pic: '💡', txt: 'The lamp glows softly: “Founders never die, little cat. Here is an idea: crows love shiny things. Bring them the golden note from the piano — they will trade.”', ch: [
      ['Take the golden note to the crows 🎵', 'end_trade'],
      ['No, better go to the lake 🌊', 'lake'],
    ]},
    crows: { pic: '🐦‍⬛', txt: 'The crows notice you and scatter in fright. The stamp falls down… right into the old burrow of the little snake. A “sssss” comes from inside.', ch: [
      ['Reach into the burrow 🐍', 'end_snake'],
      ['Ask the crows politely 🤝', 'end_polite'],
    ]},
    end_sleep: { pic: '😴', end: 1, txt: 'In the morning the stamp is back in its place — it turns out it was taken away for cleaning. All is well, but you slept through the greatest adventure.' },
    end_bird: { pic: '🐦', end: 2, txt: 'The birdie shoots into the sky and returns five minutes later with the stamp. “I pawned my 21-point crown, but friendship is worth more.” You go home as heroes.' },

const S = STORIES[ggLang] || STORIES.en;
const ENDINGS = 7;

// Գտած վերջերը պահում ենք որպես բիթերի քսակ (1..7)
let found = 0;
try { found = Number(localStorage.getItem('aren-story-ends-mask') || 0); } catch (e) {}
const countBits = m => { let c = 0; for (let i = 0; i < ENDINGS; i++) if (m & (1 << i)) c++; return c; };

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sPage = () => tone(520, 0.07, 'sine', 0.08);
const sEnd = () => [523, 659, 784].forEach((f, k) => tone(f, 0.2, 'triangle', 0.15, k * 0.1));

const $ = id => document.getElementById(id);
$('btnRestart').textContent = T.again;

function show(id) {
  const node = S[id];
  $('pic').textContent = node.pic;
  $('txt').textContent = node.txt;
  const box = $('choices');
  box.innerHTML = '';
  if (node.end) {
    // Վերջ է. նշում ենք գտածների մեջ ու պահում
    found |= (1 << (node.end - 1));
    try {
      localStorage.setItem('aren-story-ends-mask', String(found));
      localStorage.setItem('aren-story-ends', String(countBits(found)));
    } catch (e) {}
    sEnd();
    $('endBadge').textContent = T.endN(node.end);
    // աստղիկներով ցույց ենք տալիս, թե որ վերջերն են գտնված
    let stars = '';
    for (let i = 0; i < ENDINGS; i++) stars += (found & (1 << i)) ? '⭐' : '▫️';
    $('endStars').textContent = stars;
    const c = countBits(found);
    $('endFound').textContent = c === ENDINGS ? T.allFound : T.found(c, ENDINGS);
    $('endBox').hidden = false;
  } else {
    $('endBox').hidden = true;
    node.ch.forEach(([label, next]) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = label;
      b.addEventListener('pointerdown', () => { initAudio(); sPage(); show(next); });
      box.appendChild(b);
    });
  }
}
$('btnRestart').addEventListener('pointerdown', () => { sPage(); show('start'); });
show('start');

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
