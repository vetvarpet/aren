<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Maze 🌀</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(#2a1e3f, #1a2a4a); touch-action: none; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../" style="position:fixed;top:52px;left:12px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<canvas id="game"></canvas>

<script>
// ——————————————————————————————————————
//  ԼԱԲԻՐԻՆԹՈՍ 🌀 — 10 ՄԱԿԱՐԴԱԿ
//  Պահիր մատդ էկրանին՝ գնդակը գնում է հետևից։
//  Ամեն մակարդակ ավելի մեծ է, երաժշտությունն էլ՝ ավելի արագ 🎵
// ——————————————————————————————————————

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TR = {
  hy: {
    level: (l, m) => 'Մակարդակ ' + l + '/' + m,
    sec: t => t + ' վրկ',
    hint: 'Պահիր մատդ էկրանին՝ գնդակը կգա հետևից',
    passed: l => 'Մակարդակ ' + l + ' անցա՜ր',
    inTime: t => t + ' վայրկյանում',
    next: l => 'Սեղմիր՝ մակարդակ ' + l,
    champ: 'ԴՈՒ ՉԵՄՊԻՈՆ ԵՍ',
    champSub: m => 'Անցար բոլոր ' + m + ' մակարդակը',
    again: 'Սեղմիր՝ նորից սկզբից',
  },
  ru: {
    level: (l, m) => 'Уровень ' + l + '/' + m,
    sec: t => t + ' сек',
    hint: 'Держи палец на экране — шарик пойдёт за ним',
    passed: l => 'Уровень ' + l + ' пройден!',
    inTime: t => 'за ' + t + ' секунд',
    next: l => 'Нажми — уровень ' + l,
    champ: 'ТЫ ЧЕМПИОН',
    champSub: m => 'Пройдены все ' + m + ' уровней',
    again: 'Нажми — начать заново',
  },
  en: {
    level: (l, m) => 'Level ' + l + '/' + m,
    sec: t => t + ' s',
    hint: 'Hold your finger on the screen — the ball follows it',
    passed: l => 'Level ' + l + ' complete!',
    inTime: t => 'in ' + t + ' seconds',
    next: l => 'Tap for level ' + l,
    champ: 'YOU ARE THE CHAMPION',
    champSub: m => 'All ' + m + ' levels complete',
    again: 'Tap to start over',
  },
  es: {
    level: (l, m) => 'Nivel ' + l + '/' + m,
    sec: t => t + ' s',
    hint: 'Mantén el dedo en la pantalla: la bola lo sigue',
    passed: l => '¡Nivel ' + l + ' superado!',
    inTime: t => 'en ' + t + ' segundos',
    next: l => 'Toca — nivel ' + l,
    champ: 'ERES EL CAMPEÓN',
    champSub: m => 'Superaste los ' + m + ' niveles',
    again: 'Toca para empezar de nuevo',
  },
  fr: {
    level: (l, m) => 'Niveau ' + l + '/' + m,
    sec: t => t + ' s',
    hint: 'Garde le doigt sur l’écran : la bille le suit',
    passed: l => 'Niveau ' + l + ' réussi !',
    inTime: t => 'en ' + t + ' secondes',
    next: l => 'Touche — niveau ' + l,
    champ: 'TU ES LE CHAMPION',
    champSub: m => 'Tous les ' + m + ' niveaux réussis',
    again: 'Touche pour recommencer',
  },
  de: {
    level: (l, m) => 'Level ' + l + '/' + m,
    sec: t => t + ' s',
    hint: 'Lass den Finger auf dem Bildschirm — die Kugel folgt ihm',
    passed: l => 'Level ' + l + ' geschafft!',
    inTime: t => 'in ' + t + ' Sekunden',
    next: l => 'Tippe — Level ' + l,
    champ: 'DU BIST DER CHAMPION',
    champSub: m => 'Alle ' + m + ' Level geschafft',
    again: 'Tippe, um von vorn zu beginnen',
  },
  ja: {
    level: (l, m) => 'レベル ' + l + '/' + m,
    sec: t => t + '秒',
    hint: '画面に指を置いてね。ボールがついてくるよ',
    passed: l => 'レベル' + l + 'クリア！',
    inTime: t => t + '秒で',
    next: l => 'タップでレベル' + l + 'へ',
    champ: 'チャンピオンだ！',
    champSub: m => '全' + m + 'レベルクリア',
    again: 'タップで最初から',
  },
  zh: {
    level: (l, m) => '第' + l + '/' + m + '关',
    sec: t => t + '秒',
    hint: '手指按住屏幕，小球会跟着走',
    passed: l => '第' + l + '关过关！',
    inTime: t => '用了' + t + '秒',
    next: l => '点一下去第' + l + '关',
    champ: '你是冠军',
    champSub: m => '通关全部' + m + '关',
    again: '点一下重新开始',
  },
};
const T = TR[ggLang] || TR.hy;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ——— Ձայներն ու ԵՐԱԺՇՏՈՒԹՅՈՒՆԸ ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  startMusic();
}
function beep(f1, f2, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => beep(f, f, 0.25, 'triangle', 0.2, k * 0.13));

// Արագ չիպթյուն մեղեդի, որ պտտվում է անվերջ։
// Թվերը կիսատոներ են․ ինչքան մեծ, այնքան բարձր նոտա։ -1 = դադար։
const MELODY = [0, 3, 7, 12, 7, 3, 5, 7, 10, 7, 5, 3, 2, 3, 5, -1];
const BASS   = [0, -1, 0, -1, 5, -1, 5, -1, 3, -1, 3, -1, 2, -1, 2, -1];
let musicOn = true;
let musicStarted = false;
let stepIdx = 0;
let musicTimer = null;

function musicStepMs() {
  // 1-ին մակարդակում՝ 150 BPM, ամեն մակարդակ մի քիչ ավելի արագ,
  // բայց 230-ից արագ չի դառնում, թե չէ ականջներդ կպայթեն 😄
  const bpm = Math.min(230, 150 + (level - 1) * 2);
  return 60000 / bpm / 2;   // ամեն քայլը կես բիթ է
}
function musicTick() {
  if (!musicOn || !actx) return;
  const m = MELODY[stepIdx % 16];
  const b = BASS[stepIdx % 16];
  if (m >= 0) beep(330 * Math.pow(2, m / 12), 330 * Math.pow(2, m / 12), 0.11, 'square', 0.045);
  if (b >= 0) beep(83 * Math.pow(2, b / 12), 83 * Math.pow(2, b / 12), 0.18, 'triangle', 0.09);
  stepIdx++;
}
function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  scheduleMusic();
}
function scheduleMusic() {
  clearInterval(musicTimer);
  musicTimer = setInterval(musicTick, musicStepMs());
}

// ——— Մակարդակները ———
// 100 մակարդակ։ Չափսը մեծանում է մինչև հսկան (16×24), հետո ամեն
// մակարդակ նոր հսկա լաբիրինթոս է՝ մինչև 100-րդը։ Անցար՝ չեմպիոն ես 🏆
const MAX_LEVEL = 100;
function levelSize(lv) {
  return [
    Math.min(16, 5 + Math.floor((lv - 1) * 0.55)),
    Math.min(24, 7 + Math.floor((lv - 1) * 0.8)),
  ];
}
let level = 1;
let maxLevel = 1;
try {
  level = Math.min(MAX_LEVEL, Number(localStorage.getItem('aren-maze-level') || 1) || 1);
  maxLevel = Math.min(MAX_LEVEL, Number(localStorage.getItem('aren-maze-max') || 1) || 1);
} catch (e) {}

let COLS, ROWS, walls, exitCell, state, timerOn, startTime, finishTime;
const pos = { x: 0.5, y: 0.5 };   // գնդակի տեղը՝ վանդակի չափերով

function newMaze() {
  [COLS, ROWS] = levelSize(level);
  walls = [];
  for (let c = 0; c < COLS; c++) {
    walls[c] = [];
    for (let r = 0; r < ROWS; r++) walls[c][r] = [true, true, true, true];
  }
  const seen = Array.from({ length: COLS }, () => Array(ROWS).fill(false));
  const stack = [[0, 0]];
  seen[0][0] = true;
  const DIRS = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const options = DIRS.filter(([dx, dy]) => {
      const nc = c + dx, nr = r + dy;
      return nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !seen[nc][nr];
    });
    if (!options.length) { stack.pop(); continue; }
    const [dx, dy, w1, w2] = options[Math.floor(Math.random() * options.length)];
    const nc = c + dx, nr = r + dy;
    walls[c][r][w1] = false;
    walls[nc][nr][w2] = false;
    seen[nc][nr] = true;
    stack.push([nc, nr]);
  }
  pos.x = 0.5;
  pos.y = 0.5;
  exitCell = { c: COLS - 1, r: ROWS - 1 };
  state = 'play';           // play → levelDone → champion
  timerOn = false;
  startTime = 0;
  finishTime = 0;
  scheduleMusic();          // տեմպը թարմացվում է մակարդակի հետ
}
newMaze();

// ——— Չափերը էկրանին ———
function metrics() {
  const cell = Math.min((W - 24) / COLS, (H - 130) / ROWS);
  const ox = (W - cell * COLS) / 2;
  const oy = 70 + (H - 130 - cell * ROWS) / 2;
  return { cell, ox, oy };
}

// ——— Ձայնի կոճակը (վերևի աջ անկյունում) ———
function speakerBox() { return { x: W - 46, y: 58, r: 22 }; }

// ——— Մատին հետևելը ———
let finger = null;
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const sp = speakerBox();
  if (Math.hypot(e.clientX - sp.x, e.clientY - sp.y) < sp.r + 8) {
    musicOn = !musicOn;
    return;
  }
  if (state === 'levelDone') { level = Math.min(MAX_LEVEL, level + 1); saveLevel(); newMaze(); return; }
  if (state === 'champion') { level = 1; saveLevel(); newMaze(); return; }
  finger = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', (e) => {
  if (finger) finger = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => { finger = null; });
canvas.addEventListener('pointercancel', () => { finger = null; });
canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function saveLevel() {
  try {
    localStorage.setItem('aren-maze-level', level);
    if (level > maxLevel) maxLevel = level;
    localStorage.setItem('aren-maze-max', maxLevel);
  } catch (e) {}
}

// Ստեղնաշարով էլ կարելի է
const keys = {};
document.addEventListener('keydown', (e) => {
  const map = { ArrowUp: 'u', ArrowRight: 'r', ArrowDown: 'd', ArrowLeft: 'l' };
  if (map[e.code]) {
    e.preventDefault();
    initAudio();
    if (state !== 'play') return;
    keys[map[e.code]] = true;
  }
  if (state === 'levelDone' && (e.code === 'Space' || e.code === 'Enter')) { level = Math.min(MAX_LEVEL, level + 1); saveLevel(); newMaze(); }
  else if (state === 'champion' && (e.code === 'Space' || e.code === 'Enter')) { level = 1; saveLevel(); newMaze(); }
});
document.addEventListener('keyup', (e) => {
  const map = { ArrowUp: 'u', ArrowRight: 'r', ArrowDown: 'd', ArrowLeft: 'l' };
  if (map[e.code]) keys[map[e.code]] = false;
});

// ——— Պատերի ֆիզիկան ———
const RAD = 0.30;
const WT = 0.06;
function clampToWalls() {
  const c = Math.max(0, Math.min(COLS - 1, Math.floor(pos.x)));
  const r = Math.max(0, Math.min(ROWS - 1, Math.floor(pos.y)));
  const w = walls[c][r];
  const lo = RAD + WT, hi = 1 - RAD - WT;
  if (w[0]) pos.y = Math.max(pos.y, r + lo);
  if (w[2]) pos.y = Math.min(pos.y, r + hi);
  if (w[3]) pos.x = Math.max(pos.x, c + lo);
  if (w[1]) pos.x = Math.min(pos.x, c + hi);
  pos.x = Math.max(lo * 0.5, Math.min(COLS - lo * 0.5, pos.x));
  pos.y = Math.max(lo * 0.5, Math.min(ROWS - lo * 0.5, pos.y));
}

function moveToward(tx, ty) {
  let dx = tx - pos.x, dy = ty - pos.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.02) return false;
  const speed = Math.min(0.17, dist);
  dx = dx / dist * speed;
  dy = dy / dist * speed;
  const steps = Math.ceil(speed / 0.05);
  let moved = false;
  for (let s = 0; s < steps; s++) {
    const ox = pos.x, oy = pos.y;
    pos.x += dx / steps; clampToWalls();
    pos.y += dy / steps; clampToWalls();
    if (Math.abs(pos.x - ox) > 0.001 || Math.abs(pos.y - oy) > 0.001) moved = true;
  }
  return moved;
}

// ——— Խաղի քայլը ———
let frame = 0;
function update() {
  frame++;
  if (state !== 'play') return;

  let moved = false;
  if (finger) {
    const { cell, ox, oy } = metrics();
    moved = moveToward((finger.x - ox) / cell, (finger.y - oy) / cell);
  } else {
    let dx = 0, dy = 0;
    if (keys.u) dy -= 1;
    if (keys.d) dy += 1;
    if (keys.l) dx -= 1;
    if (keys.r) dx += 1;
    if (dx || dy) moved = moveToward(pos.x + dx, pos.y + dy);
  }

  if (moved && !timerOn) { timerOn = true; startTime = performance.now(); }

  // հասա՞ր ելքին
  if (Math.floor(pos.x) === exitCell.c && Math.floor(pos.y) === exitCell.r) {
    finger = null;
    finishTime = (performance.now() - startTime) / 1000;
    sWin();
    if (level === MAX_LEVEL) {
      state = 'champion';
      confetti();
      confetti();
    } else {
      state = 'levelDone';
      if (level + 1 > maxLevel) confetti();
      saveLevel();
    }
  }
}

// ——— Նկարելը ———
function draw() {
  ctx.fillStyle = '#1d1d3f';
  ctx.fillRect(0, 0, W, H);

  const { cell, ox, oy } = metrics();

  // ելքը՝ կանաչ վանդակ դրոշիկով
  const ex = ox + exitCell.c * cell, ey = oy + exitCell.r * cell;
  ctx.fillStyle = '#2f855a';
  ctx.fillRect(ex + 2, ey + 2, cell - 4, cell - 4);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ex + cell * 0.35, ey + cell * 0.75);
  ctx.lineTo(ex + cell * 0.35, ey + cell * 0.25);
  ctx.stroke();
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(ex + cell * 0.35, ey + cell * 0.25);
  ctx.lineTo(ex + cell * 0.68, ey + cell * 0.35);
  ctx.lineTo(ex + cell * 0.35, ey + cell * 0.45);
  ctx.closePath();
  ctx.fill();

  // պատերը
  ctx.strokeStyle = '#8f7ae0';
  ctx.lineWidth = Math.max(2.5, cell * 0.09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const x = ox + c * cell, y = oy + r * cell;
      const w = walls[c][r];
      if (w[0]) { ctx.moveTo(x, y); ctx.lineTo(x + cell, y); }
      if (w[1]) { ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); }
      if (w[2]) { ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); }
      if (w[3]) { ctx.moveTo(x, y); ctx.lineTo(x, y + cell); }
    }
  }
  ctx.stroke();

  // մատի նշանը
  if (finger && state === 'play') {
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(finger.x, finger.y, 18 + Math.sin(frame * 0.2) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  // գնդակը՝ դեղին, ժպտացող
  const px = ox + pos.x * cell;
  const py = oy + pos.y * cell;
  const pr = cell * RAD;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2e2410';
  ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.2, pr * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(px + pr * 0.35, py - pr * 0.2, pr * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2e2410';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py + pr * 0.15, pr * 0.4, 0.2, Math.PI - 0.2); ctx.stroke();

  // ——— Վահանակը ———
  ctx.fillStyle = '#ffd76e';
  ctx.font = 'bold 21px "Noto Sans Armenian", Arial, sans-serif';
  ctx.textAlign = 'left';
  const t = timerOn && state === 'play' ? (performance.now() - startTime) / 1000 : finishTime;
  ctx.fillText(T.level(level, MAX_LEVEL), 16, 40);
  ctx.fillStyle = '#9a9ec7';
  ctx.fillText(T.sec(t.toFixed(1)), 16, H - 18);

  // ձայնի կոճակը՝ բարձրախոսը մենք ենք նկարում
  const sp = speakerBox();
  ctx.fillStyle = 'rgba(61,53,96,0.9)';
  ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#6a5f9e';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#f5eede';
  ctx.beginPath();
  ctx.moveTo(sp.x - 9, sp.y - 4); ctx.lineTo(sp.x - 3, sp.y - 4);
  ctx.lineTo(sp.x + 3, sp.y - 9); ctx.lineTo(sp.x + 3, sp.y + 9);
  ctx.lineTo(sp.x - 3, sp.y + 4); ctx.lineTo(sp.x - 9, sp.y + 4);
  ctx.closePath(); ctx.fill();
  if (musicOn) {
    ctx.strokeStyle = '#f5eede';
    ctx.beginPath(); ctx.arc(sp.x + 6, sp.y, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(sp.x + 6, sp.y, 9, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff6b5e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sp.x + 5, sp.y - 6); ctx.lineTo(sp.x + 13, sp.y + 6);
    ctx.moveTo(sp.x + 13, sp.y - 6); ctx.lineTo(sp.x + 5, sp.y + 6);
    ctx.stroke();
  }

  ctx.textAlign = 'center';
  if (!timerOn && state === 'play' && level === 1) {
    ctx.fillStyle = '#9a9ec7';
    ctx.font = Math.min(17, W * 0.042) + 'px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.hint, W / 2, H - 18);
  }

  // ——— Էկրանները ———
  if (state === 'levelDone') {
    ctx.fillStyle = 'rgba(10,14,30,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold ' + Math.min(34, W * 0.075) + 'px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.passed(level), W / 2, H / 2 - 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.inTime(finishTime.toFixed(1)), W / 2, H / 2 - 15);
    ctx.fillStyle = '#6ee7b7';
    ctx.font = 'bold 22px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.next(level + 1), W / 2, H / 2 + 50);
  } else if (state === 'champion') {
    ctx.fillStyle = 'rgba(10,14,30,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold ' + Math.min(38, W * 0.08) + 'px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.champ, W / 2, H / 2 - 70);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.champSub(MAX_LEVEL), W / 2, H / 2 - 25);
    drawTrophy(W / 2, H / 2 + 45);
    ctx.fillStyle = '#6ee7b7';
    ctx.font = 'bold 22px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillText(T.again, W / 2, H / 2 + 120);
  }
}

// Ոսկե գավաթ 🏆 (նկարում ենք ձեռքով)
function drawTrophy(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(-24, -28); ctx.lineTo(24, -28);
  ctx.quadraticCurveTo(20, 6, 0, 12);
  ctx.quadraticCurveTo(-20, 6, -24, -28);
  ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-28, -15, 9, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(28, -15, 9, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  ctx.fillRect(-4, 12, 8, 10);
  ctx.fillRect(-16, 22, 32, 7);
  ctx.restore();
}

function confetti() {
  const stuff = ['🎉', '⭐', '🌀', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
