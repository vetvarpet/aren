<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Արենի դաշնամուրը 🎹</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    height: 100dvh;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;   /* արագ սեղմելիս էկրանը չմեծանա */
  }
  h1 { font-size: clamp(1.2rem, 4vw, 1.9rem); color: #ffd76e; }
  .hint { font-size: 0.9rem; opacity: 0.7; text-align: center; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #3d3560;
    color: #f5eede;
    border: 2px solid #6a5f9e;
  }
  .controls button:active { transform: scale(0.95); }
  .controls button:disabled { opacity: 0.4; }
  #recBtn.recording {
    background: #c0392b;
    border-color: #ff7b6b;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 80, 80, 0.25); } }

  /* ——— Դաշնամուրը ——— */
  .piano-body {
    width: min(96vw, 820px);
    background: linear-gradient(#5a1f28, #3d1219);
    border-radius: 16px 16px 10px 10px;
    padding: 16px 12px 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  #keys {
    position: relative;
    display: flex;
    height: min(34vh, 240px);
  }
  .white {
    flex: 1;
    background: linear-gradient(#fffdf5, #ece5d3);
    border: 1px solid #b9ad92;
    border-radius: 0 0 8px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    font-size: clamp(0.6rem, 2vw, 0.85rem);
    color: #7a6f58;
    cursor: pointer;
  }
  .white.on { background: linear-gradient(#ffe9a8, #ffd76e); }
  .white.bad { background: linear-gradient(#ffc4b8, #ff8a78); }
  .black {
    position: absolute;
    top: 0;
    width: 6.2%;
    height: 58%;
    background: linear-gradient(#3a3a44, #17171d);
    border-radius: 0 0 6px 6px;
    z-index: 2;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    font-size: 0.6rem;
    color: #9a93b5;
  }
  .black.on { background: linear-gradient(#6a5f9e, #4a4170); }
  .black.bad { background: linear-gradient(#c0392b, #7a1f15); }

  /* ——— Սովորելու ռեժիմ ——— */
  /* Ստեղնը, որ պիտի սեղմես՝ վառվում-փայլում է ոսկեգույն */
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 6px 2px rgba(255, 215, 110, 0.5); }
    50%      { box-shadow: 0 0 26px 8px rgba(255, 215, 110, 0.95); }
  }
  .white.learn-target { background: linear-gradient(#fff3c4, #ffd76e); animation: glow 0.9s infinite; }
  .black.learn-target { background: linear-gradient(#d9b35a, #8a6a1f); animation: glow 0.9s infinite; color: #2e2410; }
  #learnBtn.active { background: #ffd76e; color: #2e2410; border-color: #ffe9a8; }

  #learnBar[hidden] { display: none; }   /* թաքնվածը իսկապես թաքնված է */
  #learnBar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.95rem;
  }
  #learnBar button {
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #6a5f9e;
    color: #f5eede;
  }

  /* Կոնֆետին՝ հաղթանակի համար */
  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(720deg); }
  }
</style>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<h1>Արենի դաշնամուրը 🎹</h1>

<div class="controls">
  <button id="recBtn">⏺ Ձայնագրել</button>
  <button id="playBtn" disabled>▶ Լսել իմ մեղեդին</button>
  <button id="learnBtn">🎓 Սովորել</button>
</div>

<div id="learnBar" hidden>
  <span id="learnText"></span>
  <button id="learnListen" hidden>👂 Լսել</button>
</div>

<div class="controls" id="songs">
  <button data-song="star">🌟 Աստղիկը</button>
  <button data-song="birthday">🎂 Ծնունդդ շնորհավոր</button>
  <button data-song="jingle">🔔 Զանգակները</button>
  <button data-song="tango">💃 Արենի տանգոն</button>
</div>

<div class="piano-body">
  <div id="keys"></div>
</div>

<p class="hint">Նվագիր մատով կամ ստեղնաշարով՝ A S D F G H J K L ; — սևերը՝ W E T Y U O P</p>

<script>
// ——————————————————————————————————————
//  ԱՐԵՆԻ ԴԱՇՆԱՄՈՒՐԸ — չորրորդ նախագիծը
//  Նվագիր, ձայնագրիր ու լսիր քո սեփական մեղեդին
// ——————————————————————————————————————

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });


// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { h1: 'Արենի դաշնամուրը 🎹', rec: '⏺ Ձայնագրել', stop: '⏹ Կանգնեցնել', playMine: '▶ Լսել իմ մեղեդին', learnBtn: '🎓 Սովորել', listen: '👂 Լսել', prog: (t, i, n) => t + ' — նոտա ' + i + '/' + n, bravo: t => '🏆 Բրավո՜։ Դու սովորեցիր «' + t + '»', hint: 'Նվագիր մատով կամ ստեղնաշարով՝ A S D F G H J K L ; — սևերը՝ W E T Y U O P', songs: { star: '🌟 Աստղիկը', birthday: '🎂 Ծնունդդ շնորհավոր', jingle: '🔔 Զանգակները', tango: '💃 Արենի տանգոն' }, notes: null },
  ru: { h1: 'Пианино Арена 🎹', rec: '⏺ Записать', stop: '⏹ Стоп', playMine: '▶ Моя мелодия', learnBtn: '🎓 Учиться', listen: '👂 Послушать', prog: (t, i, n) => t + ' — нота ' + i + '/' + n, bravo: t => '🏆 Браво! Ты выучил «' + t + '»', hint: 'Играй пальцем или клавишами: A S D F G H J K L ; — чёрные: W E T Y U O P', songs: { star: '🌟 Звёздочка', birthday: '🎂 С днём рождения', jingle: '🔔 Бубенцы', tango: '💃 Танго Арена' }, notes: ['До','До#','Ре','Ре#','Ми','Фа','Фа#','Соль','Соль#','Ля','Ля#','Си','До²','До#²','Ре²','Ре#²','Ми²'] },
  en: { h1: 'Aren’s Piano 🎹', rec: '⏺ Record', stop: '⏹ Stop', playMine: '▶ Play my melody', learnBtn: '🎓 Learn', listen: '👂 Listen', prog: (t, i, n) => t + ' — note ' + i + '/' + n, bravo: t => '🏆 Bravo! You learned “' + t + '”', hint: 'Play with fingers or keys: A S D F G H J K L ; — black keys: W E T Y U O P', songs: { star: '🌟 Twinkle', birthday: '🎂 Happy Birthday', jingle: '🔔 Jingle Bells', tango: '💃 Aren’s Tango' }, notes: ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si','Do²','Do#²','Re²','Re#²','Mi²'] },
};
const T = TRL[ggLang] || TRL.hy;

// Էջի գրածները դարձնում ենք ընտրված լեզվով
document.querySelector('h1').textContent = T.h1;
document.querySelector('.hint').textContent = T.hint;
document.getElementById('recBtn').textContent = T.rec;
document.getElementById('playBtn').textContent = T.playMine;
document.getElementById('learnBtn').textContent = T.learnBtn;
document.getElementById('learnListen').textContent = T.listen;
document.querySelectorAll('#songs button').forEach(b => {
  if (T.songs[b.dataset.song]) b.textContent = T.songs[b.dataset.song];
});

// ——— Նոտաները ———
// semi = քանի «կիսատոն» է Դո-ից բարձր։ Ինչքան մեծ թիվը, այնքան բարձր ձայնը։
const NOTES = [
  { name: 'Դո',  semi: 0,  key: 'KeyA' },
  { name: 'Դո#', semi: 1,  key: 'KeyW', black: true },
  { name: 'Ռե',  semi: 2,  key: 'KeyS' },
  { name: 'Ռե#', semi: 3,  key: 'KeyE', black: true },
  { name: 'Մի',  semi: 4,  key: 'KeyD' },
  { name: 'Ֆա',  semi: 5,  key: 'KeyF' },
  { name: 'Ֆա#', semi: 6,  key: 'KeyT', black: true },
  { name: 'Սոլ', semi: 7,  key: 'KeyG' },
  { name: 'Սոլ#',semi: 8,  key: 'KeyY', black: true },
  { name: 'Լա',  semi: 9,  key: 'KeyH' },
  { name: 'Լա#', semi: 10, key: 'KeyU', black: true },
  { name: 'Սի',  semi: 11, key: 'KeyJ' },
  { name: 'Դո²', semi: 12, key: 'KeyK' },
  { name: 'Դո#²',semi: 13, key: 'KeyO', black: true },
  { name: 'Ռե²', semi: 14, key: 'KeyL' },
  { name: 'Ռե#²',semi: 15, key: 'KeyP', black: true },
  { name: 'Մի²', semi: 16, key: 'Semicolon' },
];

// Նոտաների անունները ընտրված լեզվով
if (T.notes) NOTES.forEach((n, i) => { n.name = T.notes[i]; });

// ——— Ստեղները էկրանին ———
const keysBox = document.getElementById('keys');
const keyEls = [];
const whites = NOTES.filter(n => !n.black);

NOTES.forEach((note, i) => {
  const el = document.createElement('div');
  el.className = note.black ? 'black' : 'white';
  el.textContent = note.name;
  el.dataset.i = i;
  keysBox.appendChild(el);
  keyEls[i] = el;
});

// Սև ստեղները դնում ենք ճիշտ տեղերում՝ սպիտակների արանքում
function placeBlacks() {
  const whiteW = 100 / whites.length;
  let whiteIdx = 0;
  NOTES.forEach((note, i) => {
    if (!note.black) { whiteIdx++; return; }
    keyEls[i].style.left = (whiteIdx * whiteW - 3.1) + '%';
  });
}
placeBlacks();

// ——— Ձայնը ———
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Մեկ նոտա. հիմնական ձայն + թեթև «փայլ» վերևից, որ դաշնամուրի նման հնչի
function playTone(semi) {
  initAudio();
  const freq = 261.63 * Math.pow(2, semi / 12);   // Դո = 261.63 Հց
  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 1.3);

  const shine = audioCtx.createOscillator();
  const shineGain = audioCtx.createGain();
  shine.type = 'sine';
  shine.frequency.value = freq * 2;
  shineGain.gain.setValueAtTime(0.001, t);
  shineGain.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
  shineGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  shine.connect(shineGain); shineGain.connect(audioCtx.destination);
  shine.start(t); shine.stop(t + 0.6);
}

// ——— Նվագելը ———
let recording = false;
let recorded = [];        // ձայնագրված նոտաները՝ {i, dt}
let recStart = 0;
let playTimers = [];      // որ կարողանանք կանգնեցնել նվագարկումը

function pressKey(i) {
  playTone(NOTES[i].semi);
  const el = keyEls[i];
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 180);

  if (recording) {
    recorded.push({ i, dt: performance.now() - recStart });
  }

  // Սովորելու ռեժիմում ստուգում ենք՝ ճի՞շտ ստեղնը սեղմեցիր
  if (learn && learn.seq && !demo) checkLearn(i);
}

// Մատով / մկնիկով
keysBox.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.white, .black');
  if (el) pressKey(Number(el.dataset.i));
});

// Ստեղնաշարով
const keyMap = {};
NOTES.forEach((n, i) => { keyMap[n.key] = i; });
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (keyMap[e.code] !== undefined) { e.preventDefault(); pressKey(keyMap[e.code]); }
});

// ——— Ձայնագրելը ———
const recBtn = document.getElementById('recBtn');
const playBtn = document.getElementById('playBtn');

recBtn.addEventListener('click', () => {
  if (!recording) {
    recording = true;
    recorded = [];
    recStart = performance.now();
    recBtn.textContent = T.stop;
    recBtn.classList.add('recording');
  } else {
    recording = false;
    recBtn.textContent = T.rec;
    recBtn.classList.remove('recording');
    playBtn.disabled = recorded.length === 0;
  }
});

// Նվագարկում ենք նոտաների ցուցակը՝ ճիշտ ժամանակներով
function playSequence(seq) {
  stopPlayback();
  for (const note of seq) {
    playTimers.push(setTimeout(() => pressKey(note.i), note.dt));
  }
}
function stopPlayback() {
  for (const t of playTimers) clearTimeout(t);
  playTimers = [];
}

playBtn.addEventListener('click', () => playSequence(recorded));

// ——— Երգերի հավաքածուն ———
// Ամեն նոտա՝ [ստեղնի համարը, որ «հաշվի» վրա նվագել]։
// beat-ը մեկ հաշվի տևողությունն է միլիվայրկյաններով։
const SONGS = {
  // «Փայլի՛ր, փայլի՛ր, փոքրիկ աստղ»
  star: {
    beat: 400,
    notes: [
      [0, 0], [0, 1], [7, 2], [7, 3], [9, 4], [9, 5], [7, 6],
      [5, 8], [5, 9], [4, 10], [4, 11], [2, 12], [2, 13], [0, 14],
    ],
  },
  // «Ծնունդդ շնորհավոր»
  birthday: {
    beat: 340,
    notes: [
      [0, 0], [0, 0.5], [2, 1], [0, 2], [5, 3], [4, 4],
      [0, 6], [0, 6.5], [2, 7], [0, 8], [7, 9], [5, 10],
      [0, 12], [0, 12.5], [12, 13], [9, 14], [5, 15], [4, 16], [2, 17],
      [10, 19], [10, 19.5], [9, 20], [5, 21], [7, 22], [5, 23],
    ],
  },
  // «Զնգացե՛ք, զանգակներ» (Jingle Bells)
  jingle: {
    beat: 300,
    notes: [
      [4, 0], [4, 1], [4, 2],
      [4, 4], [4, 5], [4, 6],
      [4, 8], [7, 9], [0, 10], [2, 11], [4, 12],
      [5, 16], [5, 17], [5, 18], [5, 19], [5, 20], [4, 21], [4, 22], [4, 23],
      [7, 24], [7, 25], [5, 26], [2, 27], [0, 28],
    ],
  },
  // «Արենի տանգոն» — մեր սեփական տանգոն, մինչև իսկականի նոտաները ճարենք։
  // Տանգոյի գաղտնիքը՝ մինոր (թախծոտ) նոտաներ + կտրուկ, պարային ռիթմ։
  tango: {
    beat: 320,
    notes: [
      // առաջին նախադասությունը՝ վերև ձգտող
      [9, 0], [12, 0.5], [16, 1], [16, 2], [14, 2.5], [12, 3],
      [11, 4], [11, 5], [9, 5.5], [8, 6], [9, 7], [11, 8],
      // երկրորդը՝ իջնում ու հանգչում է
      [9, 10], [12, 10.5], [16, 11], [16, 12], [14, 12.5], [12, 13],
      [11, 14], [12, 14.5], [11, 15], [8, 16], [9, 17],
      // վերջին ակորդային շեշտը՝ տանգոյի «կետը»
      [4, 19], [9, 19.5], [9, 20.5],
    ],
  },
};

document.querySelectorAll('#songs button').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    // Սովորելու ռեժիմում երգի կոճակը երգը չի նվագում, այլ սկսում է դասը
    if (learn) { startLesson(btn); return; }
    const song = SONGS[btn.dataset.song];
    playSequence(song.notes.map(([i, b]) => ({ i, dt: b * song.beat })));
  });
});

// ——————————————————————————————————————
//  ՍՈՎՈՐԵԼՈՒ ՌԵԺԻՄ 🎓
//  Ստեղնը վառվում է → դու սեղմում ես → հաջորդը։
//  Երբ ամբողջ երգը նվագես՝ կոնֆետի՜ 🎉
// ——————————————————————————————————————
let learn = null;    // { seq, idx, title } կամ null, երբ ռեժիմն անջատված է
let demo = false;    // երբ «Լսել»-ն է նվագում, սեղմումները չենք հաշվում

const learnBtn = document.getElementById('learnBtn');
const learnBar = document.getElementById('learnBar');
const learnText = document.getElementById('learnText');
const learnListen = document.getElementById('learnListen');

learnBtn.addEventListener('click', () => {
  if (learn) { exitLearn(); return; }
  stopPlayback();
  learn = { seq: null, idx: 0, title: '' };
  learnBtn.classList.add('active');
  // վահանակը կերևա միայն երգն ընտրելուց հետո՝ առաջընթացի հաշվիչով
  learnBar.hidden = true;
  learnListen.hidden = true;
});

function exitLearn() {
  clearGlow();
  learn = null;
  learnBtn.classList.remove('active');
  learnBar.hidden = true;
}

function clearGlow() {
  keyEls.forEach(el => el.classList.remove('learn-target'));
}

function startLesson(btn) {
  stopPlayback();   // եթե երգ էր հնչում, լռեցնում ենք՝ դասը մաքուր սկսելու համար
  const song = SONGS[btn.dataset.song];
  learn.songKey = btn.dataset.song;
  learn.title = btn.textContent;
  learn.seq = song.notes.map(([i]) => i);   // միայն նոտաները, առանց ռիթմի
  learn.idx = 0;
  learnBar.hidden = false;
  learnListen.hidden = false;
  showTarget();
}

// Վառում ենք հերթական ստեղնը ու գրում, թե որտեղ ենք հասել
function showTarget() {
  clearGlow();
  keyEls[learn.seq[learn.idx]].classList.add('learn-target');
  learnText.textContent = T.prog(learn.title, learn.idx + 1, learn.seq.length);
}

function checkLearn(i) {
  if (i === learn.seq[learn.idx]) {
    learn.idx++;
    if (learn.idx >= learn.seq.length) { finishLesson(); return; }
    showTarget();
  } else {
    // Սխալ ստեղն է. մի պահ կարմրում է, հետո նորից փորձիր
    const el = keyEls[i];
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 250);
  }
}

function finishLesson() {
  clearGlow();
  learnText.textContent = T.bravo(learn.title.slice(2).trim());
  learn.seq = null;   // դասը վերջացավ, կարող ես նոր երգ ընտրել
  learnListen.hidden = true;
  fanfare();
  confetti();

  // Իսկ հիմա՝ պարգևը. երգը հնչում է ամբողջությամբ, իսկական ռիթմով 🎶
  const song = SONGS[learn.songKey];
  setTimeout(() => {
    playSequence(song.notes.map(([i, b]) => ({ i, dt: b * song.beat })));
  }, 1600);
}

// «Լսել» կոճակը՝ երգը մեկ անգամ ցույց է տալիս, հետո նորից դու ես նվագում
learnListen.addEventListener('click', () => {
  if (!learn || !learn.seq) return;
  const song = SONGS[learn.songKey];
  demo = true;
  playSequence(song.notes.map(([i, b]) => ({ i, dt: b * song.beat })));
  const last = song.notes[song.notes.length - 1];
  setTimeout(() => { demo = false; }, last[1] * song.beat + 600);
});

// Հաղթանակի փոքրիկ շեփորիկ՝ Դո-Մի-Սոլ-Դո²-Մի²
function fanfare() {
  [0, 4, 7, 12, 16].forEach((semi, k) => setTimeout(() => playTone(semi), k * 130));
}

// Կոնֆետի՝ վերևից թափվող 40 զվարճալի բան
function confetti() {
  const stuff = ['🎉', '⭐', '🎵', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
</script>
