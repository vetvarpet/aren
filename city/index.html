const cv = $('cv'), g = cv.getContext('2d');

// Միշտ նույն քաղաքն է կառուցվում — «պատահական», բայց նույն սերմից

function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }

// ——— ☀️ Լույսն ու մշուշը ———
// Արևը վերևից ու մի քիչ կողքից է — ամեն պատ իր ուղղությամբ է լուսավորվում
const SUN = (() => { const v = [0.45, 0.8, 0.38], l = Math.hypot(...v); return v.map(c => c / l); })();

const HAZE = [205, 226, 238];
const FAR = 170;           // սրանից հեռու ոչինչ չենք նկարում — մշուշի մեջ է

// ——— 📷 Տեսախցիկը ———
const cam = { x: 0, y: 3, z: 0, yaw: 0, pitch: 0.15 };
let cY = 1, sY = 0, cP = 1, sP = 0;
const NEAR = 0.2;
// Կետը աշխարհից տեղափոխում ենք տեսախցիկի «աչքերի» մեջ
function toCam(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const x1 = dx * cY - dz * sY, z1 = dx * sY + dz * cY;
  return [x1, dy * cP + z1 * sP, z1 * cP - dy * sP];
}
// Բազմանկյուն նկարել. p = [x,y,z, x,y,z, ...]
// Տեսախցիկի հետևում մնացած մասը կտրում ենք, որ նկարը չշրջվի
function fillPoly(p, color) {

  for (let i = 0; i < n; i++) { const q = toCam(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]); c.push(q); if (q[2] > NEAR) front++; }
  if (!front) return;
  let pts = c;
  if (front < n) {
    pts = [];
    for (let i = 0; i < n; i++) {
      const a = c[i], b = c[(i + 1) % n];
      const ina = a[2] > NEAR, inb = b[2] > NEAR;
      if (ina) pts.push(a);
      if (ina !== inb) {
        const t = (NEAR - a[2]) / (b[2] - a[2]);
        pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
      }
    }

  }
  g.beginPath();

  for (let i = 0; i < pts.length; i++) {
    const q = pts[i], sx = CX + q[0] / q[2] * focal, sy = CY - q[1] / q[2] * focal;
    if (sx < minX) minX = sx; if (sx > maxX) maxX = sx; if (sy < minY) minY = sy; if (sy > maxY) maxY = sy;
    if (i) g.lineTo(sx, sy); else g.moveTo(sx, sy);

}

// ——— 🧱 Ձևեր. ամեն ձև նիստերից է (face) ———
// Նիստ = { p: կետեր, n: ո՞ր կողմ է նայում, sh: լուսավորություն, c: գույն }
function face(p, c, ctr) {
  // Նիստի ուղղությունը հաշվում ենք ու շրջում դեպի ձևի կենտրոնից դուրս
  const ax = p[3] - p[0], ay = p[4] - p[1], az = p[5] - p[2];
  const bx = p[6] - p[0], by = p[7] - p[1], bz = p[8] - p[2];
  let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
  const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  if ((p[0] - ctr[0]) * nx + (p[1] - ctr[1]) * ny + (p[2] - ctr[2]) * nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
  return { p, n: [nx, ny, nz], sh: shadeOf(nx, ny, nz), c };
}
// Արկղ (ուղիղ անկյուններով)
function box(x0, y0, z0, x1, y1, z1, c, top) {
  const ctr = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2];

    face([x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1], top || c, ctr),
    face([x0, y0, z0, x0, y0, z1, x0, y1, z1, x0, y1, z0], c, ctr),
    face([x1, y0, z0, x1, y0, z1, x1, y1, z1, x1, y1, z0], c, ctr),
    face([x0, y0, z0, x1, y0, z0, x1, y1, z0, x0, y1, z0], c, ctr),
    face([x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1], c, ctr),

}
// Պրիզմա (կլոր բան՝ շատ կողերով) ու կոն (ծառի գագաթ)
function prism(x, z, r, y0, y1, k, c, top, rot) {
  const out = [], ctr = [x, (y0 + y1) / 2, z], tp = [];
  for (let i = 0; i < k; i++) {
    const a = (rot || 0) + i / k * Math.PI * 2, b = (rot || 0) + (i + 1) / k * Math.PI * 2;
    const ax = x + Math.cos(a) * r, az = z + Math.sin(a) * r, bx = x + Math.cos(b) * r, bz = z + Math.sin(b) * r;
    out.push(face([ax, y0, az, bx, y0, bz, bx, y1, bz, ax, y1, az], c, ctr));
    tp.push(ax, y1, az);
  }
  out.push(face(tp, top || c, ctr));

}
function cone(x, z, r, y0, y1, k, c, rot) {

    const a = (rot || 0) + i / k * Math.PI * 2, b = (rot || 0) + (i + 1) / k * Math.PI * 2;
    out.push(face([x + Math.cos(a) * r, y0, z + Math.sin(a) * r, x + Math.cos(b) * r, y0, z + Math.sin(b) * r, x, y1, z], c, ctr));
  }
  return out;
}

// ——————————————————————————————————————————————————————————
//  🏙 ՔԱՂԱՔԸ ԿԱՌՈՒՑՈՒՄ ԵՆՔ
//  6 × 6 թաղամաս, մեջտեղով փողոցներ։ Թաղամասերի մեծ մասը շենքեր են,
//  մեկը՝ հրապարակ շատրվանով, երկուսը՝ այգի, մեկում՝ Ոսկե աշտարակը։
// ——————————————————————————————————————————————————————————
const NB = 6, BL = 44, RD = 12, PITCH = BL + RD, SPAN = NB * PITCH + RD, HALF = SPAN / 2, SW = 3;
const roadAt = i => -HALF + i * PITCH;          // փողոց i-ն՝ [roadAt, roadAt+RD]
const blockAt = j => -HALF + j * PITCH + RD;    // թաղամաս j-ն՝ [blockAt, blockAt+BL]

const C = {
  grass: [118, 168, 84], grassDark: [96, 148, 70], asphalt: [74, 78, 86], walk: [196, 190, 178], yard: [178, 170, 156],
  paving: [214, 200, 176], line: [240, 236, 220], zebra: [236, 236, 236], path: [206, 186, 150],
  trunk: [112, 78, 52], leaf: [72, 140, 64], leaf2: [96, 160, 70], pine: [48, 112, 70],
  stone: [200, 190, 175], water: [90, 170, 220], gold: [236, 186, 64], goldDark: [176, 128, 36],
  pole: [70, 74, 82], lamp: [255, 236, 170], bench: [140, 96, 60], glass: [[84, 116, 156], [104, 142, 180], [70, 96, 132]],

// Երևանյան տուֆի գույներ — վարդագույն, նարնջագույն, կրեմ
const TUFF = [[214, 158, 146], [222, 176, 136], [196, 140, 120], [230, 214, 180], [186, 176, 166], [160, 182, 196], [176, 198, 168], [232, 196, 160]];

const ground = [];   // գետնի շերտեր — հերթականությամբ
const BLD = [], BLOCKS = [];   // քարտեզի համար՝ շենքերի տեղերն ու թաղամասերի տեսակները
const marks = [];    // գծեր ու զեբրաներ (նկարում ենք միայն մոտիկները)
const things = [];   // կանգնած բաներ՝ շենքեր, ծառեր, լապտերներ
const solids = [];   // ինչի միջով չես կարող անցնել
function gquad(x0, z0, x1, z1, c, list) { (list || ground).push({ p: [x0, 0, z0, x1, 0, z0, x1, 0, z1, x0, 0, z1], c, x: (x0 + x1) / 2, z: (z0 + z1) / 2 }); }
function addThing(faces, x0, z0, x1, z1, extra) { const t = { faces, x0, z0, x1, z1, d: 0 }; if (extra) Object.assign(t, extra); things.push(t); return t; }
function solid(x0, z0, x1, z1, h) { solids.push({ x0, z0, x1, z1, h: h || 1 }); }

// Պատուհաններ շենքի մեկ պատին
function windowsFor(f, x0, z0, x1, z1, h, ground1) {
  const ux = x1 - x0, uz = z1 - z0, L = Math.hypot(ux, uz), dx = ux / L, dz = uz / L;
  const ox = f.n[0] * 0.04, oz = f.n[2] * 0.04, out = [];
  const cols = Math.max(1, Math.floor((L - 1.2) / 3.4)), m = (L - cols * 3.4) / 2;
  const win = (s0, s1, y0, y1, c) => {
    const a = m + s0, b = m + s1;
    out.push({ p: [x0 + dx * a + ox, y0, z0 + dz * a + oz, x0 + dx * b + ox, y0, z0 + dz * b + oz,
                   x0 + dx * b + ox, y1, z0 + dz * b + oz, x0 + dx * a + ox, y1, z0 + dz * a + oz], c });
  };
  for (let i = 0; i < cols; i++) {
    const s = i * 3.4;
    if (ground1) win(s + 0.4, s + 3.0, 0.5, 2.7, C.glass[1]);          // խանութի մեծ ապակի
    for (let y = 3.8; y + 1.7 < h - 0.8; y += 3.2) win(s + 0.95, s + 2.45, y, y + 1.7, pick(C.glass));
  }
  return out;
}
function building(x0, z0, x1, z1, h, c, roof, shop) {
  const faces = box(x0, 0, z0, x1, h, z1, c, roof);
  // Կողերի պատուհանները (0-ն տանիքն է)
  const sides = [[x0, z1, x0, z0], [x1, z0, x1, z1], [x1, z0, x0, z0], [x0, z1, x1, z1]];
  for (let i = 1; i < 5; i++) { const s = sides[i - 1]; faces[i].win = windowsFor(faces[i], s[0], s[1], s[2], s[3], h, shop); }
  const t = addThing(faces, x0, z0, x1, z1);
  solid(x0, z0, x1, z1, h);
  BLD.push({ x0, z0, x1, z1, gold: c === C.gold, t });
}
function tree(x, z, kind) {
  const r = 0.9 + rnd() * 0.5, rot = rnd() * 3;
  let f = box(x - 0.18, 0, z - 0.18, x + 0.18, 2.2, z + 0.18, C.trunk);
  if (kind === 'pine') f = f.concat(cone(x, z, 1.9 * r, 1.6, 6.5 * r, 7, C.pine, rot));
  else {
    const lf = rnd() < 0.5 ? C.leaf : C.leaf2;
    f = f.concat(prism(x, z, 1.7 * r, 2.0, 3.6 * r + 0.6, 7, lf, null, rot), cone(x, z, 1.7 * r, 3.6 * r + 0.6, 5.2 * r + 0.6, 7, lf, rot));
  }
  addThing(f, x - 1.6, z - 1.6, x + 1.6, z + 1.6);
  solid(x - 0.3, z - 0.3, x + 0.3, z + 0.3);
}
function lamp(x, z) {
  const f = box(x - 0.08, 0, z - 0.08, x + 0.08, 4.4, z + 0.08, C.pole).concat(box(x - 0.25, 4.4, z - 0.25, x + 0.25, 4.8, z + 0.25, C.lamp, C.pole));
  addThing(f, x - 0.25, z - 0.25, x + 0.25, z + 0.25);
  solid(x - 0.15, z - 0.15, x + 0.15, z + 0.15);
}
function bench(x, z, alongX) {
  const w = alongX ? 1.0 : 0.25, d = alongX ? 0.25 : 1.0;
  addThing(box(x - w, 0, z - d, x + w, 0.5, z + d, C.bench), x - w, z - d, x + w, z + d);
  solid(x - w, z - d, x + w, z + d);
}

// 1) Գետինը. ամբողջ քաղաքը ասֆալտ է, թաղամասերը՝ մայթ
gquad(-HALF, -HALF, HALF, HALF, C.asphalt);
const TYPE = {}; // ո՞ր թաղամասում ինչ կա
TYPE['2,2'] = 'square'; TYPE['3,3'] = 'park'; TYPE['0,5'] = 'park'; TYPE['3,2'] = 'tower'; TYPE['5,0'] = 'park';
for (let j = 0; j < NB; j++) for (let i = 0; i < NB; i++) {
  const x0 = blockAt(i), z0 = blockAt(j), x1 = x0 + BL, z1 = z0 + BL;
  const type = TYPE[i + ',' + j] || 'city';
  BLOCKS.push({ x0, z0, type });
  gquad(x0, z0, x1, z1, C.walk);
  const ix0 = x0 + SW, iz0 = z0 + SW, ix1 = x1 - SW, iz1 = z1 - SW;   // մայթից ներս
  // Մայթի եզրի լապտերները
  for (let k = 0; k < 2; k++) {
    const t = 0.25 + k * 0.5;
    lamp(x0 + BL * t, z0 + 0.8); lamp(x0 + BL * t, z1 - 0.8);
  }
  if (type === 'park') {
    gquad(ix0, iz0, ix1, iz1, C.grass);
    gquad((ix0 + ix1) / 2 - 1.5, iz0, (ix0 + ix1) / 2 + 1.5, iz1, C.path);
    gquad(ix0, (iz0 + iz1) / 2 - 1.5, ix1, (iz0 + iz1) / 2 + 1.5, C.path);
    for (let q = 0; q < 4; q++) {
      const qx = q % 2 ? (ix0 + ix1) / 2 + 2 : ix0, qz = q < 2 ? iz0 : (iz0 + iz1) / 2 + 2;
      for (let k = 0; k < 4; k++) tree(qx + 3 + rnd() * 11, qz + 3 + rnd() * 11, rnd() < 0.35 ? 'pine' : 'round');
    }
    bench((ix0 + ix1) / 2 + 3, (iz0 + iz1) / 2 - 7, false);
    bench((ix0 + ix1) / 2 - 7, (iz0 + iz1) / 2 + 3, true);
  } else if (type === 'square') {
    // ⛲ Հրապարակ՝ մեջտեղում շատրվան
    gquad(ix0, iz0, ix1, iz1, C.paving);
    const fx = (x0 + x1) / 2, fz = (z0 + z1) / 2;
    const f = prism(fx, fz, 5, 0, 0.7, 10, C.stone, C.water, 0.31)
      .concat(prism(fx, fz, 1.1, 0.7, 1.6, 8, C.stone, null, 0.2), prism(fx, fz, 0.35, 1.6, 3.3, 6, C.stone, C.water));
    addThing(f, fx - 5, fz - 5, fx + 5, fz + 5);
    solid(fx - 4.6, fz - 4.6, fx + 4.6, fz + 4.6);
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; tree(fx + Math.cos(a) * 14, fz + Math.sin(a) * 14, 'round'); }
    bench(fx, fz - 9, true); bench(fx, fz + 9, true); bench(fx - 9, fz, false); bench(fx + 9, fz, false);
  } else if (type === 'tower') {

// Մայթի «օղակի» վրա t-ից գտնում ենք կետն ու ուղղությունը

// Կետը մեքենայի «ներսի» կոորդինատներով՝ [կողք, առաջ]

  const mx = (t.x0 + t.x1) / 2 - cam.x, mz = (t.z0 + t.z1) / 2 - cam.z;
  const zf = mx * sY + mz * cY, xs = mx * cY - mz * sY;
  return zf > -r && Math.abs(xs) < zf * (W / 2 / focal) + r * 1.5;
}
// Ո՞րն է ավելի մոտ տեսախցիկին — եթե իրար հետ չեն խառնվում, կողքից նայելով ճշգրիտ ենք որոշում
function inFront(a, b) {
  if (a.x1 <= b.x0) return cam.x < (a.x1 + b.x0) / 2;
  if (b.x1 <= a.x0) return cam.x > (b.x1 + a.x0) / 2;
  if (a.z1 <= b.z0) return cam.z < (a.z1 + b.z0) / 2;
  if (b.z1 <= a.z0) return cam.z > (b.z1 + a.z0) / 2;
  return a.d < b.d;
}
function drawThing(t) {
  const d = t.d;
  for (const f of t.faces) {
    const p = f.p;
    if ((cam.x - p[0]) * f.n[0] + (cam.y - p[1]) * f.n[1] + (cam.z - p[2]) * f.n[2] <= 0) continue;   // մեջքով է դեպի մեզ
    fillPoly(p, colorOf(f.c, f.sh, d));
    if (f.win && d < 80) for (const w of f.win) fillPoly(w.p, colorOf(w.c, f.sh, d));
  }
  const fr = t.front;
  if (t.decor && ((fr.alongX ? cam.z : cam.x) - fr.wall) * fr.out > 0) drawThing({ faces: t.decor, d });
}
function render() {
  // 1) Երկինք
  const hz = CY - Math.tan(cam.pitch) * focal;   // հորիզոնի գիծը
  const sky = g.createLinearGradient(0, 0, 0, Math.max(1, hz));
  sky.addColorStop(0, '#5fa8e2'); sky.addColorStop(1, '#cfe6f2');
  g.fillStyle = sky; g.fillRect(0, 0, W, Math.max(0, hz) + 1);
  // Ամպեր
  g.fillStyle = 'rgba(255,255,255,0.85)';
  for (const [a, el, w] of CLOUDS) {
    const q = toCam(...skyPoint(a, el));
    if (q[2] < 1) continue;
    const sx = CX + q[0] / q[2] * focal, sy = CY - q[1] / q[2] * focal, s = focal / 500;
    g.beginPath(); g.ellipse(sx, sy, w * s, w * 0.22 * s, 0, 0, Math.PI * 2);
    g.ellipse(sx + w * 0.3 * s, sy - w * 0.12 * s, w * 0.45 * s, w * 0.2 * s, 0, 0, Math.PI * 2); g.fill();
  }
  // 2) Արարատը
  drawMountain(SIS, 'rgb(158,150,178)');
  drawMountain(MASIS, 'rgb(150,142,172)');
  drawMountain(MASIS_SNOW, 'rgb(246,248,252)');
  // 3) Գետինը՝ դաշտ, հետո քաղաքը
  g.fillStyle = 'rgb(126,166,96)'; g.fillRect(0, hz, W, H - hz + 1);
  for (const q of ground) {
    if (Math.abs(q.x - cam.x) > FAR + 40 || Math.abs(q.z - cam.z) > FAR + 40) continue;
    fillPoly(q.p, colorOf(q.c, 1, 0));
  }
  for (const q of marks) {
    const dx = q.x - cam.x, dz = q.z - cam.z;
    if (dx * dx + dz * dz > 60 * 60 || dx * sY + dz * cY < -3) continue;
    fillPoly(q.p, colorOf(q.c, 1, 0));
  }
  // Աշխատանքի շրջանները գետնին
  const goals = job.st === 'carry' ? [job.shop] : [BAKERY];
  for (const s of goals) if (Math.hypot(s.x - cam.x, s.z - cam.z) < 120) drawRing(s, performance.now() / 1000);
  // Մշուշը հորիզոնի մոտ
  const hg = g.createLinearGradient(0, hz - 2, 0, hz + H * 0.14);
  hg.addColorStop(0, 'rgba(205,226,238,1)'); hg.addColorStop(1, 'rgba(205,226,238,0)');
  g.fillStyle = hg; g.fillRect(0, hz - 2, W, H * 0.14 + 2);

  // 4) Կանգնած բաները՝ հեռվից մոտ
  const list = [];
  for (const t of things) {
    t.d = nearDist(t);
    if (t.d > FAR) continue;
    const r = Math.max(t.x1 - t.x0, t.z1 - t.z0) * 0.75 + 2;
    if (!t.big && !inView(t, r)) continue;
    list.push(t);
  }
  // Փողոցի մարդիկ — միայն մոտիկներն ու տեսանելիները
  for (const m of PEOPLE) {
    const t = { x0: m.x - 0.3, x1: m.x + 0.3, z0: m.z - 0.3, z1: m.z + 0.3, person: m };
    t.d = nearDist(t);
    if (t.d < 80 && inView(t, 2)) list.push(t);
  }
  // Փողերը
  for (const c of CASH) {
    const t = { x0: c.x - 0.35, x1: c.x + 0.35, z0: c.z - 0.35, z1: c.z + 0.35, cash: c };
    t.d = nearDist(t);
    if (t.d < 70 && inView(t, 2)) list.push(t);
  }
  // Աշխատանքի ադամանդը
  for (const s of goals) {
    const t = { x0: s.x - 0.4, x1: s.x + 0.4, z0: s.z - 0.4, z1: s.z + 0.4, beacon: s };
    t.d = nearDist(t);
    if (t.d < FAR && inView(t, 2)) list.push(t);
  }
  // Մեքենաները
  for (const c of CARS) {
    if (c === driving) continue;
    const t = carBox(c);
    t.d = nearDist(t);
    if (t.d < FAR && inView(t, 4)) list.push(t);
  }
  // Խաղացողն էլ «բան» է — իր մասերով (մեքենայում լինելիս՝ նրա մեքենան)
  const me = driving ? carBox(driving) : { x0: P.x - 0.3, x1: P.x + 0.3, z0: P.z - 0.3, z1: P.z + 0.3 };
  me.me = true;
  me.d = nearDist(me);
  list.sort((a, b) => b.d - a.d);
  // Խաղացողին ճիշտ տեղը դնելու համար՝ մոտիկ բաներից որոնք են նրա առջևում
  const behind = [], ahead = [];
  for (const t of list) (t.d < me.d + 25 && inFront(t, me) ? ahead : behind).push(t);
  const order = behind.concat([me], ahead);
  for (const t of order) {
    if (t.me) { if (driving) drawCar(driving, me.d); else drawPerson(P, me.d); }
    else if (t.car) drawCar(t.car, t.d);
    else if (t.cash) drawCash(t.cash, t.d);
    else if (t.beacon) drawBeacon(t.beacon, t.d);
    else if (t.person) drawPerson(t.person, t.d);
    else drawThing(t);
  }

  // 5) Քարտեզն ու ջոյսթիքը
  if (state === 'play') drawMinimap();
  if (state === 'play' && job.st === 'carry') drawArrow(job.shop);
  if (state === 'play') {
    const bx = stick.on ? stick.ox : Math.min(110, W * 0.22), by = stick.on ? stick.oy : H - 120;
    g.globalAlpha = stick.on ? 0.55 : 0.28;
    g.fillStyle = '#141a22'; g.beginPath(); g.arc(bx, by, STICK_R + 8, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.stroke();
    g.globalAlpha = stick.on ? 0.9 : 0.45;
    g.fillStyle = '#ffd166'; g.beginPath(); g.arc(bx + stick.x * STICK_R, by + stick.y * STICK_R, 24, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
update(0);
requestAnimationFrame(frame);

// Թեստերի համար՝ դրսից նայելու դուռ
window.__city = { P, PEOPLE, CARS, CASH, get money() { return money; }, job, BAKERY, SHOPS, get driving() { return driving; }, cam, things, solids, get state() { return state; } };
</script>
