<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Կատուն թռչում է 🐱</title>
<style>
  /* ——— Խաղի գույները ——— */
  :root {
    --sky-top: #9fd9ef;
    --sky-bottom: #eaf8ff;
    --ink: #23405c;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;           /* էջը երբեք չի սահում */
  }
  body {
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;         /* մատով դիպչելիս էկրանը չի շարժվում */
    cursor: pointer;
  }
</style>

<canvas id="game"></canvas>

<script>
// ——————————————————————————————————————
//  ԿԱՏՈՒՆ ԹՌՉՈՒՄ Է — Արենի առաջին խաղը
//  Հիմա աշխատում է և՛ հեռախոսով, և՛ համակարգչով
// ——————————————————————————————————————

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Խաղադաշտի չափերը՝ «խաղային» միավորներով։
// resize()-ը դրանք հաշվում է էկրանի չափից։
let W = 900, H = 300, GROUND = 250, scale = 1;

// ——— Կատուն ———
const cat = {
  x: 90,
  y: 250,           // ոտքերի տեղը
  vy: 0,            // ինչ արագությամբ է բարձրանում/իջնում
  jumping: false,
};
const GRAVITY = 0.55;         // ինչքան ուժեղ է ձգում ներքև
const JUMP_POWER = -12.5;     // ինչքան ուժեղ է թռչում վերև
const CAT_SIZE = 1;           // կատվի չափը. 1-ը սովորականն է, մեծ թիվը՝ մեծ կատու

// ——— Խաղի վիճակը ———
let boxes = [];               // արկղերը, որ գալիս են
let fishes = [];              // ձկները, որ լողում են օդում
let popups = [];              // «+3» գրությունները, երբ ձուկ ես բռնում
let clouds = [];              // ամպերը երկնքում
let score = 0;                // միավորներ
let best = Number(localStorage.getItem('cat-best') || 0);
let speed = 5;                // ինչ արագ են գալիս արկղերը
let running = false;          // խաղը գնո՞ւմ է
let gameOver = false;
let frame = 0;

// ——— Գիշերը ———
const NIGHT_AT = 20;          // այս միավորից սկսած գիշեր է դառնում
let night = 0;                // 0 = ցերեկ, 1 = գիշեր (կամաց-կամաց է փոխվում)
let stars = [];               // աստղերը երկնքում

// Երկու գույնի արանքում գույն ենք ընտրում. t=0 → առաջինը, t=1 → երկրորդը
function mixColor(c1, c2, t) {
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ——— Էկրանի չափին հարմարվելը ———
// Հեռախոսը ուղղահայաց էլ բռնես, կողքի էլ՝ խաղը լցնում է ամբողջ էկրանը։
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const winW = window.innerWidth;
  const winH = window.innerHeight;

  canvas.width = winW * dpr;
  canvas.height = winH * dpr;

  // Ընտրում ենք այնպիսի խոշորացում, որ խաղադաշտը միշտ
  // բավական լայն լինի (արկղերին հասցնես նկատել)
  // և բավական բարձր (թռիչքը տեղավորվի)։
  scale = Math.min(winH / 360, winW / 620);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

  W = winW / scale;
  H = winH / scale;
  GROUND = H - 55;

  cat.x = Math.max(70, Math.min(130, W * 0.16));
  if (!cat.jumping) { cat.y = GROUND; cat.vy = 0; }

  // ամպերը նորից ենք ցրում երկնքով
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 30 + Math.random() * Math.max(60, H * 0.35),
      s: 0.6 + Math.random() * 0.9,
    });
  }

  // աստղերն էլ ենք նորից ցրում (գիշերը կերևան)
  stars = [];
  for (let i = 0; i < 50; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (GROUND - 60),
      r: 0.8 + Math.random() * 1.6,
      tw: Math.random() * 100,     // ամեն աստղ իր ռիթմով է թարթում
    });
  }
}
window.addEventListener('resize', resize);
resize();

// ——— Ձայները ———
// Ձայնային ֆայլեր չկան. համակարգիչը ինքն է «երգում» տատանումներով։
let audioCtx = null;

// Մեկ նոտա. հաճախությունը (բարձր/ցածր ձայն), տեսակը, տևողությունը
function beep(freq, endFreq, type, duration, volume, delay) {
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function sound(name) {
  // Ձայնը միանում է միայն առաջին դիպչելուց հետո (հեռախոսի կանոնն է)
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (name === 'jump') {
    // թռիչք՝ արագ վերև սլացող «թռյո՛ւթ»
    beep(300, 700, 'triangle', 0.18, 0.25);
  }
  if (name === 'fish') {
    // ձուկ բռնելը՝ ուրախ երկու նոտա «դզի՛նգ-դզի՛նգ»
    beep(880, 880, 'sine', 0.1, 0.3);
    beep(1320, 1320, 'sine', 0.15, 0.3, 0.09);
  }
  if (name === 'gold') {
    // ոսկե ձուկը՝ հաղթական երեք նոտա «դզի՛նգ-դզի՛նգ-դզի՛՜նգ»
    beep(880, 880, 'sine', 0.1, 0.3);
    beep(1109, 1109, 'sine', 0.1, 0.3, 0.09);
    beep(1319, 1319, 'sine', 0.25, 0.35, 0.18);
  }
  if (name === 'crash') {
    // բախվելը՝ ցածր «բո՛ւմ»
    beep(220, 55, 'sawtooth', 0.45, 0.35);
  }
}

// ——— Ֆոնային երաժշտությունը ———
// Փոքրիկ մեղեդի, որ պտտվում է անվերջ, քանի դեռ խաղում ես։
// Թվերը նոտաների «բարձրություններն» են (Հց). 0 նշանակում է դադար։
// Ամեն նոտայի տևողությունը (վայրկյան)։ Ինչքան խաղն արագ է,
// այնքան նոտաները կարճ են → երաժշտությունը արագանում է։
// Math.max-ը թույլ չի տալիս, որ չափից դուրս խելագարվի։
function musicStep() {
  return Math.max(0.12, 0.21 * (5 / speed));
}
const MELODY = [
  523, 0, 659, 0, 784, 659, 880, 0,     // դո մի սոլ մի լա
  784, 0, 659, 0, 587, 659, 523, 0,     // սոլ մի ռե մի դո
  659, 0, 784, 0, 880, 784, 1047, 0,    // մի սոլ լա սոլ դո↑
  880, 0, 784, 0, 659, 587, 523, 0,     // լա սոլ մի ռե դո
];
const BASS = [131, 98, 110, 98];        // բասը՝ ներքևից «բում-բում»
let noteIndex = 0;
let nextNoteTime = 0;

// Մեկ նոտա նվագում ենք ճիշտ պահին
function playNote(freq, time, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  gain.gain.setValueAtTime(volume, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + duration);
}

// Ամեն կադր մի քիչ առաջ ենք նայում ու պլանավորում հաջորդ նոտաները
function scheduleMusic() {
  if (!audioCtx || !running || gameOver) return;

  // եթե դադարից հետո ենք վերադառնում, մեղեդին նորից «տեղն ենք գցում»
  if (nextNoteTime < audioCtx.currentTime) {
    nextNoteTime = audioCtx.currentTime + 0.05;
  }

  while (nextNoteTime < audioCtx.currentTime + 0.15) {
    const step = musicStep();
    const freq = MELODY[noteIndex % MELODY.length];
    if (freq) playNote(freq, nextNoteTime, step * 0.9, 'square', 0.04);

    // ամեն 4 նոտան մեկ՝ բասի հարված
    if (noteIndex % 4 === 0) {
      playNote(BASS[(noteIndex / 4) % BASS.length], nextNoteTime, step * 3.5, 'triangle', 0.09);
    }

    noteIndex++;
    nextNoteTime += step;
  }
}

function jump() {
  if (gameOver) { restart(); return; }
  if (!running) { running = true; }
  if (!cat.jumping) {
    cat.vy = JUMP_POWER;
    cat.jumping = true;
    sound('jump');
  }
}

function restart() {
  boxes = [];
  fishes = [];
  popups = [];
  score = 0;
  speed = 5;
  cat.y = GROUND;
  cat.vy = 0;
  cat.jumping = false;
  gameOver = false;
  running = true;
}

// Ստեղները (համակարգչի համար)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
// Մատով դիպչելը կամ մկնիկով կտտացնելը (հեռախոսի համար)
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

// ——— Նկարում ենք կատվին ———
function drawCat() {
  const x = cat.x, y = cat.y;
  const run = running && !cat.jumping && !gameOver;
  const legSwing = run ? Math.sin(frame * 0.4) * 6 : 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(CAT_SIZE, CAT_SIZE);   // ամբողջ կատուն մեծանում է միանգամից

  // պոչը
  ctx.strokeStyle = '#f28c3b';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const tailWave = Math.sin(frame * 0.15) * 6;
  ctx.moveTo(-28, -26);
  ctx.quadraticCurveTo(-46, -34 + tailWave, -50, -52 + tailWave);
  ctx.stroke();

  // ոտքերը
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-18, -12); ctx.lineTo(-18 - legSwing, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14, -12);  ctx.lineTo(14 + legSwing, 0);  ctx.stroke();

  // մարմինը
  ctx.fillStyle = '#f28c3b';
  ctx.beginPath();
  ctx.ellipse(-4, -26, 30, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // գծավոր մեջքը
  ctx.strokeStyle = '#d96f21';
  ctx.lineWidth = 4;
  for (const sx of [-14, -2, 10]) {
    ctx.beginPath();
    ctx.moveTo(sx, -40);
    ctx.quadraticCurveTo(sx + 3, -34, sx, -28);
    ctx.stroke();
  }

  // գլուխը
  ctx.fillStyle = '#f28c3b';
  ctx.beginPath();
  ctx.arc(24, -40, 16, 0, Math.PI * 2);
  ctx.fill();

  // ականջները
  ctx.beginPath();
  ctx.moveTo(14, -50); ctx.lineTo(12, -64); ctx.lineTo(24, -54);
  ctx.moveTo(30, -52); ctx.lineTo(36, -64); ctx.lineTo(40, -50);
  ctx.fill();

  // աչքը
  ctx.fillStyle = '#23405c';
  ctx.beginPath();
  ctx.arc(29, -42, 2.6, 0, Math.PI * 2);
  ctx.fill();

  // քիթն ու բեղերը
  ctx.fillStyle = '#ff8fa3';
  ctx.beginPath();
  ctx.arc(39, -38, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(35,64,92,0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(40, -37); ctx.lineTo(52, -39);
  ctx.moveTo(40, -35); ctx.lineTo(52, -33);
  ctx.stroke();

  ctx.restore();
}

// ——— Նկարում ենք արկղը ———
function drawBox(b) {
  ctx.fillStyle = '#c9863f';
  ctx.fillRect(b.x, GROUND - b.h, b.w, b.h);
  ctx.strokeStyle = '#8f5a24';
  ctx.lineWidth = 3;
  ctx.strokeRect(b.x, GROUND - b.h, b.w, b.h);
  // ժապավենը արկղի վրա
  ctx.fillStyle = '#8f5a24';
  ctx.fillRect(b.x + b.w / 2 - 4, GROUND - b.h, 8, b.h);
}

// ——— Նկարում ենք ձուկը ———
function drawFish(f) {
  ctx.save();
  ctx.translate(f.x, f.y + Math.sin(frame * 0.1 + f.x) * 4);  // մի քիչ վեր-վար է լողում

  // ոսկե ձուկը փայլում է՝ շուրջը դեղին լուսապսակ
  if (f.gold) {
    ctx.fillStyle = 'rgba(255, 215, 80, 0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, 26 + Math.sin(frame * 0.25) * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // մարմինը
  ctx.fillStyle = f.gold ? '#f5b73b' : '#4aa3d8';
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // պոչը
  ctx.beginPath();
  ctx.moveTo(13, 0);
  ctx.lineTo(24, -8);
  ctx.lineTo(24, 8);
  ctx.closePath();
  ctx.fill();

  // փորիկը
  ctx.fillStyle = f.gold ? '#ffe08a' : '#8fd0f0';
  ctx.beginPath();
  ctx.ellipse(-2, 3, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // աչքը
  ctx.fillStyle = '#23405c';
  ctx.beginPath();
  ctx.arc(-9, -2, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // ոսկե ձկան փայլիկը
  if (f.gold) {
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.arc(2, -4, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ——— «+3» գրությունը, որ վեր է թռչում ձուկ բռնելիս ———
function drawPopups() {
  for (const p of popups) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = '#ff5d5d';
    ctx.font = 'bold 24px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

// ——— Ֆոնը՝ երկինք, արև/լուսին, աստղեր, ամպեր, գետին ———
function drawWorld() {
  // երկինքը. ցերեկը՝ երկնագույն, գիշերը՝ մուգ կապույտ
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, mixColor([159, 217, 239], [14, 22, 52], night));
  sky.addColorStop(1, mixColor([234, 248, 255], [43, 62, 105], night));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // աստղերը. գիշերը վառվում են ու թարթում
  if (night > 0.05) {
    for (const s of stars) {
      const twinkle = 0.6 + Math.sin((frame + s.tw) * 0.08) * 0.4;
      ctx.globalAlpha = night * twinkle;
      ctx.fillStyle = '#fff9e8';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // արևը ցերեկն է երևում…
  if (night < 0.95) {
    ctx.globalAlpha = 1 - night;
    ctx.fillStyle = '#ffd76e';
    ctx.beginPath();
    ctx.arc(W - 70, 60, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // …իսկ գիշերը նրա տեղը լուսինն է գալիս
  if (night > 0.05) {
    ctx.globalAlpha = night;
    ctx.fillStyle = '#f4f0dc';
    ctx.beginPath();
    ctx.arc(W - 70, 60, 26, 0, Math.PI * 2);
    ctx.fill();
    // մի կտոր «կծում ենք», որ կիսալուսին դառնա
    ctx.fillStyle = mixColor([159, 217, 239], [14, 22, 52], night);
    ctx.beginPath();
    ctx.arc(W - 82, 52, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ամպերը. գիշերը հազիվ են երևում
  ctx.fillStyle = 'rgba(255,255,255,' + (0.9 - night * 0.65) + ')';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 16 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 18 * c.s, c.y - 6 * c.s, 13 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 36 * c.s, c.y, 15 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  // գետինը. գիշերը մթնում է
  ctx.fillStyle = mixColor([232, 169, 76], [96, 74, 46], night);
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = mixColor([201, 134, 63], [70, 52, 32], night);
  ctx.fillRect(0, GROUND, W, 5);
}

// ——— Միավորները ———
function drawScore() {
  // գիշերը տառերը բաց գույն են դառնում, որ կարդացվեն
  ctx.fillStyle = mixColor([35, 64, 92], [234, 243, 255], night);
  ctx.font = 'bold 22px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Միավոր՝ ' + score, 20, 36);
  ctx.textAlign = 'right';
  ctx.fillText('Ռեկորդ՝ ' + best, W - 20, 36);
}

// Հաղորդագրության վահանակը էկրանի մեջտեղում
function drawCenterText(big, small) {
  const bw = Math.min(W - 30, 500);   // վահանակը միշտ տեղավորվում է էկրանին
  const bh = 110;
  const bx = W / 2 - bw / 2;
  const by = H / 2 - bh / 2;

  ctx.fillStyle = 'rgba(255, 253, 247, 0.9)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#23405c';
  ctx.lineWidth = 3;
  ctx.strokeRect(bx, by, bw, bh);

  ctx.fillStyle = '#23405c';
  ctx.textAlign = 'center';
  ctx.font = 'bold 28px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
  ctx.fillText(big, W / 2, by + 44);
  ctx.font = '17px "Noto Sans Armenian", Arial, sans-serif';
  ctx.fillText(small, W / 2, by + 80);
}

// ——— Խաղի քայլը՝ ամեն կադր ———
function update() {
  frame++;
  scheduleMusic();

  // 59 միավորից գիշերը կամաց-կամաց իջնում է, նոր խաղում՝ նորից լուսանում
  const nightTarget = score >= NIGHT_AT ? 1 : 0;
  night += (nightTarget - night) * 0.02;

  if (running && !gameOver) {
    // կատվի թռիչքը
    cat.vy += GRAVITY;
    cat.y += cat.vy;
    if (cat.y >= GROUND) {
      cat.y = GROUND;
      cat.vy = 0;
      cat.jumping = false;
    }

    // ամպերը դանդաղ լողում են
    for (const c of clouds) {
      c.x -= 0.4 * c.s;
      if (c.x < -60) c.x = W + 60;
    }

    // նոր արկղ ենք ավելացնում
    const last = boxes[boxes.length - 1];
    if (!last || last.x < W - 260 - Math.random() * 220) {
      const tall = Math.random() < 0.3;
      boxes.push({ x: W + 40, w: 34 + Math.random() * 16, h: tall ? 70 : 45, passed: false });
    }

    // երբեմն նոր ձուկ է հայտնվում օդում
    // 5-ից 1 դեպքում ձուկը ՈՍԿԵ է՝ +6, բայց ավելի արագ է լողում
    if (Math.random() < 0.008 && fishes.length < 2) {
      fishes.push({
        x: W + 40,
        y: GROUND - 75 - Math.random() * 55,   // այնքան բարձր, որ թռչելով հասնես
        gold: Math.random() < 0.2,
      });
    }

    // ձկները լողում են դեպի կատուն
    for (const f of fishes) {
      f.x -= speed * (f.gold ? 1.4 : 1);   // ոսկե ձուկը շտապում է փախչել

      // բռնեցի՞նք ձուկը → բոնուս
      const catchX = Math.abs(f.x - cat.x) < 40 * CAT_SIZE;
      const catchY = f.y > cat.y - 70 * CAT_SIZE && f.y < cat.y + 5;
      if (catchX && catchY) {
        f.caught = true;
        const bonus = f.gold ? 6 : 3;
        score += bonus;
        sound(f.gold ? 'gold' : 'fish');
        popups.push({ x: f.x, y: f.y - 15, life: 50, text: '+' + bonus + (f.gold ? ' 🌟' : ' 🐟') });
        if (score > best) {
          best = score;
          localStorage.setItem('cat-best', best);
        }
      }
    }
    fishes = fishes.filter(f => !f.caught && f.x > -40);

    // «+3» գրությունները վեր են բարձրանում ու հալվում
    for (const p of popups) { p.y -= 1.2; p.life--; }
    popups = popups.filter(p => p.life > 0);

    // արկղերը շարժվում են
    for (const b of boxes) {
      b.x -= speed;

      // անցա՞նք արկղի վրայով → միավոր
      if (!b.passed && b.x + b.w < cat.x - 30) {
        b.passed = true;
        score++;
        if (score % 5 === 0) speed += 0.5;   // ամեն 5 միավորից՝ ավելի արագ
        if (score > best) {
          best = score;
          localStorage.setItem('cat-best', best);
        }
      }

      // բախվեցի՞նք
      const catLeft = cat.x - 26 * CAT_SIZE, catRight = cat.x + 38 * CAT_SIZE, catBottom = cat.y;
      if (catRight > b.x + 6 && catLeft < b.x + b.w - 6 && catBottom > GROUND - b.h + 8) {
        if (!gameOver) sound('crash');
        gameOver = true;
        running = false;
      }
    }
    boxes = boxes.filter(b => b.x > -80);
  }

  // ——— Նկարում ենք ամեն ինչ ———
  ctx.clearRect(0, 0, W, H);
  drawWorld();
  for (const b of boxes) drawBox(b);
  for (const f of fishes) drawFish(f);
  drawCat();
  drawPopups();
  drawScore();

  if (!running && !gameOver) {
    drawCenterText('Կատուն թռչում է 🐱', 'Դիպչիր էկրանին կամ սեղմիր ՊՐՈԲԵԼԸ');
  }
  if (gameOver) {
    drawCenterText('Ա՜խ, բախվեցիր 😿', 'Հավաքեցիր ' + score + ' միավոր · Դիպչիր՝ նորից խաղալու');
  }

  requestAnimationFrame(update);
}

update();
</script>
