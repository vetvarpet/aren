<meta charset="utf-8">

<title>Golden Cat 🐱</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100dvh;
    padding: 72px 18px 28px;   /* վերևից տեղ ենք թողնում «← Golden Games»-ի համար */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  nav { position: fixed; top: 14px; left: 14px; }
  nav a {
    color: #f5eede;
    text-decoration: none;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  h1 { font-size: clamp(1.3rem, 5vw, 2rem); color: #ffd76e; text-align: center; }
  .sub { color: #9a9ec7; text-align: center; }

  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(92vw, 420px);
  }
  .g {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1d1d3f;
    border: 2px solid #33356b;
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: #f5eede;
    transition: transform 0.12s, border-color 0.12s;
  }
  .g:hover { transform: translateY(-3px); border-color: #ffd76e; }
  .g .ico {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .g1 .ico { background: linear-gradient(135deg, #2b6cb0, #90cdf4); }
  .g2 .ico { background: linear-gradient(135deg, #b7791f, #f6e05e); }
  .g .ico svg { width: 78%; height: 78%; display: block; }
  .g h2 { font-size: 1.05rem; }
  .g p { color: #9a9ec7; font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
</style>

<nav><a href="../">← Golden Games</a></nav>

<h1>Golden Cat 🐱</h1>
<p class="sub">Ընտրի՛ր՝ ո՞վ է այսօր թռչելու։</p>

      <circle cx="32" cy="21" r="1.4" fill="#3a2a17"/>
      <circle cx="37" cy="21" r="1.4" fill="#3a2a17"/>
      <path d="M12 38 L8 43 M20 39 L18 44 M28 37 L30 43" stroke="#e8873c" stroke-width="3.5" stroke-linecap="round"/>
    </svg></div>
    <div><h2>Կատվի վազքը</h2><p>Թռիր արկղերի վրայով, բռնիր ձկներ, զգուշացիր գիշերվա ագռավներից</p></div>
  </a>
  <a class="g g2" href="./bird/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="26" r="12" fill="#ffd166"/>
      <circle cx="24" cy="29" r="6.5" fill="#fff3c4"/>

<script>

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  ru: { h1: 'Golden Cat 🐱', sub: 'Выбери, кто сегодня летает.', g1: ['Кошачий забег', 'Прыгай через ящики, лови рыбок, берегись ночных ворон'], g2: ['Golden Bird', 'Птичка летит между башнями из ящиков: нажимай, чтобы махать крыльями'] },
  en: { h1: 'Golden Cat 🐱', sub: 'Choose who flies today.', g1: ['Cat Run', 'Jump over boxes, catch fish, watch out for night crows'], g2: ['Golden Bird', 'The bird flies between box towers: tap to flap its wings'] },
  es: { h1: 'Golden Cat 🐱', sub: 'Elige quién vuela hoy.', g1: ['Carrera del gato', 'Salta las cajas, atrapa peces y cuidado con los cuervos nocturnos'], g2: ['Golden Bird', 'El pajarito vuela entre torres de cajas: toca para batir las alas'] },
  fr: { h1: 'Golden Cat 🐱', sub: 'Choisis qui vole aujourd’hui.', g1: ['La course du chat', 'Saute les caisses, attrape des poissons, gare aux corbeaux de nuit'], g2: ['Golden Bird', 'L’oiseau vole entre les tours de caisses : touche pour battre des ailes'] },
  de: { h1: 'Golden Cat 🐱', sub: 'Wähle, wer heute fliegt.', g1: ['Katzenlauf', 'Spring über Kisten, fang Fische, pass auf die Nachtkrähen auf'], g2: ['Golden Bird', 'Der Vogel fliegt zwischen Kistentürmen: tippe zum Flattern'] },
  ja: { h1: 'Golden Cat 🐱', sub: '今日はだれが飛ぶ？', g1: ['ネコのランニング', '箱をとびこえ、魚をキャッチ、夜のカラスに気をつけて'], g2: ['Golden Bird', 'ことりが箱のタワーのあいだを飛ぶよ：タップではばたこう'] },
  zh: { h1: 'Golden Cat 🐱', sub: '今天谁来飞？', g1: ['小猫快跑', '跳过箱子抓小鱼，小心夜里的乌鸦'], g2: ['Golden Bird', '小鸟在箱子塔之间飞行：点一下拍翅膀'] },
  it: { h1: 'Golden Cat 🐱', sub: 'Scegli chi vola oggi.', g1: ['Corsa del gatto', 'Salta le casse, prendi i pesci, attento ai corvi notturni'], g2: ['Golden Bird', 'L’uccellino vola tra torri di casse: tocca per battere le ali'] },
  ka: { h1: 'Golden Cat 🐱', sub: 'აირჩიე, ვინ იფრენს დღეს.', g1: ['კატის რბოლა', 'გადაახტი ყუთებს, დაიჭირე თევზები, ერიდე ღამის ყვავებს'], g2: ['Golden Bird', 'ჩიტი დაფრინავს ყუთების კოშკებს შორის: დააჭირე ფრთების ასაქნევად'] },
  hi: { h1: 'Golden Cat 🐱', sub: 'चुनो, आज कौन उड़ेगा।', g1: ['बिल्ली की दौड़', 'बक्सों के ऊपर कूदो, मछलियाँ पकड़ो, रात के कौवों से बचो'], g2: ['Golden Bird', 'चिड़िया बक्सों की मीनारों के बीच उड़ती है: पंख फड़फड़ाने के लिए टैप करो'] },
};
const T = TRL[ggLang];
if (T) {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.sub').textContent = T.sub;
  [['g1', '.g1'], ['g2', '.g2']].forEach(([k, sel]) => {
    document.querySelector(sel + ' h2').textContent = T[k][0];
    document.querySelector(sel + ' p').textContent = T[k][1];
  });
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
