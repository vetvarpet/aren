<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Bird 🐦</title>
<link rel="icon" type="image/png" href="../../logo-icon.png">
<style>
  * { margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #9fd9ef; }
  canvas { display: block; touch-action: none; cursor: pointer; }
</style>

<a href="../../" style="position:fixed;top:10px;right:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;font-family:Arial,sans-serif;">← Golden Games</a>

<canvas id="cv"></canvas>

<script>
// ——————————————————————————————————————
//  GOLDEN BIRD 🐦 — հպիր, թափահարիր, թռիր
//  Ոսկե թռչնակը թռչում է արկղաշարերի արանքով։
//  Ամեն անցած արկղաշար՝ +1 միավոր։
// ——————————————————————————————————————

let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
// Կանվասի վրա էմոջի չենք գրում — նկարում ենք ձեռքով
const TRL = {
  hy: { crown: 'Թագը վաստակիր՝ 21 միավոր', how: 'Հպիր՝ թևերը թափահարելու', tap: 'Հպիր՝ սկսելու', best: 'Ռեկորդ՝ ', over: 'Բա՜խ…', rec: 'ՆՈՐ ՌԵԿՈՐԴ', again: 'Հպիր՝ նորից թռչելու' },
  ru: { crown: 'Заработай корону: 21 очко', how: 'Нажимай, чтобы махать крыльями', tap: 'Коснись, чтобы начать', best: 'Рекорд: ', over: 'Бум…', rec: 'НОВЫЙ РЕКОРД', again: 'Коснись, чтобы лететь снова' },
  en: { crown: 'Earn the crown at 21 points', how: 'Tap to flap your wings', tap: 'Tap to start', best: 'Best: ', over: 'Bonk…', rec: 'NEW RECORD', again: 'Tap to fly again' },
  es: { crown: 'Gana la corona con 21 puntos', how: 'Toca para batir las alas', tap: 'Toca para empezar', best: 'Récord: ', over: '¡Pum!…', rec: 'NUEVO RÉCORD', again: 'Toca para volar otra vez' },
  fr: { crown: 'Gagne la couronne à 21 points', how: 'Touche pour battre des ailes', tap: 'Touche pour commencer', best: 'Record : ', over: 'Boum…', rec: 'NOUVEAU RECORD', again: 'Touche pour revoler' },
  de: { crown: 'Verdien dir die Krone: 21 Punkte', how: 'Tippe zum Flattern', tap: 'Tippe zum Starten', best: 'Rekord: ', over: 'Bums…', rec: 'NEUER REKORD', again: 'Tippe, um wieder zu fliegen' },
  ja: { crown: 'おうかんは21ポイントでゲット', how: 'タップではばたこう', tap: 'タップでスタート', best: 'ベスト：', over: 'ゴツン…', rec: 'しんきろく', again: 'タップでもういっかい' },
  zh: { crown: '拿到21分就能戴上王冠', how: '点一下拍翅膀', tap: '点一下开始', best: '纪录：', over: '砰…', rec: '新纪录', again: '点一下再飞一次' },
  it: { crown: 'Vinci la corona a 21 punti', how: 'Tocca per battere le ali', tap: 'Tocca per iniziare', best: 'Record: ', over: 'Bum…', rec: 'NUOVO RECORD', again: 'Tocca per volare di nuovo' },
  ka: { crown: 'მოიპოვე გვირგვინი 21 ქულით', how: 'დააჭირე ფრთების ასაქნევად', tap: 'დააჭირე დასაწყებად', best: 'რეკორდი: ', over: 'ბახ…', rec: 'ახალი რეკორდი', again: 'დააჭირე თავიდან საფრენად' },
  hi: { crown: '21 अंक पर ताज जीतो', how: 'पंख फड़फड़ाने के लिए टैप करो', tap: 'शुरू करने के लिए टैप करो', best: 'रिकॉर्ड: ', over: 'धड़ाम…', rec: 'नया रिकॉर्ड', again: 'फिर से उड़ने के लिए टैप करो' },
};
const T = TRL[ggLang] || TRL.hy;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sFlap = () => tone(430 + Math.random() * 60, 0.06, 'sine', 0.07);
const sScore = () => { tone(880, 0.08, 'triangle', 0.14); tone(1174, 0.1, 'triangle', 0.1, 0.05); };
const sHit = () => { tone(150, 0.25, 'sawtooth', 0.2); tone(90, 0.3, 'sawtooth', 0.14, 0.05); };
const sRecord = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.2, 'triangle', 0.18, k * 0.11));
const sCrown = () => [784, 988, 1175, 1568, 1175, 1568].forEach((f, k) => tone(f, 0.16, 'triangle', 0.17, k * 0.09));

// ——— Խաղի թվերը ———
const GRAV = 0.42;          // ձգողությունը
const FLAP = -7.6;          // թևի հարվածի ուժը (մինուսը՝ վերև)
const CROWN_AT = 21;        // այսքան միավորից թռչնակը թագ է ստանում (Արենի կանոնը)
let state = 'menu';         // menu / play / dying / over
let bird, pipes, score, dist, endedAt, wingT = 0, cloudsB = [], deadFall = false;
let best = 0;
try { best = Number(localStorage.getItem('aren-bird-best') || 0); } catch (e) {}

function newGame() {
  bird = { x: W * 0.3, y: H * 0.45, vy: 0 };
  pipes = [];
  score = 0;
  dist = 0;
  deadFall = false;
  cloudsB = [];
  for (let i = 0; i < 5; i++) cloudsB.push({ x: Math.random() * W, y: 40 + Math.random() * H * 0.4, s: 0.6 + Math.random() * 0.8 });
  state = 'play';
}

function speedNow() { return 2.6 + Math.min(score, 40) * 0.03; }
function gapNow() { return H * Math.max(0.24, 0.31 - score * 0.002); }

function addPipe() {
  const gap = gapNow();
  const margin = H * 0.12;
  const cy = margin + gap / 2 + Math.random() * (H - 2 * margin - gap - H * 0.09);
  pipes.push({ x: W + 60, cy, gap, passed: false });
}

function flap() {
  if (state === 'menu') { initAudio(); newGame(); return; }
  if (state === 'over') {
    if (Date.now() - endedAt > 1100) { initAudio(); newGame(); }
    return;
  }
  if (state !== 'play') return;
  initAudio();
  bird.vy = FLAP;
  wingT = 1;
  sFlap();
}
window.addEventListener('touchstart', (e) => { if (!e.target.closest('a')) flap(); }, { passive: true });
window.addEventListener('mousedown', (e) => { if (!e.target.closest('a')) flap(); });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

function die() {
  state = 'dying';
  sHit();
}

const BR = () => Math.max(14, Math.min(20, H * 0.024));   // թռչնակի չափը

function step() {
  if (state === 'play') {
    dist += speedNow();
    // ամեն ~ էկրանի կեսը մի նոր արկղաշար
    if (!pipes.length || pipes[pipes.length - 1].x < W - Math.max(240, W * 0.48)) addPipe();

    bird.vy += GRAV;
    bird.y += bird.vy;
    if (wingT > 0) wingT -= 0.08;

    const r = BR();
    const groundY = H - H * 0.08;
    if (bird.y + r > groundY || bird.y - r < 0) { bird.y = Math.max(r, Math.min(groundY - r, bird.y)); die(); return; }

    for (const p of pipes) {
      p.x -= speedNow();
      const half = p.gap / 2, pw = Math.max(52, W * 0.09);
      // Բախո՞ւմ է. թռչնակը արկղաշարի գոտում է ու անցքից դուրս
      if (bird.x + r > p.x && bird.x - r < p.x + pw &&
          (bird.y - r < p.cy - half || bird.y + r > p.cy + half)) { die(); return; }
      if (!p.passed && p.x + pw < bird.x - r) {
        p.passed = true;
        score++;
        score === CROWN_AT ? sCrown() : sScore();   // 21-ին՝ թագադրման ֆանֆար
      }
    }
    pipes = pipes.filter(p => p.x > -200);
    for (const c of cloudsB) { c.x -= speedNow() * 0.25 * c.s; if (c.x < -80) { c.x = W + 60; c.y = 40 + Math.random() * H * 0.4; } }
  } else if (state === 'dying') {
    // ընկնում է ներքև՝ պտտվելով
    bird.vy += GRAV;
    bird.y += bird.vy;
    if (bird.y > H - H * 0.08 - BR()) {
      state = 'over';
      endedAt = Date.now();
      if (score > best) {
        best = score;
        try { localStorage.setItem('aren-bird-best', best); } catch (e) {}
        sRecord();
      }
    }
  }
}

// ——— Նկարելը ———
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#9fd9ef');
  g.addColorStop(1, '#eaf8ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(W * 0.84, H * 0.12, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const c of cloudsB) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 20 * c.s, c.y + 5 * c.s, 24 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {   // հողը նկարում ենք արկղերից ՀԵՏՈ, որ արկղերը խոտի տակ մտնեն
  const gy = H - H * 0.08;
  ctx.fillStyle = '#7fb84e';
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#6da53f';
  ctx.fillRect(0, gy, W, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let x = (-dist * 0.6) % 46; x < W; x += 46) ctx.fillRect(x, gy + 12, 22, 5);
}

function drawBox(x, y, s) {   // մեկ արկղ՝ կատվի խաղի ոճով
  ctx.fillStyle = '#c08945';
  ctx.fillRect(x, y, s, s);
  ctx.strokeStyle = '#8a5a24';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
  ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + s - 3, y + s - 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s - 3, y + 3); ctx.lineTo(x + 3, y + s - 3); ctx.stroke();
}

function drawPipes() {
  const pw = Math.max(52, W * 0.09);
  for (const p of pipes) {
    const half = p.gap / 2;
    // վերևի ու ներքևի արկղաշարերը
    for (let y = p.cy - half - pw; y > -pw; y -= pw) drawBox(p.x, y, pw);
    for (let y = p.cy + half; y < H - H * 0.08; y += pw) drawBox(p.x, y, pw);
  }
}

function drawBird() {
  const r = BR();
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const rot = state === 'dying' ? Math.min(1.4, bird.vy * 0.08) : Math.max(-0.45, Math.min(0.9, bird.vy * 0.045));
  ctx.rotate(rot);
  // պոչի փետուրները
  ctx.fillStyle = '#f0b429';
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, 0);
  ctx.lineTo(-r * 1.7, -r * 0.5);
  ctx.lineTo(-r * 1.7, r * 0.5);
  ctx.closePath();
  ctx.fill();
  // մարմինը
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.3, 0, 0, r * 1.1);
  g.addColorStop(0, '#ffe08a');
  g.addColorStop(1, '#ffd166');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c98a12';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  // փորիկը
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(r * 0.1, r * 0.35, r * 0.55, 0, Math.PI * 2); ctx.fill();
  // թևը՝ թափահարում է
  const wing = Math.sin(wingT * Math.PI) * 0.9 - 0.2;
  ctx.save();
  ctx.translate(-r * 0.15, 0);
  ctx.rotate(wing);
  ctx.fillStyle = '#f0b429';
  ctx.beginPath();
  ctx.ellipse(-r * 0.45, 0, r * 0.75, r * 0.4, 0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // աչքն ու կտուցը
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.28, r * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2a17';
  ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.28, r * 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff8c28';
  ctx.beginPath();
  ctx.moveTo(r * 0.85, -r * 0.05);
  ctx.lineTo(r * 1.5, r * 0.12);
  ctx.lineTo(r * 0.8, r * 0.32);
  ctx.closePath();
  ctx.fill();
  // Ոսկե թագը ՎԱՍՏԱԿՈՒՄ ես՝ 21 միավորից (մենյուում երևում է, եթե ռեկորդդ 21+ է)
  const crowned = state === 'menu' ? best >= CROWN_AT : score >= CROWN_AT;
  if (crowned) {
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#c98a12';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.45, -r * 0.85);
    ctx.lineTo(-r * 0.5, -r * 1.35);
    ctx.lineTo(-r * 0.15, -r * 1.0);
    ctx.lineTo(r * 0.1, -r * 1.45);
    ctx.lineTo(r * 0.35, -r * 1.0);
    ctx.lineTo(r * 0.62, -r * 1.3);
    ctx.lineTo(r * 0.5, -r * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function drawText(txt, x, y, size, color, align, bold) {
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + size + 'px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.fillText(txt, x, y);
}

function draw() {
  drawBg();

  if (state === 'menu') {
    drawGround();
    drawText('Golden Bird', W / 2, H * 0.26, Math.min(44, W * 0.1), '#2e5a12', 'center', true);
    bird = bird || { x: W * 0.3, y: H * 0.45, vy: 0 };
    const keep = { x: bird.x, y: bird.y };
    bird.x = W / 2; bird.y = H * 0.45 + Math.sin(Date.now() / 300) * 8;
    wingT = (Math.sin(Date.now() / 160) + 1) / 2;
    drawBird();
    bird.x = keep.x; bird.y = keep.y;
    drawText(T.how, W / 2, H * 0.62, Math.min(19, W * 0.05), '#23405c');
    drawText(T.crown, W / 2, H * 0.665, Math.min(15, W * 0.04), '#8a6d1f');
    if (best > 0) drawText(T.best + best, W / 2, H * 0.71, Math.min(16, W * 0.042), '#4a6a86');
    if (Math.floor(Date.now() / 600) % 2) drawText(T.tap, W / 2, H * 0.76, Math.min(17, W * 0.045), '#2e5a12', 'center', true);
    return;
  }

  drawPipes();
  drawGround();
  drawBird();

  // HUD
  drawText(String(score), W / 2, 84, 46, '#ffffff', 'center', true);
  if (best > 0) drawText(T.best + best, W / 2, 108, 15, 'rgba(35,64,92,0.8)');

  if (state === 'over') {
    ctx.fillStyle = 'rgba(12,10,26,0.72)';
    ctx.fillRect(0, 0, W, H);
    drawText(T.over, W / 2, H * 0.34, Math.min(30, W * 0.075), '#eef0ff', 'center', true);
    drawText(String(score), W / 2, H * 0.47, Math.min(64, W * 0.15), '#ffd166', 'center', true);
    if (score >= best && score > 0) drawText(T.rec, W / 2, H * 0.55, Math.min(22, W * 0.055), '#6ee7b7', 'center', true);
    else if (best > 0) drawText(T.best + best, W / 2, H * 0.55, Math.min(18, W * 0.047), '#9a9ec7');
    if (Date.now() - endedAt > 1100 && Math.floor(Date.now() / 600) % 2) {
      drawText(T.again, W / 2, H * 0.66, Math.min(17, W * 0.045), '#6ee7b7');
    }
  }
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
