function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

];
const rnd = (a, b) => a + Math.random() * (b - a);

// Իրերը ցրում ենք սենյակով՝ իրարից հեռու
function placeAll() {
  const pad = 34;
  const put = (list, i, s) => {
    for (let k = 0; k < 260; k++) {
      const x = rnd(pad, W - pad), y = rnd(TOPY + pad, BOTY - pad);
      let ok = true;
      for (const o of list) { if (o !== list[i] && Math.hypot(o.x - x, o.y - y) < s * 1.9) { ok = false; break; } }
      if (ok) { list[i].x = x; list[i].y = y; return; }
    }
    list[i].x = rnd(pad, W - pad); list[i].y = rnd(TOPY + pad, BOTY - pad);
  };
  for (let i = 0; i < objs.length; i++) put(objs, i, objs[i].s);
  for (const p of props) {
    p.x = rnd(10, W - 10); p.y = rnd(TOPY + 10, BOTY - 10);
  }
}

function newRoom() {
  const cfg = ROOMS[room - 1];
  const kinds = KINDS.slice().sort(() => Math.random() - 0.5).slice(0, cfg.n);
  objs = kinds.map(k => ({ kind: k, x: 0, y: 0, s: cfg.size, rot: rnd(-0.5, 0.5), found: false, pop: 0 }));
  props = [];
  for (let i = 0; i < cfg.clutter; i++) {
    props.push({
      x: 0, y: 0, w: rnd(18, 60), h: rnd(14, 46), rot: rnd(-0.6, 0.6),
      c: ['#5b3f6e', '#3c5a7a', '#6b4b3a', '#3f6b52', '#7a5f3a', '#4a4a6b'][Math.floor(Math.random() * 6)],
      round: Math.random() < 0.4,
    });
  }
  placeAll();
  pickTarget();
  sRoom();
}

function pickTarget() {
  const left = objs.map((o, i) => i).filter(i => !objs[i].found);
  target = left.length ? left[Math.floor(Math.random() * left.length)] : -1;
}

function startGame() {
  score = 0; room = 1; timeLeft = 90; hints = 3; hintUntil = 0;
  state = 'play'; ov.hidden = true; elHint.hidden = false;
  newRoom();
  syncHud();
}

function endGame(won) {
  state = 'over'; endedAt = Date.now();
  elHint.hidden = true;
  sEnd();
  if (score > best) {
    best = score;
    try { localStorage.setItem('aren-detective-best', best); } catch (e) {}
    confetti();
  }
  document.getElementById('ovTitle').textContent = won ? T.allDone : T.timeup;
  document.getElementById('ovText').textContent = T.sc + score;
  document.getElementById('ovBest').textContent = T.best + best;
  document.getElementById('ovTap').textContent = T.again;
  ov.hidden = false;
}

function syncHud() {
  elFind.textContent = target >= 0 ? T.find + T.obj[objs[target].kind] : '';
  elStat.textContent = T.room(room) + '  ·  ' + T.sc + score + '  ·  ' + T.tm + Math.ceil(timeLeft) + T.sec;
  elHint.textContent = T.hint + ' ×' + hints;
  elHint.disabled = hints <= 0 || state !== 'play';
}

// ——— Հպումները ———
// Հեռախոսը հպումից հետո «ուրվական» մկնիկի իրադարձություններ է ուղարկում,
// դրա համար հիշում ենք վերջին հպման ժամանակը ու անտեսում մկնիկը
let lastTouchAt = 0;
function isGhost(e) {
  if (e.pointerType === 'touch') { lastTouchAt = Date.now(); return false; }
  return Date.now() - lastTouchAt < 700;
}
cv.addEventListener('pointerdown', (e) => {
  if (isGhost(e)) return;
  e.preventDefault();
  initAudio();
  if (state !== 'play' || target < 0) return;
  const x = e.clientX, y = e.clientY;
  const o = objs[target];
  if (!o.found && Math.hypot(o.x - x, o.y - y) < o.s * 0.95) {
    o.found = true; o.pop = 1; score++; sFound();
    if (objs.every(k => k.found)) {
      if (room >= 3) { syncHud(); endGame(true); return; }
      room++; newRoom();
    } else pickTarget();
    syncHud();
  } else {
    timeLeft = Math.max(0, timeLeft - 3);   // սխալ հպում՝ փոքր տուգանք
    shakeUntil = Date.now() + 260;
    sWrong();
    syncHud();
  }
}, { passive: false });
cv.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
cv.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

ov.addEventListener('pointerdown', (e) => {
  if (isGhost(e)) return;
  initAudio();
  if (state === 'over' && Date.now() - endedAt < 1100) return;   // սպասիր, որ պատահական չսկսես
  startGame();
});
elHint.addEventListener('pointerdown', (e) => {
  if (isGhost(e)) return;
  e.preventDefault();
  initAudio();
  if (state !== 'play' || hints <= 0 || Date.now() < hintUntil) return;
  hints--; hintUntil = Date.now() + 1500; sHint();
  syncHud();
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// ——— Նկարելը ———
function drawRoom() {
  const wallB = ['#3a2b46', '#2f3a52', '#43312a'][room - 1];
  const floorB = ['#5a4130', '#3f4e3a', '#4a3550'][room - 1];
  const horizon = TOPY + (BOTY - TOPY) * 0.52;
  ctx.fillStyle = wallB; ctx.fillRect(0, 0, W, horizon);
  ctx.fillStyle = floorB; ctx.fillRect(0, horizon, W, H - horizon);
  // պատի պաստառ՝ շերտեր
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 10;
  for (let x = 0; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, horizon); ctx.stroke(); }
  // հատակի տախտակներ
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
  for (let y = horizon; y < H; y += 22) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // պատուհան ու գորգ՝ սենյակին կյանք տալու համար
  ctx.fillStyle = '#6fa8d0'; ctx.fillRect(W * 0.62, TOPY + 6, W * 0.3, (horizon - TOPY) * 0.55);
  ctx.strokeStyle = '#8a6d4a'; ctx.lineWidth = 5;
  ctx.strokeRect(W * 0.62, TOPY + 6, W * 0.3, (horizon - TOPY) * 0.55);
  ctx.fillStyle = 'rgba(180,90,90,0.35)';
  ctx.beginPath(); ctx.ellipse(W * 0.35, horizon + (H - horizon) * 0.45, W * 0.3, 46, 0, 0, Math.PI * 2); ctx.fill();
  // խառնաշփոթը (որքան բարձր սենյակ, այնքան շատ)
  for (const p of props) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.globalAlpha = 0.9;
    ctx.beginPath();
    if (p.round) ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
    else ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 5);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const shake = Date.now() < shakeUntil ? Math.sin(Date.now() * 0.06) * 5 : 0;
  ctx.save();
  ctx.translate(shake, 0);
  drawRoom();
  for (const o of objs) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot);
    if (o.found) {
      o.pop = Math.max(0, o.pop - 0.03);
      ctx.globalAlpha = 0.45;
      ctx.scale(1 + o.pop * 0.4, 1 + o.pop * 0.4);
    }
    PAINT[o.kind](o.s);
    ctx.restore();
    if (o.found) {
      ctx.strokeStyle = 'rgba(110,231,183,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.s * 0.9, 0, Math.PI * 2); ctx.stroke();
    }
  }
  // 💡 հուշում — մթնեցնում ենք ամեն ինչ, բացի թիրախի շուրջը
  if (Date.now() < hintUntil && target >= 0) {
    const o = objs[target];
    const r = 88;
    ctx.fillStyle = 'rgba(8,4,14,0.82)';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
    ctx.fill('evenodd');
    ctx.strokeStyle = '#ffd76e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, Math.PI * 2); ctx.stroke();
  }
  if (Date.now() < shakeUntil) {
    ctx.fillStyle = 'rgba(220,60,60,0.18)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function confetti() {
  const stuff = ['🎉', '🔎', '⭐', '💛', '🎊', '✨'];
  for (let k = 0; k < 34; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.cssText = 'position:fixed;top:-50px;z-index:9;pointer-events:none;left:' + (Math.random() * 100) + 'vw;font-size:' + (16 + Math.random() * 20) + 'px;transition:transform ' + (2 + Math.random() * 2) + 's linear';
    document.body.appendChild(s);
    requestAnimationFrame(() => { s.style.transform = 'translateY(115vh) rotate(720deg)'; });
    setTimeout(() => s.remove(), 4600);
  }
}

function loop(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts; tNow = ts;
  if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; syncHud(); endGame(false); }
    else if (Math.floor(timeLeft * 2) !== Math.floor((timeLeft + dt) * 2)) syncHud();
  }
  draw();
  requestAnimationFrame(loop);
}

// ——— Մեկնարկի էկրանը ———
document.getElementById('ovTitle').textContent = T.title;
document.getElementById('ovText').textContent = T.h1 + '\n' + T.h2;
document.getElementById('ovBest').textContent = best > 0 ? T.best + best : '';
document.getElementById('ovTap').textContent = T.start;
elHint.textContent = T.hint + ' ×3';
elHint.hidden = true;
elFind.textContent = T.title;
elStat.textContent = T.h2;
requestAnimationFrame(loop);
</script>
