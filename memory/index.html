<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Հիշողության խաղեր 🧠</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100dvh;
    padding: 72px 18px 28px;   /* վերևից տեղ ենք թողնում «← Golden Games»-ի համար */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  nav { position: fixed; top: 14px; left: 14px; }
  nav a {
    color: #f5eede;
    text-decoration: none;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  h1 { font-size: clamp(1.3rem, 5vw, 2rem); color: #ffd76e; text-align: center; }
  .sub { color: #9a9ec7; text-align: center; }

  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(92vw, 420px);
  }
  .g {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1d1d3f;
    border: 2px solid #33356b;
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: #f5eede;
    transition: transform 0.12s, border-color 0.12s;
  }
  .g:hover { transform: translateY(-3px); border-color: #ffd76e; }
  .g .ico {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    flex-shrink: 0;
  }
  .g1 .ico { background: linear-gradient(135deg, #7a3e8f, #f2a7d8); }
  .g2 .ico { background: linear-gradient(135deg, #7a1f1f, #f4d13b); }
  .g3 .ico { background: linear-gradient(135deg, #14532d, #6ee7b7); }
  .g .ico svg { width: 78%; height: 78%; display: block; }
  .g h2 { font-size: 1.05rem; }
  .g p { color: #9a9ec7; font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
</style>

<nav><a href="../">← Golden Games</a></nav>

<h1>Հիշողության խաղեր 🧠</h1>
<p class="sub">Երեք խաղ՝ ուղեղդ մարզելու համար։ Ընտրի՛ր։</p>

<div class="games">
  <a class="g g1" href="./pairs/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <g transform="translate(18,25) rotate(-14)"><rect x="-9" y="-13" width="18" height="26" rx="4" fill="#4a2360" stroke="#e9c8f5" stroke-width="2"/><path d="M0 -5 L4 0 L0 5 L-4 0 Z" fill="#a86cc0"/></g>
      <g transform="translate(30,24) rotate(10)"><rect x="-9" y="-13" width="18" height="26" rx="4" fill="#fdf7ff" stroke="#e9c8f5" stroke-width="2"/><path d="M0 -7.1 L1.6 -2.6 L6.5 -2.5 L2.6 0.4 L4 5.1 L0 2.3 L-4 5.1 L-2.6 0.4 L-6.5 -2.5 L-1.6 -2.6 Z" fill="#ffd166" stroke="#d9a92e" stroke-width="1"/></g>
    </svg></div>
    <div><h2>Զույգեր</h2><p>16 քարտ, 8 զույգ․ գտիր բոլորը ամենաքիչ փորձով</p></div>
  </a>
  <a class="g g2" href="./repeat/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 4 V9 M38 9 L34.5 12.5 M10 9 L13.5 12.5 M42 22 H37 M6 22 H11" stroke="#fff3c4" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      <circle cx="24" cy="22" r="10" fill="#ffd166" stroke="#d9a92e" stroke-width="2"/>
      <path d="M20 27 q4 -6 8 0" fill="none" stroke="#d9a92e" stroke-width="2" stroke-linecap="round"/>
      <rect x="19.5" y="33" width="9" height="3.5" rx="1.7" fill="#e8e8f5"/>
      <rect x="20.5" y="38" width="7" height="3.5" rx="1.7" fill="#c9c9dd"/>
    </svg></div>
    <div><h2>Կրկնիր ինձ</h2><p>4 գույն, 4 ձայն․ կրկնիր երկարացող շղթան</p></div>
  </a>
  <a class="g g3" href="./numbers/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="5" y="8" width="17" height="17" rx="4" fill="#fdfdff"/>
      <rect x="26" y="8" width="17" height="17" rx="4" fill="#ffd166"/>
      <rect x="15" y="27" width="17" height="17" rx="4" fill="#6ee7b7"/>
      <text x="13.5" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#33356b" font-family="Arial, sans-serif">1</text>
      <text x="34.5" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c4308" font-family="Arial, sans-serif">2</text>
      <text x="23.5" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d" font-family="Arial, sans-serif">3</text>
    </svg></div>
    <div><h2>Թվերի որսորդ</h2><p>Թվերը թաքնվում են․ սեղմիր հերթով՝ 1, 2, 3…</p></div>
  </a>
</div>

<script>

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  ru: { h1: 'Игры на память 🧠', sub: 'Три игры для тренировки мозга. Выбирай!', g1: ['Пары', '16 карт, 8 пар: найди все за меньшее число попыток'], g2: ['Повтори за мной', '4 цвета, 4 звука: повторяй растущую цепочку'], g3: ['Охотник за числами', 'Числа прячутся: нажимай по порядку 1, 2, 3…'] },
  en: { h1: 'Memory Games 🧠', sub: 'Three games to train your brain. Pick one!', g1: ['Pairs', '16 cards, 8 pairs: find them all in the fewest tries'], g2: ['Repeat After Me', '4 colors, 4 sounds: repeat the growing sequence'], g3: ['Number Hunter', 'The numbers hide: tap them in order 1, 2, 3…'] },
  es: { h1: 'Juegos de memoria 🧠', sub: 'Tres juegos para entrenar tu cerebro. ¡Elige!', g1: ['Parejas', '16 cartas, 8 parejas: encuéntralas en el menor número de intentos'], g2: ['Repite conmigo', '4 colores, 4 sonidos: repite la cadena que crece'], g3: ['Cazanúmeros', 'Los números se esconden: tócalos en orden 1, 2, 3…'] },
  fr: { h1: 'Jeux de mémoire 🧠', sub: 'Trois jeux pour muscler ton cerveau. Choisis !', g1: ['Paires', '16 cartes, 8 paires : trouve-les en un minimum d’essais'], g2: ['Répète après moi', '4 couleurs, 4 sons : répète la suite qui s’allonge'], g3: ['Chasseur de nombres', 'Les nombres se cachent : touche-les dans l’ordre 1, 2, 3…'] },
  de: { h1: 'Gedächtnisspiele 🧠', sub: 'Drei Spiele für dein Gehirn. Such dir eins aus!', g1: ['Paare', '16 Karten, 8 Paare: finde alle mit möglichst wenigen Versuchen'], g2: ['Sprich mir nach', '4 Farben, 4 Töne: wiederhole die wachsende Kette'], g3: ['Zahlenjäger', 'Die Zahlen verstecken sich: tippe sie der Reihe nach 1, 2, 3…'] },
  ja: { h1: 'きおくゲーム 🧠', sub: '頭をきたえる3つのゲーム。えらんでね！', g1: ['ペアさがし', 'カード16枚、8ペア。少ない回数で全部見つけよう'], g2: ['まねっこ', '4色4音。長くなる順番をおぼえてまねしよう'], g3: ['数字ハンター', '数字がかくれるよ。1、2、3…の順にタップ！'] },
  zh: { h1: '记忆游戏 🧠', sub: '三个锻炼大脑的游戏，选一个吧！', g1: ['翻对对', '16张牌8对，用最少的次数全找到'], g2: ['跟我学', '4种颜色4种声音，跟着越来越长的顺序'], g3: ['数字猎人', '数字藏起来了，按1、2、3…的顺序点'] },
};
const T = TRL[ggLang];
if (T) {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.sub').textContent = T.sub;
  [['g1', '.g1'], ['g2', '.g2'], ['g3', '.g3']].forEach(([k, sel]) => {
    document.querySelector(sel + ' h2').textContent = T[k][0];
    document.querySelector(sel + ' p').textContent = T[k][1];
  });
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
