<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Հիշողության խաղ 🧠</title>
<link rel="icon" type="image/png" href="../../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    height: 100dvh;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.7rem); color: #ffd76e; }
  .stats { display: flex; gap: 18px; font-size: 1rem; color: #9a9ec7; }
  .stats b { color: #6ee7b7; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(94vw, 62vh, 480px);
  }
  /* Քարտը քառակուսի ենք պահում հին ձևով (padding-ի հնարքով),
     որ ամենահին հեռախոսներում էլ աշխատի */
  .card {
    position: relative;
    perspective: 600px;
    cursor: pointer;
    touch-action: manipulation;   /* արագ սեղմելիս էկրանը չմեծանա */
  }
  .card::before { content: ''; display: block; padding-top: 100%; }
  .inner {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    transform-style: preserve-3d;
    transition: transform 0.4s;
  }
  .card.open .inner, .card.done .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: clamp(28px, 9vw, 54px);
  }
  .back {
    background: linear-gradient(135deg, #3d3560, #2a2447);
    border: 2px solid #6a5f9e;
  }
  .back::after {
    content: '?';
    font-size: clamp(22px, 6vw, 36px);
    font-weight: bold;
    color: #ffd76e;
    opacity: 0.8;
  }
  .front svg { width: 68%; height: 68%; display: block; }
  .front {
    background: linear-gradient(135deg, #fffdf5, #ece5d3);
    border: 2px solid #ffd76e;
    transform: rotateY(180deg);
  }
  .card.done .front { background: linear-gradient(135deg, #d3f9e4, #9ff0c4); border-color: #2ecc71; }
  .card.done { cursor: default; animation: pop 0.4s; }
  @keyframes pop { 50% { transform: scale(1.08); } }

  #restart {
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #3d3560;
    color: #f5eede;
  }
  #msg { font-size: 1.1rem; color: #ffd76e; min-height: 1.4em; text-align: center; }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<h1>Զույգեր 🃏</h1>
<div class="stats">Փորձեր՝ <b id="moves">0</b><span id="bestBox" hidden>Ռեկորդ՝ <b id="best"></b></span></div>
<div class="board" id="board"></div>
<div id="msg"></div>
<button id="restart">🔄 Նոր խաղ</button>

<script>
// ——————————————————————————————————————
//  ՀԻՇՈՂՈՒԹՅԱՆ ԽԱՂ 🧠
//  16 քարտ, 8 զույգ։ Շուռ տուր երկուսը. եթե նույնն են՝ մնում են բաց։
//  Փորձիր գտնել բոլորը ամենաքիչ փորձով։
// ——————————————————————————————————————


// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { h1: 'Զույգեր 🃏', tries: 'Փորձեր՝', rec: 'Ռեկորդ՝', win: n => '🏆 Գտար բոլորը ' + n + ' փորձով', newRec: ' — ՆՈՐ ՌԵԿՈՐԴ 🎉', again: '🔄 Նոր խաղ' },
  ru: { h1: 'Пары 🃏', tries: 'Попытки:', rec: 'Рекорд:', win: n => '🏆 Нашёл все за ' + n + ' попыток', newRec: ' — НОВЫЙ РЕКОРД 🎉', again: '🔄 Новая игра' },
  en: { h1: 'Pairs 🃏', tries: 'Tries:', rec: 'Best:', win: n => '🏆 You found them all in ' + n + ' tries', newRec: ' — NEW RECORD 🎉', again: '🔄 New game' },
  es: { h1: 'Parejas 🃏', tries: 'Intentos:', rec: 'Récord:', win: n => '🏆 ¡Las encontraste todas en ' + n + ' intentos!', newRec: ' — ¡NUEVO RÉCORD! 🎉', again: '🔄 Nueva partida' },
  fr: { h1: 'Paires 🃏', tries: 'Essais :', rec: 'Record :', win: n => '🏆 Tu as tout trouvé en ' + n + ' essais', newRec: ' — NOUVEAU RECORD 🎉', again: '🔄 Nouvelle partie' },
  de: { h1: 'Paare 🃏', tries: 'Versuche:', rec: 'Rekord:', win: n => '🏆 Alle gefunden in ' + n + ' Versuchen', newRec: ' — NEUER REKORD 🎉', again: '🔄 Neues Spiel' },
  ja: { h1: 'ペアさがし 🃏', tries: 'かいすう：', rec: 'ベスト：', win: n => '🏆 ' + n + '回で全部見つけた！', newRec: ' — 新記録 🎉', again: '🔄 もう一回' },
  zh: { h1: '翻对对 🃏', tries: '次数：', rec: '纪录：', win: n => '🏆 用' + n + '次全找到了', newRec: ' — 新纪录 🎉', again: '🔄 再来一局' },
};
const T = TRL[ggLang] || TRL.hy;
if (ggLang !== 'hy') {
  document.querySelector('h1').textContent = T.h1;
  const st = document.querySelector('.stats');
  st.innerHTML = T.tries + ' <b id="moves">0</b><span id="bestBox" hidden>' + T.rec + ' <b id="best"></b></span>';
  document.getElementById('restart').textContent = T.again;
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// Զույգերի նկարները՝ Արենի սայտի հերոսները, բոլորն էլ ձեռքով նկարած
const PICS = [
  // կատու
  '<svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="14" fill="#f5a04f"/><path d="M13 17 L11 6 L21 12 Z" fill="#f5a04f"/><path d="M35 17 L37 6 L27 12 Z" fill="#f5a04f"/><path d="M14 15 L13 9 L19 13 Z" fill="#e07a9a" opacity="0.7"/><circle cx="19" cy="24" r="2.2" fill="#3a2a17"/><circle cx="29" cy="24" r="2.2" fill="#3a2a17"/><path d="M21 30 q3 3 6 0" stroke="#3a2a17" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M10 26 L3 25 M10 29 L4 32 M38 26 L45 25 M38 29 L44 32" stroke="#3a2a17" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/></svg>',
  // մեքենա
  '<svg viewBox="0 0 48 48"><path d="M4 30 Q5 24 12 23 L17 17 Q19 15 23 15 L32 15 Q36 15 38 18 L41 23 Q45 24 45 29 L45 32 Q45 34 42 34 L7 34 Q4 34 4 31 Z" fill="#f7f9fc" stroke="#8b93a8" stroke-width="1.5"/><path d="M19 17 L31 17 Q34 17 36 20 L38 23 L19 23 Z" fill="#9fd3f2"/><rect x="6" y="26" width="38" height="3" rx="1.5" fill="#2b6cd4"/><circle cx="14" cy="34" r="4.5" fill="#232733"/><circle cx="14" cy="34" r="2" fill="#aab3c7"/><circle cx="35" cy="34" r="4.5" fill="#232733"/><circle cx="35" cy="34" r="2" fill="#aab3c7"/></svg>',
  // դաշնամուր
  '<svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="24" rx="3" fill="#fdfdff" stroke="#33356b" stroke-width="2"/><path d="M15 12 V36 M24 12 V36 M33 12 V36" stroke="#33356b" stroke-width="1.5"/><rect x="12" y="12" width="6" height="13" fill="#241a45"/><rect x="21" y="12" width="6" height="13" fill="#241a45"/><rect x="30" y="12" width="6" height="13" fill="#241a45"/></svg>',
  // հրթիռ
  '<svg viewBox="0 0 48 48"><g transform="translate(24,24) rotate(40)"><path d="M-4 12 Q0 22 4 12 Z" fill="#ff9a3b"/><path d="M-6 4 L-12 12 L-6 10 Z" fill="#e63946"/><path d="M6 4 L12 12 L6 10 Z" fill="#e63946"/><path d="M0 -18 Q8 -4 5 10 L-5 10 Q-8 -4 0 -18 Z" fill="#f2f5fa" stroke="#8b93a8" stroke-width="1.5"/><path d="M0 -18 Q4.5 -11 5.5 -6 L-5.5 -6 Q-4.5 -11 0 -18 Z" fill="#e63946"/><circle cx="0" cy="0" r="3.4" fill="#9fd3f2" stroke="#5a7d9e" stroke-width="1.5"/></g></svg>',
  // աստղ
  '<svg viewBox="0 0 48 48"><path d="M24 6 L28.2 17.9 L41 18.2 L30.8 25.9 L34.5 38.2 L24 30.9 L13.5 38.2 L17.2 25.9 L7 18.2 L19.8 17.9 Z" fill="#ffd166" stroke="#d9a92e" stroke-width="2" stroke-linejoin="round"/></svg>',
  // պիցցա
  '<svg viewBox="0 0 48 48"><path d="M9 10 Q24 4 39 10 L37 17 Q24 12 11 17 Z" fill="#c96f2e"/><path d="M11 17 Q24 12 37 17 L24 43 Z" fill="#f6c453"/><circle cx="20" cy="22" r="3" fill="#e63946"/><circle cx="29" cy="23" r="3" fill="#e63946"/><circle cx="24" cy="31" r="3" fill="#e63946"/></svg>',
  // շուն
  '<svg viewBox="0 0 48 48"><circle cx="24" cy="25" r="13" fill="#c99662"/><path d="M12 16 Q6 18 8 28 Q12 26 14 22 Z" fill="#8a5a30"/><path d="M36 16 Q42 18 40 28 Q36 26 34 22 Z" fill="#8a5a30"/><ellipse cx="24" cy="30" rx="7" ry="5.5" fill="#e9d3b3"/><circle cx="24" cy="28" r="2.6" fill="#3a2a17"/><path d="M24 30 V33 M24 33 q-3 3 -5 1 M24 33 q3 3 5 1" stroke="#3a2a17" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="19" cy="22" r="2.2" fill="#3a2a17"/><circle cx="29" cy="22" r="2.2" fill="#3a2a17"/></svg>',
  // գնդակ
  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" fill="#fdfdff" stroke="#33356b" stroke-width="2"/><path d="M24 17 L30 21.5 L27.7 28.5 L20.3 28.5 L18 21.5 Z" fill="#33356b"/><path d="M24 17 L24 9.5 M30 21.5 L37.5 19 M27.7 28.5 L31.5 34.5 M20.3 28.5 L16.5 34.5 M18 21.5 L10.5 19" stroke="#33356b" stroke-width="2"/></svg>',
];

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const msgEl = document.getElementById('msg');
const bestEl = document.getElementById('best');
const bestBox = document.getElementById('bestBox');

let open = [];       // հիմա բաց քարտերը (ամենաշատը 2)
let lock = false;    // երբ երկու քարտ բաց են՝ մի պահ սպասում ենք
let moves = 0;
let found = 0;
let best = 0;
try { best = Number(localStorage.getItem('aren-memory-best') || 0); } catch (e) {}
if (best > 0) { bestEl.textContent = best; bestBox.hidden = false; }

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, delay, vol) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sFlip = () => tone(500, 0.08);
const sMatch = () => { tone(660, 0.12); tone(880, 0.15, 0.1); };          // զույգ գտար
const sNope = () => tone(220, 0.2, 0, 0.1);                               // չէ, նույնը չեն
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, k * 0.13, 0.18));

// ——— Խաղատախտակը ———
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newGame() {
  board.innerHTML = '';
  open = []; lock = false; moves = 0; found = 0;
  movesEl.textContent = 0;
  msgEl.textContent = '';

  const nums = PICS.map((p, i) => i);
  const deck = shuffle([...nums, ...nums]);
  deck.forEach(idx => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.pic = idx;
    card.innerHTML = '<div class="inner"><div class="face back"></div><div class="face front">' + PICS[idx] + '</div></div>';
    card.addEventListener('pointerdown', () => flip(card));
    board.appendChild(card);
  });
}

function flip(card) {
  initAudio();
  if (lock || card.classList.contains('open') || card.classList.contains('done')) return;

  card.classList.add('open');
  sFlip();
  open.push(card);
  if (open.length < 2) return;

  // Երկու քարտ բաց են — հաշվում ենք որպես մեկ փորձ
  moves++;
  movesEl.textContent = moves;
  const [a, b] = open;

  if (a.dataset.pic === b.dataset.pic) {
    // Զու՜յգ 🎉
    open = [];
    setTimeout(() => {
      a.classList.replace('open', 'done');
      b.classList.replace('open', 'done');
      sMatch();
      found++;
      if (found === PICS.length) win();
    }, 350);
  } else {
    // Նույնը չեն — մի վայրկյանից փակվում են
    lock = true;
    setTimeout(() => {
      sNope();
      a.classList.remove('open');
      b.classList.remove('open');
      open = [];
      lock = false;
    }, 900);
  }
}

function win() {
  sWin();
  confetti();
  let text = T.win(moves);
  if (best === 0 || moves < best) {
    best = moves;
    try { localStorage.setItem('aren-memory-best', best); } catch (e) {}
    bestEl.textContent = best;
    bestBox.hidden = false;
    text += T.newRec;
  }
  msgEl.textContent = text;
}

function confetti() {
  const stuff = ['🎉', '⭐', '🧠', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

document.getElementById('restart').addEventListener('click', newGame);
newGame();
</script>
