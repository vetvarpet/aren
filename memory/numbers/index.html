<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Թվերի որսորդ 🔢</title>
<link rel="icon" type="image/png" href="../../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    height: 100dvh;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.6rem); color: #ffd76e; }
  .stats { display: flex; gap: 18px; color: #9a9ec7; font-size: 0.95rem; }
  .stats b { color: #6ee7b7; }
  #status { font-size: 1.05rem; color: #ffd76e; min-height: 1.4em; text-align: center; }

  /* ——— Խաղադաշտը ——— */
  #field {
    position: relative;
    flex: 1;
    width: min(96vw, 560px);
    background: #241d42;
    border: 2px solid #33356b;
    border-radius: 18px;
  }
  .num {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    background: #ffd76e;
    color: #2e2410;
    border: 3px solid #fff3c4;
    touch-action: manipulation;
    transition: transform 0.1s;
  }
  .num:active { transform: scale(0.92); }
  .num.hidden2 { background: #3d3560; color: transparent; border-color: #6a5f9e; }
  .num.good { background: #2ecc71; color: #fff; border-color: #b8f5d0; }
  .num.bad { background: #e74c3c; color: #fff; border-color: #ffb4a8; animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  #startBtn {
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #ffd76e;
    color: #2e2410;
  }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<h1>Թվերի որսորդ 🔢</h1>
<div class="stats">Մակարդակ՝ <b id="level">–</b><span>Ռեկորդ՝ <b id="best">0</b></span></div>
<div id="field"></div>
<div id="status">Հիշիր թվերի տեղերը, հետո սեղմիր հերթով՝ 1, 2, 3…</div>
<button id="startBtn">▶ Սկսել</button>

<script>
// ——————————————————————————————————————
//  ԹՎԵՐԻ ՈՐՍՈՐԴ 🔢
//  Թվերը մի պահ երևում են, հետո թաքնվում։
//  Սեղմիր հերթով՝ 1, 2, 3… եթե հիշում ես, թե որն որտեղ էր։
// ——————————————————————————————————————


// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { h1: 'Թվերի որսորդ 🔢', lvl: 'Մակարդակ՝', rec: 'Ռեկորդ՝', intro: 'Հիշիր թվերի տեղերը, հետո սեղմիր հերթով՝ 1, 2, 3…', nums: n => n + ' թիվ', remember: 'Հիշի՛ր տեղերը 👀', order: 'Սեղմիր հերթով՝ 1, 2, 3… 👆', nice: n => 'Ապրե՛ս 🎉 Հիմա ' + n + ' թիվ', champ: '🏆 ԴՈՒ ՉԵՄՊԻՈՆ ԵՍ — 9 թիվ հիշեցիր', result: n => 'Դու հիշեցիր ' + n + ' թիվ', tryAgain: 'Ոչինչ, նորից փորձիր', newRec: ' — ՆՈՐ ՌԵԿՈՐԴ 🎉', start: '▶ Սկսել', again: '🔄 Նորից' },
  ru: { h1: 'Охотник за числами 🔢', lvl: 'Уровень:', rec: 'Рекорд:', intro: 'Запомни, где числа, потом нажимай по порядку: 1, 2, 3…', nums: n => n + ' чисел', remember: 'Запоминай места 👀', order: 'Нажимай по порядку: 1, 2, 3… 👆', nice: n => 'Молодец! 🎉 Теперь ' + n + ' чисел', champ: '🏆 ТЫ ЧЕМПИОН — запомнил 9 чисел', result: n => 'Ты запомнил ' + n + ' чисел', tryAgain: 'Ничего, попробуй ещё раз', newRec: ' — НОВЫЙ РЕКОРД 🎉', start: '▶ Старт', again: '🔄 Ещё раз' },
  en: { h1: 'Number Hunter 🔢', lvl: 'Level:', rec: 'Best:', intro: 'Remember where the numbers are, then tap them in order: 1, 2, 3…', nums: n => n + ' numbers', remember: 'Memorize the spots 👀', order: 'Tap in order: 1, 2, 3… 👆', nice: n => 'Nice! 🎉 Now ' + n + ' numbers', champ: '🏆 YOU ARE THE CHAMPION — 9 numbers', result: n => 'You remembered ' + n + ' numbers', tryAgain: 'No worries, try again', newRec: ' — NEW RECORD 🎉', start: '▶ Start', again: '🔄 Again' },
  es: { h1: 'Cazanúmeros 🔢', lvl: 'Nivel:', rec: 'Récord:', intro: 'Memoriza dónde están los números y tócalos en orden: 1, 2, 3…', nums: n => n + ' números', remember: 'Memoriza los sitios 👀', order: 'Toca en orden: 1, 2, 3… 👆', nice: n => '¡Muy bien! 🎉 Ahora ' + n + ' números', champ: '🏆 ERES EL CAMPEÓN — 9 números', result: n => 'Recordaste ' + n + ' números', tryAgain: 'No pasa nada, inténtalo otra vez', newRec: ' — ¡NUEVO RÉCORD! 🎉', start: '▶ Empezar', again: '🔄 Otra vez' },
  fr: { h1: 'Chasseur de nombres 🔢', lvl: 'Niveau :', rec: 'Record :', intro: 'Mémorise où sont les nombres, puis touche-les dans l’ordre : 1, 2, 3…', nums: n => n + ' nombres', remember: 'Mémorise les places 👀', order: 'Touche dans l’ordre : 1, 2, 3… 👆', nice: n => 'Bravo ! 🎉 Maintenant ' + n + ' nombres', champ: '🏆 TU ES LE CHAMPION — 9 nombres', result: n => 'Tu as retenu ' + n + ' nombres', tryAgain: 'Pas grave, réessaie', newRec: ' — NOUVEAU RECORD 🎉', start: '▶ Commencer', again: '🔄 Encore' },
  de: { h1: 'Zahlenjäger 🔢', lvl: 'Level:', rec: 'Rekord:', intro: 'Merk dir, wo die Zahlen sind, und tippe sie der Reihe nach: 1, 2, 3…', nums: n => n + ' Zahlen', remember: 'Merk dir die Plätze 👀', order: 'Tippe der Reihe nach: 1, 2, 3… 👆', nice: n => 'Super! 🎉 Jetzt ' + n + ' Zahlen', champ: '🏆 DU BIST DER CHAMPION — 9 Zahlen', result: n => 'Du hast dir ' + n + ' Zahlen gemerkt', tryAgain: 'Kein Problem, versuch es nochmal', newRec: ' — NEUER REKORD 🎉', start: '▶ Start', again: '🔄 Nochmal' },
  ja: { h1: '数字ハンター 🔢', lvl: 'レベル：', rec: 'ベスト：', intro: '数字の場所をおぼえて、1、2、3…の順にタップ！', nums: n => n + '個の数字', remember: '場所をおぼえて 👀', order: '順番にタップ：1、2、3… 👆', nice: n => 'すごい！🎉 次は' + n + '個', champ: '🏆 チャンピオン！ — 9個おぼえた', result: n => n + '個おぼえられたよ', tryAgain: '大丈夫、もう一回！', newRec: ' — 新記録 🎉', start: '▶ スタート', again: '🔄 もう一回' },
  zh: { h1: '数字猎人 🔢', lvl: '关卡：', rec: '纪录：', intro: '记住数字的位置，然后按顺序点：1、2、3…', nums: n => n + '个数字', remember: '记住位置 👀', order: '按顺序点：1、2、3… 👆', nice: n => '真棒！🎉 现在' + n + '个数字', champ: '🏆 你是冠军 — 记住了9个数字', result: n => '你记住了' + n + '个数字', tryAgain: '没关系，再试一次', newRec: ' — 新纪录 🎉', start: '▶ 开始', again: '🔄 再来' },
};
const T = TRL[ggLang] || TRL.hy;
if (ggLang !== 'hy') {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.stats').innerHTML = T.lvl + ' <b id="level">–</b><span>' + T.rec + ' <b id="best">0</b></span>';
  document.getElementById('status').textContent = T.intro;
  document.getElementById('startBtn').textContent = T.start;
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

const field = document.getElementById('field');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let count = 3;         // քանի թիվ է այս մակարդակում (սկսում ենք 3-ից)
let expect = 1;        // որ թիվն է հիմա պետք սեղմել
let waiting = false;   // թվերը դեռ երևում են, սեղմել դեռ պետք չէ
let playing = false;
let hideTimer = null;
let best = 0;
try { best = Number(localStorage.getItem('aren-numbers-best') || 0); } catch (e) {}
bestEl.textContent = best;

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sTap = (n) => tone(400 + n * 80, 0.12);
const sLevel = () => { tone(660, 0.15); tone(880, 0.2, 'triangle', 0.2, 0.12); };
const sBuzz = () => tone(120, 0.6, 'sawtooth', 0.25);
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));

// ——— Թվերը դաշտի վրա շաղ տալը (որ իրար չկպչեն) ———
function placeNumbers() {
  field.innerHTML = '';
  const W = field.clientWidth, H = field.clientHeight;
  const R = 64;
  const spots = [];
  for (let n = 1; n <= count; n++) {
    let x, y, tries = 0;
    do {
      x = 8 + Math.random() * (W - R - 16);
      y = 8 + Math.random() * (H - R - 16);
      tries++;
    } while (tries < 200 && spots.some(s => Math.hypot(s.x - x, s.y - y) < R + 14));
    spots.push({ x, y });

    const el = document.createElement('div');
    el.className = 'num';
    el.textContent = n;
    el.dataset.n = n;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.addEventListener('pointerdown', () => tap(el));
    field.appendChild(el);
  }
}

// ——— Խաղի ընթացքը ———
function startGame() {
  initAudio();
  count = 3;
  playing = true;
  startBtn.hidden = true;
  newLevel();
}

function newLevel() {
  levelEl.textContent = T.nums(count);
  expect = 1;
  waiting = true;
  placeNumbers();
  statusEl.textContent = T.remember;

  // ինչքան շատ թիվ, այնքան մի քիչ ավելի ժամանակ ենք տալիս հիշելու
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    document.querySelectorAll('.num').forEach(el => el.classList.add('hidden2'));
    waiting = false;
    statusEl.textContent = T.order;
  }, 1500 + count * 500);
}

function tap(el) {
  if (!playing || waiting) return;
  const n = Number(el.dataset.n);
  if (el.classList.contains('good')) return;   // արդեն գտածին նորից չսեղմես

  if (n === expect) {
    // Ճի՛շտ է — թիվը բացվում է ու կանաչում
    el.classList.remove('hidden2');
    el.classList.add('good');
    sTap(n);
    expect++;
    if (expect > count) {
      // ամբողջ մակարդակն անցա՜ր
      sLevel();
      count++;
      if (count > 9) {
        // 9 թիվ հիշեցիր — դու չեմպիոն ես 🏆
        finish(true);
        return;
      }
      statusEl.textContent = T.nice(count);
      setTimeout(newLevel, 1000);
    }
  } else {
    // Սխա՜լ — բոլորը բացվում են, խաղն ավարտվեց
    el.classList.add('bad');
    finish(false);
  }
}

function finish(champion) {
  playing = false;
  clearTimeout(hideTimer);
  document.querySelectorAll('.num').forEach(el => el.classList.remove('hidden2'));
  const score = champion ? 9 : count - 1;   // վերջին ԱՆՑԱԾ մակարդակը

  let text = champion
    ? T.champ
    : (score >= 3 ? T.result(score) : T.tryAgain);

  if (champion) { sWin(); confetti(); }
  else sBuzz();

  if (score > best) {
    best = score;
    try { localStorage.setItem('aren-numbers-best', best); } catch (e) {}
    bestEl.textContent = best;
    if (!champion) { text += T.newRec; sWin(); confetti(); }
  }
  statusEl.textContent = text;
  startBtn.textContent = T.again;
  startBtn.hidden = false;
}

startBtn.addEventListener('click', startGame);

function confetti() {
  const stuff = ['🎉', '⭐', '🔢', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
</script>
