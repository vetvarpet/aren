<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Կրկնիր ինձ 💡</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100dvh;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.7rem); color: #ffd76e; }
  .stats { display: flex; gap: 18px; color: #9a9ec7; font-size: 1rem; }
  .stats b { color: #6ee7b7; }
  #status { font-size: 1.15rem; color: #ffd76e; min-height: 1.5em; text-align: center; }

  /* ——— 4 գույնավոր կոճակները ——— */
  .pad {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: min(88vw, 54vh, 420px);
  }
  .pane {
    position: relative;
    border-radius: 22px;
    cursor: pointer;
    border: 4px solid rgba(0,0,0,0.25);
    opacity: 0.55;
    transition: opacity 0.12s, transform 0.08s;
    touch-action: manipulation;
  }
  .pane::before { content: ''; display: block; padding-top: 100%; }
  .pane.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 34px 6px rgba(255,255,255,0.35); }
  .pane:active { transform: scale(0.96); }
  #p0 { background: #e74c3c; border-radius: 60px 22px 22px 22px; }
  #p1 { background: #2ecc71; border-radius: 22px 60px 22px 22px; }
  #p2 { background: #f4d13b; border-radius: 22px 22px 22px 60px; }
  #p3 { background: #1e90ff; border-radius: 22px 22px 60px 22px; }

  #startBtn {
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #ffd76e;
    color: #2e2410;
  }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<h1>Կրկնիր ինձ 💡</h1>
<div class="stats">Շղթա՝ <b id="round">0</b><span>Ռեկորդ՝ <b id="best">0</b></span></div>

<div class="pad">
  <div class="pane" id="p0"></div>
  <div class="pane" id="p1"></div>
  <div class="pane" id="p2"></div>
  <div class="pane" id="p3"></div>
</div>

<div id="status">Սեղմիր «Սկսել»-ը 👇</div>
<button id="startBtn">▶ Սկսել</button>

<script>
// ——————————————————————————————————————
//  ԿՐԿՆԻՐ ԻՆՁ 💡
//  Խաղը վառում է կոճակները հերթով, դու կրկնում ես։
//  Ամեն շրջան շղթան մեկով երկարում է։ Ինչքա՞ն կհիշես։
// ——————————————————————————————————————


// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { h1: 'Կրկնիր ինձ 💡', chain: 'Շղթա՝', rec: 'Ռեկորդ՝', pressStart: 'Սեղմիր «Սկսել»-ը 👇', watch: 'Նայի՛ր ուշադիր 👀', yourTurn: 'Քո հերթն է 👆', nice: 'Ապրե՛ս 🎉', result: n => 'Դու հիշեցիր ' + n + ' քայլանոց շղթա', newRec: ' — ՆՈՐ ՌԵԿՈՐԴ 🏆', start: '▶ Սկսել', again: '🔄 Նորից' },
  ru: { h1: 'Повтори за мной 💡', chain: 'Цепочка:', rec: 'Рекорд:', pressStart: 'Нажми «Старт» 👇', watch: 'Смотри внимательно 👀', yourTurn: 'Твоя очередь 👆', nice: 'Молодец! 🎉', result: n => 'Ты запомнил цепочку из ' + n + ' шагов', newRec: ' — НОВЫЙ РЕКОРД 🏆', start: '▶ Старт', again: '🔄 Ещё раз' },
  en: { h1: 'Repeat After Me 💡', chain: 'Chain:', rec: 'Best:', pressStart: 'Press “Start” 👇', watch: 'Watch closely 👀', yourTurn: 'Your turn 👆', nice: 'Nice! 🎉', result: n => 'You remembered a chain of ' + n + ' steps', newRec: ' — NEW RECORD 🏆', start: '▶ Start', again: '🔄 Again' },
};
const T = TRL[ggLang] || TRL.hy;
if (ggLang !== 'hy') {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.stats').innerHTML = T.chain + ' <b id="round">0</b><span>' + T.rec + ' <b id="best">0</b></span>';
  document.getElementById('status').textContent = T.pressStart;
  document.getElementById('startBtn').textContent = T.start;
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

const panes = [0, 1, 2, 3].map(i => document.getElementById('p' + i));
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

// Ամեն գույն իր նոտան ունի՝ Դո, Մի, Սոլ, Դո²
const TONES = [262, 330, 392, 523];

let seq = [];          // խաղի հորինած շղթան
let step = 0;          // որ քայլին է հասել խաղացողը
let showing = false;   // երբ խաղն է ցույց տալիս, սեղմել չի կարելի
let playing = false;
let best = 0;
try { best = Number(localStorage.getItem('aren-repeat-best') || 0); } catch (e) {}
bestEl.textContent = best;

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sBuzz = () => tone(120, 0.6, 'sawtooth', 0.25);   // սխալվեցիր
const sWin = () => [523, 659, 784, 1047].forEach((f, k) => setTimeout(() => tone(f, 0.22, 'triangle', 0.22), k * 120));

// Կոճակը վառվում է ու երգում իր նոտան
function light(i, dur) {
  panes[i].classList.add('lit');
  tone(TONES[i], (dur || 350) / 1000 + 0.15);
  setTimeout(() => panes[i].classList.remove('lit'), dur || 350);
}

// ——— Խաղի ընթացքը ———
function startGame() {
  initAudio();
  seq = [];
  playing = true;
  startBtn.hidden = true;
  roundEl.textContent = 0;
  nextRound();
}

function nextRound() {
  seq.push(Math.floor(Math.random() * 4));   // շղթան երկարում է մեկով
  roundEl.textContent = seq.length - 1;      // քանի շրջան ես ԱՐԴԵՆ անցել
  step = 0;
  showing = true;
  statusEl.textContent = T.watch;

  // ինչքան երկար է շղթան, այնքան արագ է ցույց տալիս — ավելի բարդ է
  const speed = Math.max(280, 550 - seq.length * 22);
  seq.forEach((p, k) => {
    setTimeout(() => light(p, speed * 0.7), 600 + k * speed);
  });
  setTimeout(() => {
    showing = false;
    statusEl.textContent = T.yourTurn;
  }, 600 + seq.length * speed);
}

function press(i) {
  if (!playing || showing) return;
  initAudio();
  light(i, 250);

  if (i === seq[step]) {
    step++;
    if (step === seq.length) {
      // ամբողջ շղթան ճիշտ կրկնեցիր
      showing = true;   // որ արագ սեղմողը «Ապրե՛ս»-ի պահին սխալմամբ չտուժի
      statusEl.textContent = T.nice;
      setTimeout(nextRound, 900);
    }
  } else {
    // սխա՜լ — խաղն ավարտվեց
    playing = false;
    sBuzz();
    const score = seq.length - 1;
    let text = T.result(score);
    if (score > best) {
      best = score;
      try { localStorage.setItem('aren-repeat-best', best); } catch (e) {}
      bestEl.textContent = best;
      text += T.newRec;
      sWin();
      confetti();
    }
    statusEl.textContent = text;
    startBtn.textContent = T.again;
    startBtn.hidden = false;
  }
}

panes.forEach((p, i) => p.addEventListener('pointerdown', () => press(i)));
startBtn.addEventListener('click', startGame);

function confetti() {
  const stuff = ['🎉', '⭐', '💡', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
</script>
