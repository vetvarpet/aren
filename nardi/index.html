<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ոսկե Նարդի 🎲</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100dvh;
    padding: 10px;
    text-align: center;
  }
  h1 { font-size: clamp(1rem, 4.4vw, 1.45rem); color: #ffd76e; }
  #scores { display: flex; gap: 14px; font-size: 0.92rem; }
  #winsEl { color: #6ee7b7; }

  /* Խաղատախտակը՝ նկարվում է canvas-ի վրա */
  canvas { display: block; border-radius: 14px; touch-action: none; }

  #status { font-size: 0.9rem; color: #ffd76e; min-height: 2.4em; line-height: 1.2; padding: 0 4px; }

  #dicebar { display: flex; align-items: center; gap: 10px; }
  #dice { display: flex; gap: 6px; min-height: 34px; align-items: center; }
  .die {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: #f5eede;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4px; gap: 1px;
    box-shadow: 0 2px 0 #b1a68f;
  }
  .die i { border-radius: 50%; background: #1a2a4a; }
  .die i.no { background: transparent; }
  .die.used { opacity: 0.22; }
  #roll {
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 0.92rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #3d3560;
    color: #f5eede;
  }
  #roll:disabled { opacity: 0.3; }
  #roll:active { transform: scale(0.96); }

  /* Ծածկոցները. hidden-ը պարտադիր է ուժեղացնել, թե չէ flex-ը հաղթում է */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 20px; text-align: center;
    background: rgba(20, 15, 40, 0.9);
  }
  .overlay[hidden] { display: none !important; }
  .sub { color: #9a9ec7; font-size: 0.95rem; max-width: 300px; }
  .bigbtn {
    border: 2px solid #6a5f9e;
    border-radius: 16px;
    padding: 13px 26px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #3d3560;
    color: #f5eede;
  }
  .bigbtn:active { transform: scale(0.97); }
  #overTitle { font-size: 1.5rem; color: #ffd76e; }

  .confetti { position: fixed; top: -50px; z-index: 30; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:40;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sMove = () => tone(300, 0.09, 'square', 0.13);
const sPick = () => tone(520, 0.07, 'triangle', 0.1);
const sHit = () => { tone(180, 0.22, 'sawtooth', 0.16); tone(120, 0.28, 'square', 0.12, 0.05); };
const sOff = () => [660, 880].forEach((f, k) => tone(f, 0.16, 'triangle', 0.16, k * 0.09));
const sRoll = () => [700, 520, 620].forEach((f, k) => tone(f, 0.05, 'square', 0.09, k * 0.06));
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));
const sLose = () => [400, 330, 260].forEach((f, k) => tone(f, 0.25, 'sine', 0.16, k * 0.14));

// ——— Տախտակի չափերը. ամեն անգամ հարմարվում է հեռախոսի էկրանին ———
let BW = 0, BH = 0, TRAY = 0, BARW = 0, TW = 0, TRIH = 0, CR = 0;
function layout() {
  const maxW = Math.min(window.innerWidth - 14, 420);
  // Կողքի պառկեցրած հեռախոսի վրա քիչ տեղ կա — պահում ենք ավելի քիչ
  const reserve = window.innerHeight < 520 ? 148 : 178;
  const availH = window.innerHeight - reserve;   // տեղ՝ վերնագրին, զառերին, գրությանը
  let w = Math.min(maxW, availH / 0.9);
  w = Math.max(170, w);
  const h = w * 0.9;
  const DPR = window.devicePixelRatio || 1;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  BW = w; BH = h;
  TRAY = w * 0.088;
  BARW = w * 0.062;
  TW = (w - TRAY - BARW) / 12;
  TRIH = h * 0.42;
  CR = Math.min(TW * 0.46, h * 0.075);
}
window.addEventListener('resize', layout);
layout();

// Սյան ձախ եզրը՝ ըստ 0–11 համարի (6-ից հետո մեջտեղի ձողն է)
function colX(col) { return col * TW + (col >= 6 ? BARW : 0); }
// Կետի համարից՝ սյուն. ներքևի շարքը 0–11 է աջից ձախ, վերևինը՝ 12–23 ձախից աջ
function colOf(i) { return i < 12 ? 11 - i : i - 12; }
function isTop(i) { return i >= 12; }

// Քարի կենտրոնը՝ i կետի k-րդ քարը (n հատից)
function stackXY(i, k, n) {
  const x = colX(colOf(i)) + TW / 2;
  const step = Math.min(2 * CR + 1.5, (BH / 2 - 2 * CR - 4) / Math.max(1, n - 1));
  const y = isTop(i) ? (CR + 3 + k * step) : (BH - CR - 3 - k * step);
  return { x: x, y: y };
}

// Կետի «միջին» կետը՝ դիպչելու համար
function pointCenter(i) {
  if (i === OFF) return { x: 12 * TW + BARW + TRAY / 2, y: BH * 0.76 };
  if (i === BAR_P) return { x: 6 * TW + BARW / 2, y: BH * 0.72 };
  if (i === BAR_C) return { x: 6 * TW + BARW / 2, y: BH * 0.28 };
  return { x: colX(colOf(i)) + TW / 2, y: isTop(i) ? BH * 0.24 : BH * 0.76 };
}

// Որ կետին դիպավ մատը
function hitPoint(x, y) {
  if (x >= 12 * TW + BARW) return y > BH / 2 ? OFF : -2;   // աջ ափսեները
  if (x >= 6 * TW && x < 6 * TW + BARW) return y > BH / 2 ? BAR_P : BAR_C;
  let col = x < 6 * TW ? Math.floor(x / TW) : 6 + Math.floor((x - 6 * TW - BARW) / TW);
  col = Math.max(0, Math.min(11, col));
  return y > BH / 2 ? (11 - col) : (12 + col);
}

// ——— Կանոնները ———
// Կարո՞ղ ենք նստել այս կետին. 2 և ավելի թշնամու քար՝ ոչ
function canLand(side, to) {
  if (to < 0 || to > 23) return false;
  const v = pts[to];
  return side === 1 ? v >= -1 : v <= 1;
}
// Բոլո՞ր քարերը տանն են (դու՝ 0–5, ռոբոտը՝ 18–23)
function allHome(side) {
  if (side === 1) {
    if (barP > 0) return false;
    for (let i = 6; i < 24; i++) if (pts[i] > 0) return false;
    return true;
  }
  if (barC > 0) return false;
  for (let i = 0; i < 18; i++) if (pts[i] < 0) return false;
  return true;
}
// Բոլոր օրինական քայլերը՝ {from, to, d}
function genMoves(side, ds) {
  const out = [];
  const uniq = [];
  for (const d of ds) if (uniq.indexOf(d) < 0) uniq.push(d);
  const bar = side === 1 ? barP : barC;
  if (bar > 0) {
    for (const d of uniq) {
      const to = side === 1 ? 24 - d : d - 1;
      if (canLand(side, to)) out.push({ from: side === 1 ? BAR_P : BAR_C, to: to, d: d });
    }
    return out;
  }
  const home = allHome(side);
  for (let i = 0; i < 24; i++) {
    if (side === 1 ? pts[i] <= 0 : pts[i] >= 0) continue;
    for (const d of uniq) {
      const to = i - side * d;
      if (to >= 0 && to <= 23) {
        if (canLand(side, to)) out.push({ from: i, to: to, d: d });
      } else if (home) {
        // Դուրս բերելը՝ եթե զառը բավականաչափ մեծ է (երեխայի համար՝ մեղմ կանոն)
        const need = side === 1 ? i + 1 : 24 - i;
        if (d >= need) out.push({ from: i, to: OFF, d: d });
      }
    }
  }
  return out;
}
// Քայլն անում ենք. վերադարձնում ենք՝ խփե՞ց թե ոչ
function applyMove(side, m) {
  let hit = false;
  if (m.from === BAR_P) barP--;
  else if (m.from === BAR_C) barC--;
  else pts[m.from] -= side;

  if (m.to === OFF) {
    if (side === 1) offP++; else offC++;
  } else {
    if (side === 1 && pts[m.to] === -1) { pts[m.to] = 0; barC++; hit = true; }
    if (side === -1 && pts[m.to] === 1) { pts[m.to] = 0; barP++; hit = true; }
    pts[m.to] += side;
  }
  const k = dice.indexOf(m.d);
  if (k >= 0) dice.splice(k, 1);
  for (let j = 0; j < rolled.length; j++) {
    if (!usedFlags[j] && rolled[j] === m.d) { usedFlags[j] = true; break; }
  }
  return hit;
}

// ——— Նոր խաղ ———
function newGame() {
  pts = new Array(24).fill(0);
  pts[23] = CH;     // քո 6 քարերը՝ վերևի աջ անկյունում
  pts[0] = -CH;     // ռոբոտի 6 քարերը՝ ներքևի աջ անկյունում
  barP = 0; barC = 0; offP = 0; offC = 0;
  dice = []; rolled = []; usedFlags = []; sel = null;
  turn = 1; busy = false;
  state = 'play';
  menuEl.hidden = true;
  overEl.hidden = true;
  setStatus(T.yourTurn + ' — ' + T.roll);
  refresh();
}

function refresh() {
  document.getElementById('offPEl').textContent = offP;
  document.getElementById('offCEl').textContent = offC;
  document.getElementById('winsEl').textContent = '🏆 ' + wins;
  drawDice();
  rollBtn.disabled = !(state === 'play' && turn === 1 && dice.length === 0 && !busy);
}
function setStatus(s) { statusEl.textContent = s; }

// ——— Զառերի նկարները (կետերով) ———
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function drawDice() {
  diceEl.innerHTML = '';
  for (let j = 0; j < rolled.length; j++) {
    const d = document.createElement('div');
    d.className = 'die' + (usedFlags[j] ? ' used' : '');
    const on = PIPS[rolled[j]] || [];
    for (let k = 0; k < 9; k++) {
      const p = document.createElement('i');
      if (on.indexOf(k) < 0) p.className = 'no';
      d.appendChild(p);
    }
    diceEl.appendChild(d);
  }
}

// ——— Զառ գլորելը ———
function rnd(n) { return Math.floor(Math.random() * n); }
function rollFor(side) {
  const a = 1 + rnd(6), b = 1 + rnd(6);
  rolled = (a === b) ? [a, a, a, a] : [a, b];   // զույգ զառը՝ չորս քայլ, ինչպես իսկական նարդում
  usedFlags = rolled.map(function () { return false; });
  dice = rolled.slice();
  sRoll();
  refresh();
}

rollBtn.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  initAudio();
  if (state !== 'play' || turn !== 1 || dice.length > 0 || busy) return;
  rollFor(1);
  const legal = genMoves(1, dice);
  if (!legal.length) {
    setStatus(T.noMove);
    busy = true;
    setTimeout(function () { busy = false; endTurn(); }, 1300);
  } else {
    setStatus(T.yourTurn + ' — ' + T.pick);
  }
  refresh();
});

// ——— Դիպչելը տախտակին ———
let lastTouchAt = 0;
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  // Հեռախոսը հպումից հետո «ուրվական» մկնիկի ազդանշան է ուղարկում — անտեսում ենք
  if (e.pointerType === 'mouse' && Date.now() - lastTouchAt < 700) return;
  if (e.pointerType === 'touch') lastTouchAt = Date.now();
  initAudio();
  const r = canvas.getBoundingClientRect();
  tapPoint(hitPoint(e.clientX - r.left, e.clientY - r.top));
}, { passive: false });
canvas.addEventListener('touchstart', function () { lastTouchAt = Date.now(); }, { passive: true });

function tapPoint(i) {
  if (state !== 'play' || turn !== 1 || busy) return;
  if (dice.length === 0) { setStatus(T.yourTurn + ' — ' + T.roll); return; }
  const legal = genMoves(1, dice);

  // Ընտրած քարով փորձում ենք գնալ այս տեղը
  if (sel !== null) {
    let m = null;
    for (const x of legal) if (x.from === sel && x.to === i) { m = x; break; }
    if (m) { humanMove(m); return; }
  }
  // Նոր քար ենք ընտրում
  const mine = (i === BAR_P) ? barP > 0 : (i >= 0 && i <= 23 && pts[i] > 0);
  if (mine) {
    let has = false;
    for (const x of legal) if (x.from === i) { has = true; break; }
    if (has) {
      sel = (sel === i) ? null : i;
      if (sel !== null) sPick();
      setStatus(T.yourTurn + ' — ' + T.pick);
      return;
    }
    if (barP > 0) { setStatus(T.barYou); return; }
  }
  sel = null;
}

function humanMove(m) {
  const hit = applyMove(1, m);
  sel = null;
  if (m.to === OFF) sOff(); else sMove();
  if (hit) { sHit(); setStatus(T.hitYou); } else setStatus(T.yourTurn + ' — ' + T.pick);
  refresh();
  if (checkOver()) return;
  if (dice.length === 0 || genMoves(1, dice).length === 0) {
    busy = true;
    setTimeout(function () { busy = false; endTurn(); }, 450);
    refresh();
  }
}

function endTurn() {
  if (state !== 'play') return;
  turn = -turn;
  sel = null;
  dice = []; rolled = []; usedFlags = [];
  if (turn === -1) {
    setStatus(T.aiTurn);
    busy = true;
    refresh();
    setTimeout(aiRoll, 700);
  } else {
    setStatus(T.yourTurn + ' — ' + T.roll);
    refresh();
  }
}

// ——— Ռոբոտը ———
function aiRoll() {
  if (state !== 'play') return;
  rollFor(-1);
  setTimeout(aiStep, 750);
}
function aiStep() {
  if (state !== 'play') return;
  const legal = genMoves(-1, dice);
  if (!legal.length || dice.length === 0) {
    busy = false;
    endTurn();
    return;
  }
  const m = pickAi(legal);
  const hit = applyMove(-1, m);
  if (m.to === OFF) sOff(); else sMove();
  if (hit) { sHit(); setStatus(T.hitAi); }
  refresh();
  if (checkOver()) { busy = false; return; }
  setTimeout(aiStep, 750);
}
// Ռոբոտը խորամանկ չէ, բայց հիմար էլ չէ. ընտրում է ամենաշահավետ քայլը
function pickAi(legal) {
  let best = null, bs = -1e9;
  for (const m of legal) {
    let s = m.d;                                       // առաջ գնալը միշտ լավ է
    if (m.to === OFF) s += 60;                         // դուրս բերելը՝ ամենալավը
    else {
      if (pts[m.to] === 1) s += 55;                    // մենակ դեղին քարին խփելը
      if (pts[m.to] <= -1) s += 14;                    // իր քարի կողքին՝ ապահով է
      if (m.from >= 0 && pts[m.from] === -2) s -= 10;  // մենակ քար չթողնի
      if (m.to >= 18) s += 8;                          // տուն մտնելը լավ է
    }
    s += Math.random() * 3;                            // մի քիչ պատահականություն
    if (s > bs) { bs = s; best = m; }
  }
  return best;
}

// ——— Վերջը ———
function checkOver() {
  if (offP < CH && offC < CH) return false;
  state = 'over';
  endedAt = Date.now();
  busy = false;
  const won = offP >= CH;
  if (won) {
    wins++;
    try { localStorage.setItem('aren-nardi-best', wins); } catch (e) {}
    sWin(); confetti();
  } else sLose();
  document.getElementById('overTitle').textContent = won ? T.win : T.lose;
  overEl.hidden = false;
  refresh();
  return true;
}

// Վերջի էկրանին դիպչելը՝ նոր խաղ (բայց ~1100 մլվ սպասում է, որ պատահական չսեղմվի)
overEl.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (state !== 'over') return;
  if (Date.now() - endedAt < 1100) return;
  initAudio();
  newGame();
}, { passive: false });

document.getElementById('startBtn').addEventListener('pointerdown', function (e) {
  e.preventDefault();
  initAudio();
  newGame();
}, { passive: false });

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', function (e) {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// ——— Նկարելը ———
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function checker(x, y, r, side, glow) {
  if (glow) {
    ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  }
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.15, x, y, r);
  if (side === 1) { g.addColorStop(0, '#ffe9a8'); g.addColorStop(1, '#e8b40c'); }
  else { g.addColorStop(0, '#ff9d8e'); g.addColorStop(1, '#d4283a'); }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = side === 1 ? 'rgba(120,80,0,0.5)' : 'rgba(70,10,20,0.5)';
  ctx.stroke();
}

function draw() {
  requestAnimationFrame(draw);
  if (!BW) return;
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 260);

  // տախտակի ֆոնը
  ctx.clearRect(0, 0, BW, BH);
  ctx.fillStyle = '#1d1637';
  rrect(0, 0, BW, BH, 14); ctx.fill();

  // 24 եռանկյունիները՝ հերթով մուգ ու բաց
  for (let i = 0; i < 24; i++) {
    const col = colOf(i);
    const x = colX(col);
    const top = isTop(i);
    ctx.beginPath();
    if (top) { ctx.moveTo(x + 1, 0); ctx.lineTo(x + TW - 1, 0); ctx.lineTo(x + TW / 2, TRIH); }
    else { ctx.moveTo(x + 1, BH); ctx.lineTo(x + TW - 1, BH); ctx.lineTo(x + TW / 2, BH - TRIH); }
    ctx.closePath();
    ctx.fillStyle = ((col + (top ? 0 : 1)) % 2 === 0) ? '#544a8c' : '#2b2250';
    ctx.fill();
  }

  // տների գծերը՝ դեղինը ներքևի աջ, կարմիրը վերևի աջ
  const hx = colX(6), hw = 6 * TW;
  ctx.fillStyle = '#ffd76e'; ctx.fillRect(hx, BH - 3, hw, 3);
  ctx.fillStyle = '#ff7b6b'; ctx.fillRect(hx, 0, hw, 3);

  // մեջտեղի ձողը (բանտը)
  ctx.fillStyle = '#120e26';
  ctx.fillRect(6 * TW, 0, BARW, BH);
  // աջ ափսեները՝ դուրս բերած քարերի համար
  const tx = 12 * TW + BARW;
  ctx.fillStyle = '#120e26';
  rrect(tx + 2, 3, TRAY - 5, BH / 2 - 6, 6); ctx.fill();
  rrect(tx + 2, BH / 2 + 3, TRAY - 5, BH / 2 - 6, 6); ctx.fill();

  // դուրս բերած քարերը՝ բարակ գծիկներ
  for (let k = 0; k < offP; k++) {
    ctx.fillStyle = '#e8b40c';
    rrect(tx + 5, BH - 12 - k * 9, TRAY - 11, 6, 3); ctx.fill();
  }
  for (let k = 0; k < offC; k++) {
    ctx.fillStyle = '#d4283a';
    rrect(tx + 5, 6 + k * 9, TRAY - 11, 6, 3); ctx.fill();
  }

  // քարերը
  for (let i = 0; i < 24; i++) {
    const n = Math.abs(pts[i]);
    const side = pts[i] > 0 ? 1 : -1;
    for (let k = 0; k < n; k++) {
      const p = stackXY(i, k, n);
      checker(p.x, p.y, CR, side, sel === i && k === n - 1);
    }
  }
  // բանտի քարերը
  for (let k = 0; k < barP; k++) checker(6 * TW + BARW / 2, BH * 0.72 - k * (CR + 2), CR * 0.9, 1, sel === BAR_P && k === barP - 1);
  for (let k = 0; k < barC; k++) checker(6 * TW + BARW / 2, BH * 0.28 + k * (CR + 2), CR * 0.9, -1, false);

  // լուսավոր տեղերը՝ ուր կարող ես գնալ
  if (state === 'play' && turn === 1 && sel !== null && dice.length) {
    const legal = genMoves(1, dice);
    for (const m of legal) {
      if (m.from !== sel) continue;
      let x, y;
      if (m.to === OFF) { x = tx + TRAY / 2; y = BH - 26; }
      else {
        const n = Math.abs(pts[m.to]);
        const p = stackXY(m.to, pts[m.to] > 0 ? n : 0, Math.max(n + 1, 2));
        x = p.x; y = p.y;
      }
      ctx.beginPath(); ctx.arc(x, y, CR * 0.92, 0, 7);
      ctx.fillStyle = 'rgba(110,231,183,' + (0.25 + 0.22 * pulse) + ')'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#6ee7b7'; ctx.stroke();
      ctx.fillStyle = '#0d2b22';
      ctx.font = 'bold ' + Math.round(CR * 1.05) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(m.d), x, y + 1);
    }
  }
  // եթե դեռ քար չես ընտրել՝ նշում ենք, թե որոնք են շարժվող
  if (state === 'play' && turn === 1 && sel === null && dice.length) {
    const legal = genMoves(1, dice);
    const seen = [];
    for (const m of legal) {
      if (seen.indexOf(m.from) >= 0) continue;
      seen.push(m.from);
      let p;
      if (m.from === BAR_P) p = { x: 6 * TW + BARW / 2, y: BH * 0.72 };
      else { const n = Math.abs(pts[m.from]); p = stackXY(m.from, n - 1, n); }
      ctx.beginPath(); ctx.arc(p.x, p.y, CR + 2.5, 0, 7);
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,215,110,' + (0.35 + 0.4 * pulse) + ')'; ctx.stroke();
    }
  }
}
draw();

function confetti() {
  const stuff = ['🎉', '⭐', '🎲', '🟡', '🎊', '✨'];
  for (let k = 0; k < 34; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[rnd(stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', function () { s.remove(); });
  }
}

document.getElementById('menuWins').textContent = wins > 0 ? T.wins + wins : '';
refresh();

// Փոքրիկ օգնական՝ ստուգումների համար (Playwright-ը սրանով է նայում խաղին)
window.NARDI = {
  get state() { return state; },
  get turn() { return turn; },
  get dice() { return dice.slice(); },
  get pts() { return pts.slice(); },
  get offP() { return offP; },
  get offC() { return offC; },
  get barP() { return barP; },
  get barC() { return barC; },
  get sel() { return sel; },
  get wins() { return wins; },
  get busy() { return busy; },
  moves: function () { return genMoves(1, dice); },
  center: function (i) { return pointCenter(i); },
  force: function (o) {
    if (o.pts) pts = o.pts.slice();
    if ('offP' in o) offP = o.offP;
    if ('offC' in o) offC = o.offC;
    if ('barP' in o) barP = o.barP;
    if ('barC' in o) barC = o.barC;
    if ('turn' in o) turn = o.turn;
    if (o.dice) { dice = o.dice.slice(); rolled = o.dice.slice(); usedFlags = rolled.map(function () { return false; }); }
    sel = null; busy = false;
    refresh();
  },
};
</script>
