<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Asteroid 🪨</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b1030; }
  canvas { display: block; touch-action: none; }
</style>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;font-family:Arial,sans-serif;">← Golden Games</a>

<canvas id="cv"></canvas>

<script>
// ——————————————————————————————————————
//  GOLDEN ASTEROID 🪨 — ջարդիր տիեզերաքարերը
//  Նավը ինքն է թռչում ու կրակում։
//  Պահիր էկրանի ձախ կամ աջ կեսը՝ թեքվելու համար։
// ——————————————————————————————————————

let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
// Կանվասի վրա էմոջի չենք գրում — նկարում ենք ձեռքով
const TRL = {
  hy: { how1: 'Պահիր ձախ կամ աջ կողմը՝ թեքվելու', how2: 'Նավը ինքն է թռչում ու կրակում', tap: 'Հպիր՝ սկսելու', best: 'Ռեկորդ՝ ', wave: 'ԱԼԻՔ ', over: 'Նավը ջարդվե՜ց…', rec: 'ՆՈՐ ՌԵԿՈՐԴ', again: 'Հպիր՝ նորից թռչելու' },
  ru: { how1: 'Держи левую или правую сторону, чтобы поворачивать', how2: 'Корабль сам летит и стреляет', tap: 'Коснись, чтобы начать', best: 'Рекорд: ', wave: 'ВОЛНА ', over: 'Корабль разбился…', rec: 'НОВЫЙ РЕКОРД', again: 'Коснись, чтобы лететь снова' },
  en: { how1: 'Hold the left or right side to turn', how2: 'The ship flies and shoots by itself', tap: 'Tap to start', best: 'Best: ', wave: 'WAVE ', over: 'The ship crashed…', rec: 'NEW RECORD', again: 'Tap to fly again' },
  es: { how1: 'Mantén el lado izquierdo o derecho para girar', how2: 'La nave vuela y dispara sola', tap: 'Toca para empezar', best: 'Récord: ', wave: 'OLA ', over: 'La nave se rompió…', rec: 'NUEVO RÉCORD', again: 'Toca para volar otra vez' },
  fr: { how1: 'Garde le côté gauche ou droit pour tourner', how2: 'Le vaisseau vole et tire tout seul', tap: 'Touche pour commencer', best: 'Record : ', wave: 'VAGUE ', over: 'Le vaisseau s’est brisé…', rec: 'NOUVEAU RECORD', again: 'Touche pour revoler' },
  de: { how1: 'Halte links oder rechts, um zu drehen', how2: 'Das Schiff fliegt und schießt von selbst', tap: 'Tippe zum Starten', best: 'Rekord: ', wave: 'WELLE ', over: 'Das Schiff ist zerbrochen…', rec: 'NEUER REKORD', again: 'Tippe, um wieder zu fliegen' },
  ja: { how1: '左か右をおしっぱなしでターン', how2: '船はじどうで飛んでうつよ', tap: 'タップでスタート', best: 'ベスト：', wave: 'ウェーブ ', over: '船がこわれちゃった…', rec: 'しんきろく', again: 'タップでもういっかい' },
  zh: { how1: '按住左边或右边来转向', how2: '飞船会自己飞行和开火', tap: '点一下开始', best: '纪录：', wave: '第', over: '飞船撞碎了…', rec: '新纪录', again: '点一下再飞一次' },
};
const T = TRL[ggLang] || TRL.hy;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sShoot = () => tone(700, 0.05, 'square', 0.045);
const sBoom = r => tone(120 + (50 - r), 0.2, 'sawtooth', 0.14);
const sHit = () => { tone(150, 0.3, 'sawtooth', 0.2); tone(90, 0.35, 'sawtooth', 0.15, 0.06); };
const sWave = () => [523, 659, 784].forEach((f, k) => tone(f, 0.15, 'triangle', 0.15, k * 0.09));
const sRec = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.2, 'triangle', 0.18, k * 0.11));

// ——— Խաղի վիճակը ———
let state = 'menu', endedAt = 0;
let best = 0;
try { best = Number(localStorage.getItem('aren-asteroid-best') || 0); } catch (e) {}
let ship, rocks, bullets, sparks, score, lives, wave, waveFlash, invinc, fireT, frame = 0, stars = [];
let holdL = false, holdR = false;

function makeRock(x, y, r) {
  const verts = [];
  const n = 9;
  for (let i = 0; i < n; i++) verts.push(0.72 + Math.random() * 0.4);
  return {
    x, y, r, verts,
    vx: (Math.random() * 2 - 1) * (1.6 - r / 60),
    vy: (Math.random() * 2 - 1) * (1.6 - r / 60),
    a: Math.random() * Math.PI * 2,
    spin: (Math.random() * 2 - 1) * 0.02,
  };
}
function spawnWave() {
  const n = 2 + wave;
  for (let i = 0; i < n; i++) {
    // ալիքի քարերը ծնվում են էկրանի եզրերին, ոչ թե նավի վրա
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (Math.hypot(x - ship.x, y - ship.y) < 180);
    rocks.push(makeRock(x, y, 40));
  }
  waveFlash = 90;
  if (wave > 1) sWave();
}
function newGame() {
  ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 };
  rocks = []; bullets = []; sparks = [];
  score = 0; lives = 3; wave = 1; invinc = 0; fireT = 0;
  stars = [];
  for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.7 + Math.random() * 1.5 });
  spawnWave();
  state = 'play';
}

function press(x) {
  if (state === 'menu') { initAudio(); newGame(); return true; }
  if (state === 'over') {
    if (Date.now() - endedAt > 1100) { initAudio(); newGame(); }
    return true;
  }
  return false;
}
window.addEventListener('touchstart', (e) => {
  if (e.target.closest('a')) return;
  initAudio();
  if (press()) return;
  for (const t of e.touches) {
    if (t.clientX < W / 2) holdL = true; else holdR = true;
  }
}, { passive: true });
window.addEventListener('touchend', (e) => {
  holdL = false; holdR = false;
  for (const t of e.touches) {
    if (t.clientX < W / 2) holdL = true; else holdR = true;
  }
});
window.addEventListener('mousedown', (e) => {
  if (e.target.closest('a')) return;
  initAudio();
  if (press()) return;
  if (e.clientX < W / 2) holdL = true; else holdR = true;
});
window.addEventListener('mouseup', () => { holdL = false; holdR = false; });
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') holdL = true;
  if (e.code === 'ArrowRight') holdR = true;
  if (e.code === 'Space') { e.preventDefault(); press(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') holdL = false;
  if (e.code === 'ArrowRight') holdR = false;
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

function boom(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.5;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 1, col });
  }
}

function step() {
  frame++;
  if (state !== 'play') return;

  // Նավը
  if (holdL) ship.a -= 0.065;
  if (holdR) ship.a += 0.065;
  ship.vx += Math.cos(ship.a) * 0.085;
  ship.vy += Math.sin(ship.a) * 0.085;
  ship.vx *= 0.985; ship.vy *= 0.985;
  ship.x = (ship.x + ship.vx + W) % W;
  ship.y = (ship.y + ship.vy + H) % H;

  // Ինքնակրակ
  if (--fireT <= 0) {
    bullets.push({ x: ship.x + Math.cos(ship.a) * 16, y: ship.y + Math.sin(ship.a) * 16, vx: Math.cos(ship.a) * 7.5 + ship.vx, vy: Math.sin(ship.a) * 7.5 + ship.vy, life: 62 });
    sShoot();
    fireT = 22;
  }
  for (const b of bullets) {
    b.x = (b.x + b.vx + W) % W;
    b.y = (b.y + b.vy + H) % H;
    b.life--;
  }
  bullets = bullets.filter(b => b.life > 0);

  // Քարերը
  for (const r of rocks) {
    r.x = (r.x + r.vx + W) % W;
    r.y = (r.y + r.vy + H) % H;
    r.a += r.spin;
  }

  // Փամփուշտ ↔ քար
  for (const b of bullets) {
    for (const r of rocks) {
      if (Math.hypot(b.x - r.x, b.y - r.y) < r.r) {
        b.life = 0;
        r.dead = true;
        sBoom(r.r);
        boom(r.x, r.y, 10, '#c9b8a0');
        score += r.r > 32 ? 10 : r.r > 20 ? 20 : 40;
        if (r.r > 20) {
          for (let k = 0; k < 2; k++) {
            const nr = makeRock(r.x, r.y, r.r > 32 ? 24 : 14);
            nr.vx = (Math.random() * 2 - 1) * 2.2;
            nr.vy = (Math.random() * 2 - 1) * 2.2;
            rocks.push(nr);
          }
        }
        break;
      }
    }
  }
  rocks = rocks.filter(r => !r.dead);
  if (!rocks.length) { wave++; spawnWave(); }

  // Նավ ↔ քար
  if (invinc > 0) invinc--;
  else {
    for (const r of rocks) {
      if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 11) {
        lives--;
        sHit();
        boom(ship.x, ship.y, 18, '#ffd166');
        if (lives <= 0) {
          state = 'over';
          endedAt = Date.now();
          if (score > best) {
            best = score;
            try { localStorage.setItem('aren-asteroid-best', best); } catch (e) {}
            setTimeout(sRec, 600);
          }
          return;
        }
        ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;
        invinc = 110;
        break;
      }
    }
  }

  for (const s of sparks) { s.x += s.vx; s.y += s.vy; s.t -= 0.03; }
  sparks = sparks.filter(s => s.t > 0);
  if (waveFlash > 0) waveFlash--;
}

// ——— Նկարելը ———
function drawShip(x, y, a, ghost) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a + Math.PI / 2);
  ctx.globalAlpha = ghost ? 0.45 : 1;
  // բոցը
  if (state === 'play' && frame % 4 < 3 && !ghost) {
    ctx.fillStyle = '#ff8c28';
    ctx.beginPath();
    ctx.moveTo(-5, 14);
    ctx.lineTo(0, 24 + Math.random() * 7);
    ctx.lineTo(5, 14);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#ffd166';
  ctx.strokeStyle = '#c98a12';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(11, 13);
  ctx.lineTo(0, 7);
  ctx.lineTo(-11, 13);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#9fd3f2';
  ctx.beginPath(); ctx.arc(0, -4, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawText(txt, x, y, size, color, align, bold) {
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + size + 'px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.fillText(txt, x, y);
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1030');
  g.addColorStop(1, '#1d1d45');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + Math.sin(frame * 0.02 + s.x) * 0.25;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state === 'menu') {
    drawText('Golden Asteroid', W / 2, H * 0.24, Math.min(40, W * 0.09), '#ffd166', 'center', true);
    drawShip(W / 2, H * 0.42, -Math.PI / 2, false);
    // ցուցադրական քար
    const demo = makeRock(W / 2 + 90, H * 0.42, 30);
    drawRock(demo);
    drawText(T.how1, W / 2, H * 0.62, Math.min(17, W * 0.045), '#eef0ff');
    drawText(T.how2, W / 2, H * 0.665, Math.min(17, W * 0.045), '#eef0ff');
    if (best > 0) drawText(T.best + best, W / 2, H * 0.72, Math.min(15, W * 0.04), '#9a9ec7');
    if (Math.floor(Date.now() / 600) % 2) drawText(T.tap, W / 2, H * 0.8, Math.min(17, W * 0.045), '#6ee7b7');
    return;
  }

  for (const r of rocks) drawRock(r);
  ctx.fillStyle = '#ffd166';
  for (const b of bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  for (const s of sparks) {
    ctx.globalAlpha = s.t;
    ctx.fillStyle = s.col;
    ctx.fillRect(s.x, s.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  if (!(invinc > 0 && Math.floor(frame / 5) % 2)) drawShip(ship.x, ship.y, ship.a, false);

  // HUD
  drawText(String(score), W / 2, 78, 38, '#ffffff', 'center', true);
  if (best > 0) drawText(T.best + best, W / 2, 100, 14, 'rgba(255,255,255,0.65)');
  // կյանքերը՝ փոքրիկ նավիկներ
  for (let i = 0; i < lives; i++) drawShip(W - 26 - i * 26, 74, -Math.PI / 2, true);
  if (waveFlash > 0) {
    drawText(T.wave + wave, W / 2, H * 0.3, Math.min(30, W * 0.08), 'rgba(110,231,183,' + Math.min(1, waveFlash / 40) + ')', 'center', true);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(12,10,26,0.75)';
    ctx.fillRect(0, 0, W, H);
    drawText(T.over, W / 2, H * 0.34, Math.min(28, W * 0.07), '#eef0ff', 'center', true);
    drawText(String(score), W / 2, H * 0.47, Math.min(58, W * 0.14), '#ffd166', 'center', true);
    if (score >= best && score > 0) drawText(T.rec, W / 2, H * 0.55, Math.min(22, W * 0.055), '#6ee7b7', 'center', true);
    else if (best > 0) drawText(T.best + best, W / 2, H * 0.55, Math.min(17, W * 0.045), '#9a9ec7');
    if (Date.now() - endedAt > 1100 && Math.floor(Date.now() / 600) % 2) {
      drawText(T.again, W / 2, H * 0.66, Math.min(17, W * 0.045), '#6ee7b7');
    }
  }
}
function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.a);
  ctx.fillStyle = '#8d93a8';
  ctx.strokeStyle = '#5a6078';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < r.verts.length; i++) {
    const a = i / r.verts.length * Math.PI * 2;
    const rr = r.r * r.verts[i];
    i === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#6b7188';
  ctx.beginPath(); ctx.arc(-r.r * 0.25, -r.r * 0.15, r.r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r.r * 0.25, r.r * 0.3, r.r * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
