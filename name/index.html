const T = TRL[ggLang] || TRL.hy;
document.getElementById('h1').textContent = T.t;
document.getElementById('sub').textContent = T.s;
document.getElementById('goBtn').textContent = T.go;
document.getElementById('keepBtn').textContent = T.keep;
document.title = T.t + ' · Golden Games';
document.documentElement.lang = ggLang;

let kind = 'hero', current = '';

let actx = null;
function initAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(f, d, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (d || 0.13));
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (d || 0.13));
}
let lastTouchAt = 0;
document.addEventListener('touchstart', () => { lastTouchAt = Date.now(); initAudio(); }, { passive: true });
function ghost() { return Date.now() - lastTouchAt < 700; }
let lastTap = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTap < 350) e.preventDefault(); lastTap = n; }, { passive: false });

const kinds = document.getElementById('kinds');
['hero', 'beast', 'mage', 'pet'].forEach(k => {
  const b = document.createElement('button');
  b.textContent = T.k[k]; b.dataset.k = k;
  b.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && ghost()) return;
    initAudio(); tone(540, 0.08, 'sine');
    kind = k; make();
  });
  kinds.appendChild(b);
});

const pick = a => a[Math.floor(Math.random() * a.length)];
function make() {
  initAudio(); tone(680, 0.11, 'triangle');
  const a = useArm ? A : LA, b = useArm ? B : LB;
  let n = pick(a) + pick(b);
  if (Math.random() < 0.35) n += (useArm ? '' : '') + pick(b);   // երբեմն ավելի երկար անուն
  current = n + ' ' + pick(T.e[kind]);
  document.getElementById('kindLbl').textContent = T.k[kind].toUpperCase();
  document.getElementById('nm').textContent = n;
  document.getElementById('ep').textContent = pick(T.e[kind]);
  current = n + ' — ' + document.getElementById('ep').textContent;
  [...kinds.children].forEach(x => x.classList.toggle('on', x.dataset.k === kind));
}
document.getElementById('goBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return; make();
});

// ——— պահված անունները ———
function loadSaved() { try { return JSON.parse(localStorage.getItem('aren-name-saved') || '[]'); } catch (e) { return []; } }
function showSaved() {
  const list = loadSaved(), box = document.getElementById('saved');
  box.textContent = '';
  if (!list.length) return;
  const h = document.createElement('div'); h.textContent = T.savedT; box.appendChild(h);
  list.forEach(x => { const d = document.createElement('div'); d.textContent = '⭐ ' + x; box.appendChild(d); });
}
document.getElementById('keepBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  if (!current) return;
  initAudio(); tone(820, 0.15, 'triangle');
  const list = loadSaved();
  if (list.indexOf(current) < 0) list.unshift(current);
  try { localStorage.setItem('aren-name-saved', JSON.stringify(list.slice(0, 12))); } catch (er) {}
  showSaved();
});

make(); showSaved();
</script>
