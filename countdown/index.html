<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ոսկե Հաշվարկ 🎂 · Golden Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1a2138; color: #f5eede; font-family: Arial, Helvetica, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 56px 14px 24px; min-height: 100vh; }
  h1 { margin: 0 0 2px; font-size: 1.2rem; color: #f0c85a; }
  .sub { margin: 0 0 14px; font-size: 0.74rem; opacity: 0.7; text-align: center; }
  #days { font-size: 5rem; font-weight: bold; line-height: 1; color: #ffe9a8; font-variant-numeric: tabular-nums; }
  #dlbl { font-size: 1rem; margin-top: 2px; }
  #when { font-size: 0.78rem; opacity: 0.7; margin-top: 8px; min-height: 18px; text-align: center; }
  canvas { width: 100%; max-width: 380px; height: auto; display: block; margin-top: 12px; touch-action: none; }
  .pick { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  select, button {
    font-family: inherit; font-size: 0.86rem; padding: 10px 13px; border-radius: 12px; cursor: pointer;
    color: #f5eede; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.24);
  }
  select option { background: #1a2138; color: #f5eede; }
  button.go { background: #f0c85a; border-color: #f0c85a; color: #10162a; font-weight: bold; }
  #party { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #party[hidden] { display: none !important; }
</style>
</head>
<body>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;font-family:Arial,sans-serif;">← Golden Games</a>

<h1 id="h1">Ոսկե Հաշվարկ 🎂</h1>
<p class="sub" id="sub">Քանի՞ օր է մնացել ծննդյանդ օրվան։</p>

<div id="days">—</div>
<div id="dlbl"></div>
<div id="when"></div>

<canvas id="cv" width="760" height="400"></canvas>

<div class="pick">
  <select id="dsel"></select>
  <select id="msel"></select>
  <button class="go" id="setBtn">✅ Պահել</button>
</div>

<canvas id="party" hidden></canvas>

<script>
// ——————————————————————————————————————
//  ՈՍԿԵ ՀԱՇՎԱՐԿ 🎂 — Արենի միտքն է
//  Ընտրում ես ծննդյանդ օրը, ու էջը միշտ ցույց է տալիս,
//  թե քանի քուն է մնացել մինչև տորթը։
// ——————————————————————————————————————
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}

const TRL = {
  hy: { t: 'Ոսկե Հաշվարկ 🎂', s: 'Քանի՞ օր է մնացել ծննդյանդ օրվան։', set: '✅ Պահել',
        d1: 'օր է մնացել', d0: 'ՇՆՈՐՀԱՎՈ՛Ր ԾՆՈՒՆԴԴ 🎉', tomorrow: 'Վաղը՛ է 🎈',
        on: (d, m) => 'Ծննդյանդ օրը՝ ' + d + ' ' + m, pickIt: 'Ընտրիր ամսաթիվը ու սեղմիր «Պահել»',
        M: ['հունվարի','փետրվարի','մարտի','ապրիլի','մայիսի','հունիսի','հուլիսի','օգոստոսի','սեպտեմբերի','հոկտեմբերի','նոյեմբերի','դեկտեմբերի'] },
  ru: { t: 'Золотой Отсчёт 🎂', s: 'Сколько дней до твоего дня рождения?', set: '✅ Сохранить',
        d1: 'дней осталось', d0: 'С ДНЁМ РОЖДЕНИЯ 🎉', tomorrow: 'Уже завтра 🎈',
        on: (d, m) => 'Твой день рождения: ' + d + ' ' + m, pickIt: 'Выбери дату и нажми «Сохранить»',
        M: ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'] },
  en: { t: 'Golden Countdown 🎂', s: 'How many days until your birthday?', set: '✅ Save',
        d1: 'days to go', d0: 'HAPPY BIRTHDAY 🎉', tomorrow: 'It is tomorrow 🎈',
        on: (d, m) => 'Your birthday: ' + d + ' ' + m, pickIt: 'Pick the date and press Save',
        M: ['January','February','March','April','May','June','July','August','September','October','November','December'] },
  es: { t: 'Cuenta Atrás Dorada 🎂', s: '¿Cuántos días faltan para tu cumpleaños?', set: '✅ Guardar',
        d1: 'días quedan', d0: '¡FELIZ CUMPLEAÑOS! 🎉', tomorrow: '¡Es mañana! 🎈',
        on: (d, m) => 'Tu cumpleaños: ' + d + ' de ' + m, pickIt: 'Elige la fecha y pulsa Guardar',
        M: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'] },
  fr: { t: 'Compte à Rebours Doré 🎂', s: 'Combien de jours avant ton anniversaire ?', set: '✅ Enregistrer',
        d1: 'jours restants', d0: 'JOYEUX ANNIVERSAIRE 🎉', tomorrow: 'C’est demain 🎈',
        on: (d, m) => 'Ton anniversaire : ' + d + ' ' + m, pickIt: 'Choisis la date et appuie sur Enregistrer',
        M: ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] },
  de: { t: 'Goldener Countdown 🎂', s: 'Wie viele Tage bis zu deinem Geburtstag?', set: '✅ Speichern',
        d1: 'Tage noch', d0: 'ALLES GUTE ZUM GEBURTSTAG 🎉', tomorrow: 'Schon morgen 🎈',
        on: (d, m) => 'Dein Geburtstag: ' + d + '. ' + m, pickIt: 'Wähle das Datum und drücke Speichern',
        M: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] },
  ja: { t: 'ゴールデン・カウントダウン 🎂', s: 'たんじょうびまであとなんにち？', set: '✅ ほぞん',
        d1: 'にちのこってる', d0: 'おたんじょうびおめでとう 🎉', tomorrow: 'あしただよ 🎈',
        on: (d, m) => 'きみのたんじょうび：' + m + d + 'にち', pickIt: 'ひづけをえらんで「ほぞん」をおしてね',
        M: ['1がつ','2がつ','3がつ','4がつ','5がつ','6がつ','7がつ','8がつ','9がつ','10がつ','11がつ','12がつ'] },
  zh: { t: '黄金倒数 🎂', s: '离你的生日还有几天？', set: '✅ 保存',
        d1: '天', d0: '生日快乐 🎉', tomorrow: '就是明天 🎈',
        on: (d, m) => '你的生日：' + m + d + '日', pickIt: '选好日期再按保存',
        M: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'] },
  it: { t: 'Conto alla Rovescia Dorato 🎂', s: 'Quanti giorni mancano al tuo compleanno?', set: '✅ Salva',
        d1: 'giorni mancano', d0: 'BUON COMPLEANNO 🎉', tomorrow: 'È domani 🎈',
        on: (d, m) => 'Il tuo compleanno: ' + d + ' ' + m, pickIt: 'Scegli la data e premi Salva',
        M: ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'] },
  ka: { t: 'ოქროს ათვლა 🎂', s: 'რამდენი დღეა დაბადების დღემდე?', set: '✅ შენახვა',
        d1: 'დღე დარჩა', d0: 'გილოცავ დაბადების დღეს 🎉', tomorrow: 'ხვალაა 🎈',
        on: (d, m) => 'შენი დაბადების დღე: ' + d + ' ' + m, pickIt: 'აირჩიე თარიღი და დააჭირე «შენახვა»',
        M: ['იანვარი','თებერვალი','მარტი','აპრილი','მაისი','ივნისი','ივლისი','აგვისტო','სექტემბერი','ოქტომბერი','ნოემბერი','დეკემბერი'] },
  hi: { t: 'गोल्डन उलटी गिनती 🎂', s: 'तुम्हारे जन्मदिन में कितने दिन बाकी हैं?', set: '✅ सेव',
        d1: 'दिन बाकी', d0: 'जन्मदिन मुबारक 🎉', tomorrow: 'कल ही है 🎈',
        on: (d, m) => 'तुम्हारा जन्मदिन: ' + d + ' ' + m, pickIt: 'तारीख़ चुनो और सेव दबाओ',
        M: ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'] },
};
const T = TRL[ggLang] || TRL.hy;
document.getElementById('h1').textContent = T.t;
document.getElementById('sub').textContent = T.s;
document.getElementById('setBtn').textContent = T.set;
document.title = T.t + ' · Golden Games';
document.documentElement.lang = ggLang;

let actx = null;
function initAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(f, d, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (d || 0.14));
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (d || 0.14));
}
let lastTouchAt = 0;
document.addEventListener('touchstart', () => { lastTouchAt = Date.now(); initAudio(); }, { passive: true });
function ghost() { return Date.now() - lastTouchAt < 700; }
let lastTap = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTap < 350) e.preventDefault(); lastTap = n; }, { passive: false });

// ——— ամսաթվի ընտրիչները ———
const dsel = document.getElementById('dsel'), msel = document.getElementById('msel');
for (let i = 1; i <= 31; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i; dsel.appendChild(o); }
T.M.forEach((m, i) => { const o = document.createElement('option'); o.value = i; o.textContent = m; msel.appendChild(o); });

let bd = null;   // { d, m }
try { const s = localStorage.getItem('aren-bday'); if (s) bd = JSON.parse(s); } catch (e) {}
if (bd) { dsel.value = bd.d; msel.value = bd.m; }

document.getElementById('setBtn').addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && ghost()) return;
  initAudio(); tone(760, 0.14, 'triangle');
  bd = { d: Number(dsel.value), m: Number(msel.value) };
  try { localStorage.setItem('aren-bday', JSON.stringify(bd)); } catch (er) {}
  refresh();
});

// քանի օր է մնացել՝ միայն օրերով, առանց ժամի շփոթի
function daysLeft() {
  if (!bd) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(now.getFullYear(), bd.m, bd.d);
  if (next < today) next = new Date(now.getFullYear() + 1, bd.m, bd.d);
  // փետրվարի 29-ը չլինող տարում սահում է մարտի 1 — թող այդպես մնա, օրերը ճիշտ են
  return Math.round((next - today) / 86400000);
}

let celebrated = false;
function refresh() {
  const n = daysLeft();
  const D = document.getElementById('days'), L = document.getElementById('dlbl'), Wn = document.getElementById('when');
  if (n === null) { D.textContent = '—'; L.textContent = ''; Wn.textContent = T.pickIt; return; }
  Wn.textContent = T.on(bd.d, T.M[bd.m]);
  if (n === 0) {
    D.textContent = '🎂'; L.textContent = T.d0;
    if (!celebrated) { celebrated = true; party(); }
  } else if (n === 1) { D.textContent = '1'; L.textContent = T.tomorrow; }
  else { D.textContent = String(n); L.textContent = T.d1; }
  paint(n);
}

// ——— տորթը. միայն ձևեր, ոչ մի emoji կտավի վրա ———
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let t0 = 0;
function paint(n) {
  cx.clearRect(0, 0, W, H);
  const cxm = W / 2, base = H - 46;
  // սեղանը
  cx.fillStyle = '#3a3556'; cx.fillRect(0, base + 22, W, 24);
  // ափսեն
  cx.fillStyle = '#cfd6e6';
  cx.beginPath(); cx.ellipse(cxm, base + 22, 190, 18, 0, 0, Math.PI * 2); cx.fill();
  // տորթի հարկերը
  cx.fillStyle = '#c9825a'; cx.beginPath(); cx.roundRect(cxm - 140, base - 70, 280, 92, 12); cx.fill();
  cx.fillStyle = '#f5eede'; cx.beginPath(); cx.roundRect(cxm - 140, base - 84, 280, 26, 10); cx.fill();
  cx.fillStyle = '#e8756a'; cx.beginPath(); cx.roundRect(cxm - 104, base - 152, 208, 74, 12); cx.fill();
  cx.fillStyle = '#f5eede'; cx.beginPath(); cx.roundRect(cxm - 104, base - 164, 208, 24, 10); cx.fill();
  // կաթիլները
  cx.fillStyle = '#f5eede';
  for (let i = -3; i <= 3; i++) { cx.beginPath(); cx.arc(cxm + i * 32, base - 58, 9, 0, Math.PI); cx.fill(); }
  // մոմերը — որքան օր է մնացել, այնքան քիչ մոմ չէ, այլ միշտ 5, բոցը շարժվում է
  const flames = 5;
  for (let i = 0; i < flames; i++) {
    const x = cxm - 72 + i * 36;
    cx.fillStyle = ['#7fd1c1', '#f0c85a', '#e8756a', '#a76fd6', '#5b8de8'][i];
    cx.fillRect(x - 5, base - 216, 10, 54);
    if (n !== 0) {
      const w = Math.sin(t0 * 3 + i) * 2.4;
      cx.fillStyle = '#ffd166';
      cx.beginPath(); cx.ellipse(x + w, base - 228, 7, 13, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#fff3c4';
      cx.beginPath(); cx.ellipse(x + w, base - 226, 3.4, 7, 0, 0, Math.PI * 2); cx.fill();
    }
  }
}

// ——— ծննդյան օրվա տոնը ———
const pv = document.getElementById('party'), pcx = pv.getContext('2d');
let bits = [];
function party() {
  pv.hidden = false; pv.width = innerWidth; pv.height = innerHeight;
  const cols = ['#f0c85a', '#ffe9a8', '#e8756a', '#7fd1c1', '#a76fd6', '#5b8de8'];
  bits = [];
  for (let i = 0; i < 80; i++) bits.push({
    x: Math.random() * pv.width, y: -Math.random() * pv.height,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 9,
    vy: 1.3 + Math.random() * 2.3, vx: (Math.random() - 0.5) * 1.4,
    a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.2,
    c: cols[Math.floor(Math.random() * cols.length)],
  });
  initAudio();
  [523, 587, 659, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.16), i * 200));
  try { navigator.vibrate && navigator.vibrate([40, 70, 40, 70, 140]); } catch (e) {}
}
function loop(now) {
  t0 = now / 1000;
  paint(daysLeft());
  if (!pv.hidden) {
    pcx.clearRect(0, 0, pv.width, pv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.a += b.va;
      if (b.y > pv.height + 20) { b.y = -20; b.x = Math.random() * pv.width; }
      pcx.save(); pcx.translate(b.x, b.y); pcx.rotate(b.a);
      pcx.fillStyle = b.c; pcx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      pcx.restore();
    }
  }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { if (!pv.hidden) { pv.width = innerWidth; pv.height = innerHeight; } });

refresh();
requestAnimationFrame(loop);
</script>
