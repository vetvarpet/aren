<link rel="icon" type="image/png" href="../logo-icon.png">
<title>Ոսկե Քաղաք 🏰 · Golden Games</title>
<style>
  :root {
    --bg: #12122b;
    --card: #1d1d3f;
    --ink: #eef0ff;
    --dim: #9a9ec7;
    --accent: #ffd166;
    --accent2: #6ee7b7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, Helvetica, sans-serif;
    padding: 56px 14px 34px; min-height: 100vh; touch-action: manipulation;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 3px; font-size: 1.3rem; color: var(--accent); text-align: center; }
  .sub { margin: 0 0 14px; font-size: 0.76rem; color: var(--dim); text-align: center; line-height: 1.5; }

  /* 🏙️ Քաղաքը — ամեն գնած շենք իր տեղում հայտնվում է */
  .scene {
    background: linear-gradient(#1b2450 0%, #2d3a6e 55%, #3c5a46 55%, #2c4433 100%);
    border: 2px solid #33356b; border-radius: 18px; overflow: hidden;
  }
  .scene svg { display: block; width: 100%; height: auto; }
  .empty { text-align: center; font-size: 0.78rem; color: var(--dim); padding: 10px 12px 0; line-height: 1.6; }

  .purse {
    margin-top: 12px;
    background: linear-gradient(135deg, var(--card), rgba(255,209,102,0.14));
    border: 2px solid var(--accent); border-radius: 16px;
    padding: 11px 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .purse .l { font-size: 0.74rem; color: var(--dim); }
  .purse .r { font-size: 1.25rem; font-weight: bold; color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .it {
    background: var(--card); border: 2px solid #33356b; border-radius: 15px;
    padding: 10px; text-align: center;
  }
  .it.have { border-color: var(--accent2); }
  .it.lock { opacity: 0.62; }
  .it .pic { height: 52px; display: flex; align-items: flex-end; justify-content: center; }
  .it .pic svg { height: 100%; width: auto; }
  .it .nm { font-size: 0.82rem; font-weight: bold; margin-top: 6px; }
  .it .pr { font-size: 0.74rem; color: var(--accent); margin-top: 2px; }
  .it .need { font-size: 0.66rem; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .it button {
    width: 100%; margin-top: 7px; padding: 8px; border-radius: 10px; border: none;
    background: var(--accent); color: #2e2410; font-family: inherit; font-weight: bold;
    font-size: 0.8rem; cursor: pointer;
  }
  .it button:disabled { background: #33356b; color: #7b7fa8; cursor: default; }
  .it button:active:not(:disabled) { transform: scale(0.96); }
  .it .done { margin-top: 7px; font-size: 0.8rem; font-weight: bold; color: var(--accent2); }

  .note { font-size: 0.72rem; color: var(--dim); text-align: center; margin-top: 16px; line-height: 1.6; }
  #toast {
    position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 120;
    background: var(--accent); color: #2e2410; font-weight: bold;
    padding: 10px 18px; border-radius: 999px; font-size: 0.86rem; pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <h1 id="h1">🏰 Ոսկե Քաղաք</h1>

  <div class="scene">
    <svg id="scene" viewBox="0 0 320 180" aria-hidden="true"></svg>

  <p class="empty" id="empty" hidden>—</p>

  const kit = window.ggKit || {};
  const n = b.need;
  if (n.k === 'tro') return (kit.trophies ? kit.trophies() : 0) >= n.n ? null : T.nd.tro(n.n);
  if (n.k === 'str') return (kit.streakBest ? kit.streakBest() : 0) >= n.n ? null : T.nd.str(n.n);
  if (n.k === 'sec') {
    const got = window.ggSecret ? ggSecret.list.filter(s => ggSecret.isFound(s.id)).length : 0;
    return got >= n.n ? null : T.nd.sec(n.n);
  }
  if (n.k === 'game') return num(lsGet(n.key)) > 0 ? null : T.nd.game(n.g);
  return null;
}

// ——— Քաղաքը նկարելը ———
function drawTown() {
  const parts = [];
  // արև ու ամպեր՝ միշտ
  parts.push('<circle cx="282" cy="30" r="15" fill="#ffd166" opacity="0.9"/>');
  parts.push('<g fill="#ffffff" opacity="0.22"><ellipse cx="60" cy="34" rx="22" ry="9"/><ellipse cx="78" cy="30" rx="15" ry="8"/>' +
             '<ellipse cx="200" cy="22" rx="18" ry="7"/></g>');
  // ճանապարհը
  parts.push('<rect x="0" y="152" width="320" height="6" fill="#4b4b55" opacity="0.5"/>');
  let any = false;
  // հեռվի շենքերը առաջ նկարենք, որ մոտիկները վրան գան
  BUILDINGS.slice().sort((a, b) => a.y - b.y).forEach(b => {
    if (!owned(b.id)) return;
    any = true;
    parts.push('<g transform="translate(' + b.x + ',' + b.y + ') scale(' + b.sc + ') translate(-22,-40)">' + PIC[b.pic] + '</g>');
  });
  $('scene').innerHTML = parts.join('');
  $('empty').hidden = any;
  $('empty').textContent = T.empty;
}

function toast(txt) {
  const el = $('toast');
  el.textContent = txt;
  el.hidden = false;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.hidden = true; }, 2400);
}

function paint() {
  const coins = window.ggCoins ? ggCoins.get() : 0;
  $('purseR').textContent = '🪙 ' + coins;
  $('grid').innerHTML = BUILDINGS.map((b, i) => {
    const have = owned(b.id);
    const need = have ? null : locked(b);
    const cls = 'it' + (have ? ' have' : need ? ' lock' : '');
    const btn = have
      ? '<div class="done">' + T.have + '</div>'
      : '<button data-id="' + b.id + '"' + ((need || coins < b.cost) ? ' disabled' : '') + '>' +
        (need ? T.lock : T.buy) + '</button>';
    return '<div class="' + cls + '">' +
      '<div class="pic"><svg viewBox="0 0 50 42">' + PIC[b.pic] + '</svg></div>' +
      '<div class="nm">' + T.n[i] + '</div>' +
      '<div class="pr">🪙 ' + b.cost + '</div>' +
      (need ? '<div class="need">' + need + '</div>' : '') +
      btn + '</div>';
  }).join('');
  $('grid').querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => build(btn.getAttribute('data-id')));
  });
  drawTown();
}

function build(id) {
  const b = BUILDINGS.find(x => x.id === id);
  if (!b || owned(id) || locked(b)) return;
  if (!window.ggCoins) return;
  if (ggCoins.get() < b.cost) { toast(T.poor); return; }
  if (!ggCoins.spend(b.cost)) { toast(T.poor); return; }
  ggCoins.give('town:' + id);
  toast(T.bought(T.n[BUILDINGS.indexOf(b)]));
  paint();
}

$('h1').textContent = T.t;
$('sub').textContent = T.s;
$('purseL').textContent = T.purse;
$('note').textContent = T.note;

// Գործիքակազմը defer-ով է գալիս — սպասում ենք, որ ոսկին իմանանք
function boot() { paint(); }
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
