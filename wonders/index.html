<style>
  * { margin: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(#1c2858, #0f1630);
    background-color: #0f1630;
    color: #f4efe2;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif;

  }
  .app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* Վերևի շերտը՝ կյանքեր ու մետաղադրամներ */
  .hud { display: flex; align-items: center; gap: 8px; }
  .brand { font-weight: bold; color: #f2c14e; font-size: 1.05rem; margin-right: auto; }
  .pill { display: inline-flex; align-items: center; gap: 5px; background: #18224a; border: 1px solid #2c3870; border-radius: 999px; padding: 5px 11px; font-weight: bold; }

  /* Ճանապարհը ու ինքնաթիռը */
  .route { position: relative; height: 34px; }
  .route-line { position: absolute; left: 10px; right: 10px; top: 17px; border-top: 2px dashed #3a4682; }
  .route-dots { position: absolute; inset: 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #222e60; border: 2px solid #3a4682; }
  .dot.ok { background: #f2c14e; border-color: #f2c14e; }
  .dot.miss { background: #ef6a5b; border-color: #ef6a5b; }
  .plane { position: absolute; top: 2px; font-size: 22px; transform: translateX(-50%); transition: left .9s cubic-bezier(.5,0,.2,1); }

  .card { background: linear-gradient(180deg, #18224a, #151e42); border: 1px solid #2c3870; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.15; color: #f2c14e; }
  h2 { font-size: 1.3rem; line-height: 1.25; }
  .eyebrow { font-size: 0.75rem; letter-spacing: .12em; text-transform: uppercase; color: #a9b0cf; font-weight: bold; }
  p { line-height: 1.5; }
  .muted { color: #a9b0cf; }
  .center { text-align: center; }

  /* Հրաշալիքի նկարը. սկզբում սև ուրվագիծ է */
  .art { width: min(170px, 46vw); aspect-ratio: 1; margin: 0 auto; border-radius: 18px; background: #26346d; overflow: hidden; }
  .art svg { width: 100%; height: 100%; display: block; transition: filter .6s ease; }
  .art.shadow svg { filter: brightness(0) opacity(.75); }

  .hints { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hints li { background: #1e2a5a; border-radius: 12px; padding: 10px 12px; line-height: 1.45; animation: pop .35s ease; }
  .hints li b { color: #f2c14e; margin-right: 6px; }
  @keyframes pop { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 340px) { .options { grid-template-columns: 1fr; } }
  .opt { background: #222e60; color: #f4efe2; border: 2px solid #34418a; border-radius: 14px; padding: 12px 8px; font-family: inherit; font-size: 0.95rem; font-weight: bold; line-height: 1.3; text-align: center; min-height: 56px; cursor: pointer; transition: transform .1s; }
  .opt:active:not(:disabled) { transform: scale(0.95); }
  .opt.right { background: #1d4a3a; border-color: #4fc28a; }
  .opt.wrong { background: #4e2430; border-color: #ef6a5b; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { flex: 1 1 auto; background: #f2c14e; color: #2a1d05; border: 0; border-radius: 14px; padding: 14px 16px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #c8952c; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c8952c; }
  .btn.ghost { background: transparent; color: #f4efe2; border: 2px solid #3a4682; box-shadow: none; }
  .btn.small { flex: 0 1 auto; padding: 10px 12px; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.4; }

  .fb { font-weight: bold; text-align: center; min-height: 1.4em; }
  .fb.good { color: #4fc28a; }
  .fb.bad { color: #ef6a5b; }

  .stamp { width: 150px; height: 150px; margin: 4px auto; border-radius: 50%; border: 4px double #f2c14e; color: #f2c14e; display: grid; place-items: center; text-align: center; transform: rotate(-12deg); font-weight: bold; padding: 14px; animation: stampIn .5s cubic-bezier(.2,1.6,.4,1); }
  .stamp small { display: block; font-size: 0.68rem; letter-spacing: .12em; }
  .stamp span { font-size: 1rem; line-height: 1.2; }
  .stamp.missed { color: #a9b0cf; border-color: #a9b0cf; }
  @keyframes stampIn { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
  .fact { background: #1e2a5a; border-radius: 14px; padding: 14px; line-height: 1.5; }
  .fact b { color: #f2c14e; }

  .passport { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .pp { background: #1e2a5a; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 0.72rem; line-height: 1.3; }

  .pp .mini svg { width: 100%; height: 100%; display: block; }
  .pp.locked .mini svg { filter: brightness(0) opacity(.35); }
  .pp.locked { color: #a9b0cf; }

  .big { font-size: 3.2rem; font-weight: bold; color: #f2c14e; text-align: center; line-height: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; }
  .stat { background: #1e2a5a; border-radius: 14px; padding: 10px 4px; }
  .stat b { display: block; font-size: 1.3rem; }
  .stat span { font-size: 0.72rem; color: #a9b0cf; }

let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ptsFor = h => Math.max(4, 13 - h * 3);   // 1 հուշում՝ 10, 2՝ 7, 3՝ 4

// Խաղի վիճակը. S.phase-ը ասում է՝ որ էկրանին ենք
let S = null;
let busy = false;   // պատասխանից հետո կարճ դադար, որ երկու անգամ չսեղմվի
let endAt = 0;      // երբ բացվեց վերջնական էկրանը

function hud() {
  $('lives').textContent = '❤️ ' + (S ? S.lives : 3);
  $('coins').textContent = '🪙 ' + (S ? S.score : 0);
  $('route').hidden = !S || S.phase === 'end';
  if (!S) return;
  let dots = '';
  for (let i = 0; i < ROUNDS; i++) {
    const r = S.results[i];
    dots += `<span class="dot ${r === true ? 'ok' : r === false ? 'miss' : ''}"></span>`;
  }
  $('dots').innerHTML = dots;
  const pos = Math.min(S.idx, ROUNDS - 1) / (ROUNDS - 1);
  $('plane').style.left = `calc(10px + (100% - 20px) * ${pos})`;
}

function newGame() {
  S = { queue: shuffle(WONDERS).slice(0, ROUNDS), idx: 0, score: 0, lives: 3, results: [], hints: 1, phase: 'guess', got: [], guessed: false };
  showGuess();
}
const current = () => S.queue[S.idx];

// 1️⃣ Գուշակիր հրաշալիքը սև ուրվագծից ու հուշումներից
function showGuess() {
  S.phase = 'guess';
  busy = false;
  const w = current();
  if (!S.opts) S.opts = shuffle([w, ...shuffle(WONDERS.filter(x => x.id !== w.id)).slice(0, 3)]);
  $('view').innerHTML = `
    <section class="card">
      <div class="eyebrow">${T.stop} ${S.idx + 1} / ${ROUNDS}</div>
      <h2>${T.q}</h2>
      <div class="art shadow" id="art">${svg(w.id)}</div>
      <ul class="hints">${w.hints.slice(0, S.hints).map((h, i) => `<li><b>${i + 1}.</b>${h}</li>`).join('')}</ul>
      <div class="row">
        <button class="btn ghost small" id="more" type="button" ${S.hints >= 3 ? 'disabled' : ''}>${T.more} (−3 🪙)</button>
        <span class="pill" style="margin-left:auto">${T.worth} +${ptsFor(S.hints)} 🪙</span>
      </div>
      <div class="options" id="opts">${S.opts.map(o => `<button class="opt" type="button" data-id="${o.id}">${o.name}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </section>`;
  $('more').onclick = () => { if (busy || S.hints >= 3) return; sTap(); S.hints++; showGuess(); };
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => answerGuess(b));
  hud();
}

function answerGuess(btn) {
  if (busy) return;
  busy = true;
  const w = current();
  const ok = btn.dataset.id === w.id;
  document.querySelectorAll('#opts .opt').forEach(b => { b.disabled = true; if (b.dataset.id === w.id) b.classList.add('right'); });
  $('more').disabled = true;
  $('art').classList.remove('shadow');   // նկարը գունավորվում է
  const fb = $('fb');
  S.guessed = ok;
  if (ok) {
    const p = ptsFor(S.hints);
    S.score += p;
    fb.className = 'fb good';
    fb.textContent = `${T.yes} ${w.name} +${p} 🪙`;
    sYes();
    setTimeout(showCountry, 1100);
  } else {
    btn.classList.add('wrong');
    S.lives--;
    fb.className = 'fb bad';
    fb.textContent = `${T.no} ${w.name}. −1 ❤️`;
    sNo();
    setTimeout(showFact, 1500);
  }
  hud();
}

// 2️⃣ Ճիշտ գուշակեցի՞ր — հիմա ասա՝ որ երկրում է
function showCountry() {
  S.phase = 'country';
  busy = false;
  const w = current();
  const others = WONDERS.map(x => x.country).filter(c => c !== w.country);
  const opts = shuffle([w.country, ...shuffle(others).slice(0, 3)]);
  $('view').innerHTML = `
    <section class="card">
      <div class="eyebrow">${T.stop} ${S.idx + 1} / ${ROUNDS} · ${T.whereE}</div>
      <h2>${T.where}</h2>
      <p class="muted">${w.name}</p>
      <div class="art">${svg(w.id)}</div>
      <div class="options" id="opts">${opts.map((c, i) => `<button class="opt" type="button" data-i="${i}">${c}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </section>`;
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => {
    if (busy) return;
    busy = true;
    const ok = opts[b.dataset.i] === w.country;
    document.querySelectorAll('#opts .opt').forEach(x => { x.disabled = true; if (opts[x.dataset.i] === w.country) x.classList.add('right'); });
    const fb = $('fb');
    if (ok) { S.score += 5; fb.className = 'fb good'; fb.textContent = T.cYes; sYes(); }
    else { b.classList.add('wrong'); fb.className = 'fb bad'; fb.textContent = `${T.no} ${w.country}.`; sNo(); }
    hud();
    setTimeout(showFact, 1100);
  });
  hud();
}

// 3️⃣ Կնիքը ու «Գիտե՞ս, որ»
function showFact() {
  S.phase = 'fact';
  busy = false;
  const w = current();
  const got = S.guessed;
  if (got) {
    S.got.push(w.id);
    const all = getStamps();
    if (!all.includes(w.id)) { all.push(w.id); setStamps(all); }
  }
  S.results.push(got);
  const last = S.idx === ROUNDS - 1 || S.lives <= 0;
  $('view').innerHTML = `
    <section class="card">
      <div class="stamp ${got ? '' : 'missed'}"><div><small>${got ? T.stamp : T.missed}</small><span>${w.country}</span></div></div>
      <h2 class="center">${w.name}</h2>
      <div class="fact"><b>${T.know}</b> ${w.fact}</div>
      <button class="btn" id="next" type="button">${last ? T.result : T.next}</button>
    </section>`;
  if (got) sStamp();
  $('next').onclick = () => {
    sTap();
    if (last) return showEnd();
    S.idx++; S.hints = 1; S.opts = null; showGuess();
  };
  hud();
}

// 4️⃣ Վերջ. միավորներ, ռեկորդ, անձնագիր
function showEnd() {
  // Ռեկորդն ու դադարը միայն առաջին անգամ. անձնագրից վերադառնալիս նույն էկրանն է
  const first = S.phase !== 'end';
  if (first) {
    S.phase = 'end';
    endAt = Date.now();
    S.old = getBest();
    S.isNew = S.score > S.old;
    if (S.isNew) setBest(S.score);
  }
  const old = S.old, isNew = S.isNew;
  const right = S.results.filter(Boolean).length;
  $('view').innerHTML = `
    <section class="card">
      <div class="eyebrow center">${S.lives <= 0 ? T.outLives : T.tripDone}</div>
      <div class="big">${S.score} 🪙</div>
      <p class="muted center">${isNew ? T.newRec : T.rec + ' ' + old + ' 🪙'}</p>
      <div class="stats">
        <div class="stat"><b>${right}/${S.results.length}</b><span>${T.sRight}</span></div>
        <div class="stat"><b>${S.got.length}</b><span>${T.sNew}</span></div>
        <div class="stat"><b>${getStamps().length}/12</b><span>${T.sPass}</span></div>
      </div>
      <div class="row">
        <button class="btn" id="again" type="button">${T.again}</button>
        <button class="btn ghost" id="pp" type="button">${T.pp}</button>
      </div>
    </section>`;
  if (first && isNew) sBig();
  // Խաղը վերջացավ — 1.1 վայրկյան հպումները չենք ընդունում, որ պատահմամբ նորից չսկսվի
  const cool = fn => () => { if (Date.now() - endAt < 1100) return; sTap(); fn(); };
  $('again').onclick = cool(newGame);
  $('pp').onclick = cool(showPassport);
  hud();
}

function showPassport() {
  const have = new Set(getStamps());
  const back = S ? showEnd : showStart;
  $('view').innerHTML = `
    <section class="card">
      <div class="eyebrow">${T.ppEye}</div>
      <h2>${have.size} / 12 ${T.ppW}</h2>
      <p class="muted">${T.ppP}</p>
      <div class="passport">${WONDERS.map(w => `
        <div class="pp ${have.has(w.id) ? '' : 'locked'}">
          <div class="mini">${svg(w.id)}</div>
          <div>${have.has(w.id) ? w.name : '???'}</div>
        </div>`).join('')}</div>
      <button class="btn ghost" id="back" type="button">${T.back}</button>
    </section>`;
  $('back').onclick = () => { sTap(); back(); };
  hud();
}

function showStart() {
  S = null;
  $('view').innerHTML = `
    <section class="card">
      <div class="art">${svg('pyramids')}</div>
      <h1>${T.title}</h1>
      <p>${T.intro}</p>
      <div class="stats">
        <div class="stat"><b>${ROUNDS}</b><span>${T.stops}</span></div>
        <div class="stat"><b>3</b><span>${T.lives}</span></div>
        <div class="stat"><b>${getStamps().length}/12</b><span>${T.stamps}</span></div>
      </div>
      <div class="row">
        <button class="btn" id="go" type="button">${T.go}</button>
        <button class="btn ghost" id="pp" type="button">${T.pp}</button>
      </div>
      <p class="muted" style="font-size:0.85rem">${T.best} ${getBest()} 🪙</p>
    </section>`;
  $('go').onclick = () => { sTap(); newGame(); };
  $('pp').onclick = () => { sTap(); showPassport(); };
  hud();
}

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

showStart();
</script>
