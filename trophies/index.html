<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Trophies 🏆</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 80% 8%, rgba(255, 209, 102, 0.10), transparent 45%),
      linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    min-height: 100dvh;
    padding: 72px 18px 32px;   /* վերևից տեղ ենք թողնում «← Golden Games»-ի համար */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  nav { position: fixed; top: 14px; left: 14px; z-index: 10; }
  nav a {
    color: #f5eede;
    text-decoration: none;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }

  .bigcup { width: 92px; height: 92px; }
  h1 { font-size: clamp(1.4rem, 5.5vw, 2.1rem); color: #ffd76e; text-align: center; }
  .sub { color: #9a9ec7; text-align: center; }
  .count {
    background: #ffd166;
    color: #2e2410;
    font-weight: bold;
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 0.95rem;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(94vw, 460px);
    margin-top: 6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1d1d3f;
    border: 2px solid #33356b;
    border-radius: 16px;
    padding: 10px 16px;
    text-decoration: none;
    color: #f5eede;
    transition: transform 0.12s, border-color 0.12s;
  }
  .row:hover { transform: translateY(-2px); border-color: #ffd76e; }
  .row.won { border-color: rgba(255, 209, 102, 0.55); }
  .row svg { width: 40px; height: 40px; flex-shrink: 0; }
  .row .info { flex: 1; min-width: 0; }
  .row h2 { font-size: 0.98rem; }
  .row .real { color: #9a9ec7; font-size: 0.78rem; margin-top: 1px; }
  .row .val {
    font-size: 1.15rem;
    font-weight: bold;
    color: #ffd76e;
    white-space: nowrap;
  }
  .row.empty svg { opacity: 0.85; }
  .row.empty .val { color: #6a6f96; font-size: 0.8rem; font-weight: normal; }

  /* ——— GOLDEN CHAMPION կնիքը. երևում է միայն ԲՈԼՈՐ գավաթները հավաքածին ——— */
  #champ[hidden] { display: none; }
  #champ {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    padding: 18px 30px;
    border: 3px solid rgba(255, 209, 102, 0.95);
    outline: 2px dashed rgba(255, 209, 102, 0.55);
    outline-offset: 6px;
    border-radius: 20px;
    background: rgba(255, 209, 102, 0.07);
    transform: rotate(-5deg);
    box-shadow: 0 0 46px rgba(255, 209, 102, 0.3), inset 0 0 26px rgba(255, 209, 102, 0.1);
    animation: stampIn 0.55s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  @keyframes stampIn {
    from { transform: rotate(-5deg) scale(2.4); opacity: 0; }
    to   { transform: rotate(-5deg) scale(1); opacity: 1; }
  }
  #champ img { width: 78px; height: 78px; border-radius: 14px; }
  #champ .ct {
    color: #ffd166;
    font-weight: bold;
    font-size: clamp(1rem, 4.5vw, 1.2rem);
    letter-spacing: 0.16em;
    white-space: nowrap;
  }
  #champ .cs { color: #cdd1ef; font-size: 0.82rem; text-align: center; }
</style>

<nav><a href="../">← Golden Games</a></nav>

<svg class="bigcup" viewBox="0 0 48 48" aria-hidden="true">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e0a415"/>
    </linearGradient>
  </defs>
  <path d="M14 25 Q6 24 6 15 Q6 11 10 11 L13 11" fill="none" stroke="#e8c04a" stroke-width="3.5"/>
  <path d="M34 25 Q42 24 42 15 Q42 11 38 11 L35 11" fill="none" stroke="#e8c04a" stroke-width="3.5"/>
  <path d="M12 8 L36 8 Q36 24 24 30 Q12 24 12 8 Z" fill="url(#tg)" stroke="#c98a12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17 12 Q17 20 21 24" fill="none" stroke="#fff3c4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <rect x="21.5" y="30" width="5" height="6" fill="#ffd166" stroke="#c98a12" stroke-width="1.2"/>
  <rect x="14.5" y="36" width="19" height="5.5" rx="2.2" fill="#ffd166" stroke="#c98a12" stroke-width="1.5"/>
</svg>

<h1>Golden Trophies 🏆</h1>
<p class="sub"></p>
<div class="count"></div>

<div id="champ" hidden>
  <img src="../logo-icon.png" alt="Golden Games">
  <div class="ct">GOLDEN CHAMPION</div>
  <div class="cs"></div>
</div>

<div class="list" id="list"></div>

<script>
// ——————————————————————————————————————
//  GOLDEN TROPHIES 🏆 — ռեկորդների սենյակը
//  Այստեղ հավաքված են քո լավագույն արդյունքները բոլոր խաղերից։
//  Ռեկորդները պահվում են հենց քո հեռախոսում, ոչ մի տեղ չեն ուղարկվում։
// ——————————————————————————————————————

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { champ: 'Հավաքել ես ԲՈԼՈՐ գավաթները', sub: 'Քո ռեկորդները բոլոր խաղերում', count: (n, m) => 'Գավաթներ՝ ' + n + '/' + m, none: 'դեռ չես խաղացել', u: { pt: ' միավոր', fl: ' հարկ', lvl: n => 'մակարդակ ' + n, tries: ' փորձով', chain: ' քայլ', num: ' թիվ', m: ' մ' } },
  ru: { champ: 'Ты собрал ВСЕ кубки', sub: 'Твои рекорды во всех играх', count: (n, m) => 'Кубки: ' + n + '/' + m, none: 'ещё не играл', u: { pt: ' очков', fl: ' этажей', lvl: n => 'уровень ' + n, tries: ' попыток', chain: ' шагов', num: ' чисел', m: ' м' } },
  en: { champ: 'You collected ALL the trophies', sub: 'Your best scores in every game', count: (n, m) => 'Trophies: ' + n + '/' + m, none: 'not played yet', u: { pt: ' points', fl: ' floors', lvl: n => 'level ' + n, tries: ' tries', chain: ' steps', num: ' numbers', m: ' m' } },
  es: { champ: '¡Tienes TODOS los trofeos!', sub: 'Tus récords en todos los juegos', count: (n, m) => 'Trofeos: ' + n + '/' + m, none: 'aún sin jugar', u: { pt: ' puntos', fl: ' pisos', lvl: n => 'nivel ' + n, tries: ' intentos', chain: ' pasos', num: ' números', m: ' m' } },
  fr: { champ: 'Tu as TOUS les trophées !', sub: 'Tes records dans tous les jeux', count: (n, m) => 'Trophées : ' + n + '/' + m, none: 'pas encore joué', u: { pt: ' points', fl: ' étages', lvl: n => 'niveau ' + n, tries: ' essais', chain: ' pas', num: ' nombres', m: ' m' } },
  de: { champ: 'Du hast ALLE Pokale!', sub: 'Deine Rekorde in allen Spielen', count: (n, m) => 'Pokale: ' + n + '/' + m, none: 'noch nicht gespielt', u: { pt: ' Punkte', fl: ' Etagen', lvl: n => 'Level ' + n, tries: ' Versuche', chain: ' Schritte', num: ' Zahlen', m: ' m' } },
  ja: { champ: 'トロフィーをぜんぶ集めた！', sub: 'ぜんぶのゲームのベスト記録', count: (n, m) => 'トロフィー：' + n + '/' + m, none: 'まだあそんでないよ', u: { pt: 'ポイント', fl: '階', lvl: n => 'レベル' + n, tries: '回', chain: 'ステップ', num: '個', m: ' m' } },
  zh: { champ: '集齐了所有奖杯！', sub: '你在所有游戏里的纪录', count: (n, m) => '奖杯：' + n + '/' + m, none: '还没玩过', u: { pt: '分', fl: '层', lvl: n => '第' + n + '关', tries: '次', chain: '步', num: '个', m: ' 米' } },
};
const T = TRL[ggLang] || TRL.hy;
document.querySelector('.sub').textContent = T.sub;

// Իրական անունները՝ ընտրված լեզվով
const REAL = {
  hy: ['Կատվիկ', 'Թռչնակը', 'Հրթիռը տիեզերքում', 'Ձկնորսություն', 'Աշտարակ', 'Խլուրդներ', 'Լաբիրինթոս', 'Մրցարշավ', 'Զույգեր', 'Կրկնիր ինձ', 'Թվերի որսորդ', 'Ռիթմի խաղ', '2048', 'Նինձյա ցատկ', 'Ոսկե հանք', 'Անցի՛ր ճանապարհը', 'Ոսկե փիսոն'],
  ru: ['Котик', 'Птичка', 'Ракета в космосе', 'Рыбалка', 'Башня', 'Кроты', 'Лабиринт', 'Гонка', 'Пары', 'Повтори за мной', 'Охотник за числами', 'Ритм-игра', '2048', 'Прыжки ниндзя', 'Золотая шахта', 'Перейди дорогу', 'Золотой котёнок'],
  en: ['Kitty', 'Birdie', 'Rocket in Space', 'Fishing', 'Tower', 'Moles', 'Maze', 'Race', 'Pairs', 'Repeat After Me', 'Number Hunter', 'Rhythm Game', '2048', 'Ninja Jump', 'Gold Mine', 'Cross the Road', 'Golden Kitten'],
  es: ['Gatito', 'Pajarito', 'Cohete', 'Pesca', 'Torre', 'Topos', 'Laberinto', 'Carrera', 'Parejas', 'Repite conmigo', 'Cazanúmeros', 'Juego de ritmo', '2048', 'Salto ninja', 'Mina de oro', 'Cruza la calle', 'Gatito dorado'],
  fr: ['Petit chat', 'Petit oiseau', 'Fusée', 'Pêche', 'Tour', 'Taupes', 'Labyrinthe', 'Course', 'Paires', 'Répète après moi', 'Chasseur de nombres', 'Jeu de rythme', '2048', 'Saut de ninja', 'Mine d’or', 'Traverse la route', 'Chaton doré'],
  de: ['Kätzchen', 'Vögelchen', 'Rakete', 'Angeln', 'Turm', 'Maulwürfe', 'Labyrinth', 'Rennen', 'Paare', 'Sprich mir nach', 'Zahlenjäger', 'Rhythmusspiel', '2048', 'Ninja-Sprung', 'Goldmine', 'Über die Straße', 'Goldenes Kätzchen'],
  ja: ['ネコちゃん', 'ことり', '宇宙ロケット', 'さかなつり', 'タワー', 'モグラたたき', 'めいろ', 'レース', 'ペアさがし', 'まねっこ', '数字ハンター', 'リズムゲーム', '2048', '忍者ジャンプ', '金鉱掘り', 'みちをわたろう', 'きんいろのこねこ'],
  zh: ['小猫咪', '小鸟', '太空火箭', '钓鱼', '高塔', '打地鼠', '迷宫', '赛车', '翻对对', '跟我学', '数字猎人', '节奏游戏', '2048', '忍者跳', '黄金矿工', '过马路', '金色小猫'],
};
const R = REAL[ggLang] || REAL.hy;

// Խաղերի ցուցակը. key-ն ռեկորդի պահեստի անունն է, fmt-ը՝ ինչպես ցույց տալ
const GAMES = [
  { name: 'Golden Cat', href: '../cat-jump/run/', key: 'cat-best', fmt: v => v + T.u.pt },
  { name: 'Golden Bird', href: '../cat-jump/bird/', key: 'aren-bird-best', fmt: v => v + T.u.pt },
  { name: 'Golden Rocket', href: '../rocket/', key: 'aren-rocket-best', fmt: v => v + T.u.pt },
  { name: 'Golden Fishing', href: '../fishing/', key: 'aren-fish-best', fmt: v => v + T.u.pt },
  { name: 'Golden Tower', href: '../tower/', key: 'aren-tower-best', fmt: v => v + T.u.fl },
  { name: 'Golden Moles', href: '../moles/', key: 'aren-moles-best', fmt: v => v + T.u.pt },
  { name: 'Golden Maze', href: '../maze/', key: 'aren-maze-max', fmt: v => T.u.lvl(v) + '/100' },
  { name: 'Golden Driver', href: '../city-drive/race/', key: 'aren-race-level', fmt: v => T.u.lvl(v) + '/10' },
  { name: 'Golden Memory', href: '../memory/pairs/', key: 'aren-memory-best', fmt: v => v + T.u.tries },
  { name: 'Golden Memory', href: '../memory/repeat/', key: 'aren-repeat-best', fmt: v => v + T.u.chain },
  { name: 'Golden Memory', href: '../memory/numbers/', key: 'aren-numbers-best', fmt: v => v + T.u.num },
  { name: 'Golden Beat', href: '../beat/', key: 'aren-beat-best', fmt: v => v + T.u.pt },
  { name: 'Golden 2048', href: '../2048/', key: 'aren-2048-best', fmt: v => v + T.u.pt },
  { name: 'Golden Ninja', href: '../ninja/', key: 'aren-ninja-best', fmt: v => v + T.u.m },
  { name: 'Golden Mine', href: '../mine/', key: 'aren-mine-best', fmt: v => T.u.lvl(v) },
  { name: 'Golden Men', href: '../men/', key: 'aren-men-best', fmt: v => v + T.u.chain },
  { name: 'Golden Pet', href: '../pet/', key: 'aren-pet-level', fmt: v => T.u.lvl(v) + '/5' },
];

// Փոքրիկ գավաթ ամեն տողի համար. ոսկե՝ ռեկորդ կա, մոխրագույն՝ դեռ չկա
function cupSVG(gold, i) {
  const fill = gold ? 'url(#g' + i + ')' : '#4a4f72';
  const edge = gold ? '#c98a12' : '#33356b';
  const grad = gold
    ? '<defs><linearGradient id="g' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e0a415"/></linearGradient></defs>'
    : '';
  return '<svg viewBox="0 0 48 48" aria-hidden="true">' + grad +
    '<path d="M14 25 Q6 24 6 15 Q6 11 10 11 L13 11" fill="none" stroke="' + (gold ? '#e8c04a' : '#3d426b') + '" stroke-width="3.5"/>' +
    '<path d="M34 25 Q42 24 42 15 Q42 11 38 11 L35 11" fill="none" stroke="' + (gold ? '#e8c04a' : '#3d426b') + '" stroke-width="3.5"/>' +
    '<path d="M12 8 L36 8 Q36 24 24 30 Q12 24 12 8 Z" fill="' + fill + '" stroke="' + edge + '" stroke-width="2" stroke-linejoin="round"/>' +
    '<rect x="21.5" y="30" width="5" height="6" fill="' + fill + '" stroke="' + edge + '" stroke-width="1.2"/>' +
    '<rect x="14.5" y="36" width="19" height="5.5" rx="2.2" fill="' + fill + '" stroke="' + edge + '" stroke-width="1.5"/>' +
    '</svg>';
}

const list = document.getElementById('list');
let wonCount = 0;

GAMES.forEach((g, i) => {
  let v = 0;
  try { v = Number(localStorage.getItem(g.key) || 0); } catch (e) {}
  const has = v > 0;
  if (has) wonCount++;

  const a = document.createElement('a');
  a.className = 'row ' + (has ? 'won' : 'empty');
  a.href = g.href;
  a.innerHTML = cupSVG(has, i) +
    '<div class="info"><h2>' + g.name + '</h2><div class="real">' + R[i] + '</div></div>' +
    '<div class="val">' + (has ? g.fmt(v) : T.none) + '</div>';
  list.appendChild(a);
});

document.querySelector('.count').textContent = T.count(wonCount, GAMES.length);

// Բոլո՞րն են հավաքված — GOLDEN CHAMPION կնիքը դրվում է 🏆
if (wonCount === GAMES.length) {
  document.getElementById('champ').hidden = false;
  document.querySelector('#champ .cs').textContent = T.champ;
}

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
