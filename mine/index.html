<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Mine ⛏️</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #191233;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
</style>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<canvas id="game"></canvas>

<script>
// ——————————————————————————————————————
//  GOLDEN MINE ⛏️ — կեռիկը ճոճվում է, դու ճիշտ պահին ես գցում
//  Ոսկին թանկ է, քարը՝ ծանր ու էժան, ադամանդը՝ գանձ։
//  Ամեն մակարդակում պիտի պլանը լրացնես, մինչև ժամանակը վերջանա։
// ——————————————————————————————————————

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { title: 'GOLDEN MINE', sub: 'Դիպչիր՝ կեռիկը գցելու', best: 'Ռեկորդ՝ մակարդակ ', lvl: 'Մակարդակ ', goal: 'Պլան՝ ', sec: ' վրկ', lvlDone: 'Պլանը լրացվա՜ծ է', over: 'Ժամանակը վերջացավ…', overSub: l => 'Հասար մակարդակ ' + l + ' · Դիպչիր՝ նորից', newRec: 'ՆՈՐ ՌԵԿՈՐԴ 🏆' },
  ru: { title: 'GOLDEN MINE', sub: 'Нажми, чтобы бросить крюк', best: 'Рекорд: уровень ', lvl: 'Уровень ', goal: 'План: ', sec: ' сек', lvlDone: 'План выполнен!', over: 'Время вышло…', overSub: l => 'Ты дошёл до уровня ' + l + ' · Нажми ещё раз', newRec: 'НОВЫЙ РЕКОРД 🏆' },
  en: { title: 'GOLDEN MINE', sub: 'Tap to drop the hook', best: 'Best: level ', lvl: 'Level ', goal: 'Goal: ', sec: ' s', lvlDone: 'Goal reached!', over: 'Time is up…', overSub: l => 'You reached level ' + l + ' · Tap to retry', newRec: 'NEW RECORD 🏆' },
  es: { title: 'GOLDEN MINE', sub: 'Toca para soltar el gancho', best: 'Récord: nivel ', lvl: 'Nivel ', goal: 'Meta: ', sec: ' s', lvlDone: '¡Meta cumplida!', over: 'Se acabó el tiempo…', overSub: l => 'Llegaste al nivel ' + l + ' · Toca para reintentar', newRec: '¡NUEVO RÉCORD! 🏆' },
  fr: { title: 'GOLDEN MINE', sub: 'Touche pour lancer le crochet', best: 'Record : niveau ', lvl: 'Niveau ', goal: 'Objectif : ', sec: ' s', lvlDone: 'Objectif atteint !', over: 'Temps écoulé…', overSub: l => 'Tu as atteint le niveau ' + l + ' · Touche pour réessayer', newRec: 'NOUVEAU RECORD 🏆' },
  de: { title: 'GOLDEN MINE', sub: 'Tippe, um den Haken zu werfen', best: 'Rekord: Level ', lvl: 'Level ', goal: 'Ziel: ', sec: ' s', lvlDone: 'Ziel erreicht!', over: 'Die Zeit ist um…', overSub: l => 'Du hast Level ' + l + ' erreicht · Tippe für nochmal', newRec: 'NEUER REKORD 🏆' },
  ja: { title: 'GOLDEN MINE', sub: 'タップでフックを落とす', best: 'ベスト：レベル', lvl: 'レベル ', goal: 'ノルマ：', sec: '秒', lvlDone: 'ノルマたっせい！', over: '時間切れ…', overSub: l => 'レベル' + l + 'までいったよ · タップでもう一回', newRec: '新記録 🏆' },
  zh: { title: 'GOLDEN MINE', sub: '点一下放下钩子', best: '纪录：第', lvl: '第', goal: '目标：', sec: '秒', lvlDone: '目标达成！', over: '时间到了…', overSub: l => '你到了第' + l + '关 · 点一下再来', newRec: '新纪录 🏆' },
};
const T = TRL[ggLang] || TRL.hy;
const LVL_SUFFIX = ggLang === 'zh' ? '关' : '';   // չիներենում «第N关» ձևն է

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = window.devicePixelRatio || 1;
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = innerWidth;
  H = innerHeight;
}
window.addEventListener('resize', resize);
resize();

const LEVEL_SECONDS = 40;

let state = 'menu';    // menu → play → lvlup → over
let level = 1;
let money = 0;
let goal = 0;
let items = [];        // { x, y, r, type, val, w, taken }
let ang = 0, angDir = 1;
let hook = { mode: 'swing', len: 0, item: null };   // swing → out → back
let timeLeft = 0;
let lastTick = 0;
let lvlupUntil = 0;
let endedAt = 0;
let popups = [];
let frame = 0;
let best = 0;
try { best = Number(localStorage.getItem('aren-mine-best') || 0); } catch (e) {}

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sThrow = () => tone(300, 0.1, 'square', 0.1);
const sGrab = () => tone(180, 0.12, 'square', 0.14);
const sGold = () => [660, 880, 1100].forEach((f, k) => tone(f, 0.1, 'triangle', 0.16, k * 0.06));
const sRock = () => tone(140, 0.18, 'sawtooth', 0.12);
const sLvl = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.2, 'triangle', 0.18, k * 0.11));
const sOver = () => [392, 330, 262, 196].forEach((f, k) => tone(f, 0.2, 'triangle', 0.15, k * 0.12));

// Պիվոտը՝ որտեղից կախված է կեռիկը
function px() { return W / 2; }
function py() { return H * 0.17; }
function maxLen() { return Math.hypot(W, H); }

// ——— Դաշտի ստեղծումը ———
function makeItem(type, minY, maxY) {
  const spec = {
    gold_s: { r: 10, val: 60, w: 1 },
    gold_m: { r: 16, val: 130, w: 2 },
    gold_b: { r: 25, val: 300, w: 4.2 },
    rock: { r: 15 + Math.random() * 6, val: 15, w: 3.4 },
    diamond: { r: 9, val: 450, w: 1 },
  }[type];
  for (let tries = 0; tries < 60; tries++) {
    const x = 30 + Math.random() * (W - 60);
    const y = minY + Math.random() * (maxY - minY);
    if (items.every(o => Math.hypot(o.x - x, o.y - y) > o.r + spec.r + 14)) {
      items.push({ x, y, r: spec.r, type, val: spec.val, w: spec.w, taken: false });
      return;
    }
  }
}

function makeField() {
  items = [];
  const top = H * 0.34, mid = H * 0.62, deep = H - 40;
  for (let i = 0; i < 4; i++) makeItem('gold_s', top, mid);
  for (let i = 0; i < 3; i++) makeItem('gold_m', mid - 40, deep);
  for (let i = 0; i < 1 + Math.min(2, Math.floor(level / 2)); i++) makeItem('gold_b', mid + 30, deep);
  for (let i = 0; i < 4; i++) makeItem('rock', top + 20, deep);
  if (level >= 2 || Math.random() < 0.5) makeItem('diamond', deep - 90, deep);
}

function startLevel() {
  makeField();
  goal += 400 + level * 100;
  timeLeft = LEVEL_SECONDS;
  lastTick = performance.now();
  hook = { mode: 'swing', len: 0, item: null };
  state = 'play';
}

function newGame() {
  level = 1;
  money = 0;
  goal = 0;
  popups = [];
  startLevel();
}

// ——— Հպումը ———
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'menu') { newGame(); return; }
  if (state === 'over') {
    if (Date.now() - endedAt < 1200) return;
    newGame();
    return;
  }
  if (state === 'play' && hook.mode === 'swing') {
    hook.mode = 'out';
    hook.len = 30;
    sThrow();
  }
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && state === 'play' && hook.mode === 'swing') { initAudio(); hook.mode = 'out'; hook.len = 30; sThrow(); }
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// ——— Նկարելը ———
function drawGold(o) {
  const g = ctx.createRadialGradient(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.2, o.x, o.y, o.r);
  g.addColorStop(0, '#ffe9a8');
  g.addColorStop(1, '#d9a112');
  ctx.fillStyle = g;
  ctx.beginPath();
  // ոսկու կտորը՝ մի քիչ անհարթ գնդիկ
  ctx.moveTo(o.x - o.r, o.y + o.r * 0.3);
  ctx.quadraticCurveTo(o.x - o.r * 1.1, o.y - o.r * 0.6, o.x - o.r * 0.3, o.y - o.r);
  ctx.quadraticCurveTo(o.x + o.r * 0.6, o.y - o.r * 1.2, o.x + o.r, o.y - o.r * 0.2);
  ctx.quadraticCurveTo(o.x + o.r * 1.1, o.y + o.r * 0.7, o.x + o.r * 0.3, o.y + o.r);
  ctx.quadraticCurveTo(o.x - o.r * 0.6, o.y + o.r * 1.1, o.x - o.r, o.y + o.r * 0.3);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(o.x - o.r * 0.35, o.y - o.r * 0.35, o.r * 0.22, 0, Math.PI * 2);
  ctx.fill();
}
function drawRock(o) {
  ctx.fillStyle = '#7a7f96';
  ctx.beginPath();
  ctx.moveTo(o.x - o.r, o.y + o.r * 0.4);
  ctx.lineTo(o.x - o.r * 0.5, o.y - o.r);
  ctx.lineTo(o.x + o.r * 0.6, o.y - o.r * 0.8);
  ctx.lineTo(o.x + o.r, o.y + o.r * 0.3);
  ctx.lineTo(o.x + o.r * 0.2, o.y + o.r);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.arc(o.x + o.r * 0.2, o.y, o.r * 0.3, 0, Math.PI * 2);
  ctx.fill();
}
function drawDiamond(o) {
  ctx.fillStyle = '#7ee8f0';
  ctx.beginPath();
  ctx.moveTo(o.x, o.y - o.r);
  ctx.lineTo(o.x + o.r, o.y - o.r * 0.2);
  ctx.lineTo(o.x, o.y + o.r * 1.2);
  ctx.lineTo(o.x - o.r, o.y - o.r * 0.2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c6f7fb';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function hookTip() {
  const a = Math.PI / 2 + ang;   // 0 = ուղիղ ներքև
  const L = hook.mode === 'swing' ? 46 : hook.len;
  return { x: px() + Math.cos(a) * L, y: py() + Math.sin(a) * L, a, L };
}

function drawText(txt, x, y, size, color, align) {
  ctx.fillStyle = color;
  ctx.font = 'bold ' + size + 'px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.fillText(txt, x, y);
}

// Փոքրիկ ոսկե մետաղադրամ HUD-ի համար (նկարած, ոչ էմոջի)
function drawCoin(x, y, r) {
  ctx.fillStyle = '#f0b429';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c98a12';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r - 2.5, 0, Math.PI * 2); ctx.stroke();
}

function update() {
  frame++;
  const now = performance.now();

  // երկինքն ու հողը
  ctx.fillStyle = '#241a45';
  ctx.fillRect(0, 0, W, H);
  const gg = ctx.createLinearGradient(0, H * 0.28, 0, H);
  gg.addColorStop(0, '#6b4a2a');
  gg.addColorStop(1, '#3a2410');
  ctx.fillStyle = gg;
  ctx.fillRect(0, H * 0.28, W, H);
  ctx.fillStyle = '#7fb84e';
  ctx.fillRect(0, H * 0.28 - 6, W, 8);

  if (state === 'play' || state === 'lvlup') {
    // ժամանակը
    if (state === 'play') {
      timeLeft -= (now - lastTick) / 1000;
      if (timeLeft <= 0) {
        timeLeft = 0;
        state = 'over';
        endedAt = Date.now();
        if (level > best) {
          best = level;
          try { localStorage.setItem('aren-mine-best', best); } catch (e) {}
        }
        sOver();
      }
    }
    lastTick = now;

    // կեռիկի շարժումը
    if (hook.mode === 'swing') {
      ang += angDir * (0.017 + level * 0.0012);
      if (ang > 1.25 || ang < -1.25) angDir *= -1;
    } else if (hook.mode === 'out') {
      hook.len += 9;
      const t = hookTip();
      for (const o of items) {
        if (o.taken) continue;
        if (Math.hypot(o.x - t.x, o.y - t.y) < o.r + 10) {
          o.taken = true;
          hook.item = o;
          hook.mode = 'back';
          sGrab();
          break;
        }
      }
      if (t.x < -30 || t.x > W + 30 || t.y > H + 30) hook.mode = 'back';
    } else if (hook.mode === 'back') {
      const w = hook.item ? hook.item.w : 0;
      hook.len -= 10 / (1 + w * 0.55);
      if (hook.len <= 46) {
        hook.len = 0;
        if (hook.item) {
          money += hook.item.val;
          const isGold = hook.item.type.startsWith('gold') || hook.item.type === 'diamond';
          (isGold ? sGold : sRock)();
          popups.push({ x: px(), y: py() + 30, text: '+' + hook.item.val, life: 45, color: isGold ? '#ffd166' : '#aab3c7' });
          items = items.filter(o => o !== hook.item);
          hook.item = null;

          if (money >= goal) {
            state = 'lvlup';
            lvlupUntil = Date.now() + 1500;
            sLvl();
          } else if (!items.some(o => o.type !== 'rock')) {
            makeField();   // ոսկին վերջացավ, բայց պլանը՝ ոչ. նոր հանք
          }
        }
        hook.mode = 'swing';
      }
    }

    if (state === 'lvlup' && Date.now() > lvlupUntil) {
      level++;
      startLevel();
    }
  }

  // իրերը
  for (const o of items) {
    if (o.taken && hook.item !== o) continue;
    let ox = o.x, oy = o.y;
    if (o === hook.item) {
      const t = hookTip();
      ox = t.x;
      oy = t.y + o.r + 6;
    }
    const tmp = { ...o, x: ox, y: oy };
    if (o.type === 'rock') drawRock(tmp);
    else if (o.type === 'diamond') drawDiamond(tmp);
    else drawGold(tmp);
  }

  // կեռիկն ու պարանը
  const t = hookTip();
  ctx.strokeStyle = '#5a4632';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px(), py());
  ctx.lineTo(t.x, t.y);
  ctx.stroke();
  // եռոտանին
  ctx.fillStyle = '#3d3560';
  ctx.beginPath();
  ctx.moveTo(px() - 26, py() - 4);
  ctx.lineTo(px(), py() - 34);
  ctx.lineTo(px() + 26, py() - 4);
  ctx.closePath();
  ctx.fill();
  // կեռիկի «ճանկերը»
  ctx.strokeStyle = '#c9c9dd';
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(t.x - 6, t.y + 4, 8, -0.4, 2.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(t.x + 6, t.y + 4, 8, Math.PI - 2.2, Math.PI + 0.4); ctx.stroke();

  // թռչող «+60» գրությունները
  for (const p of popups) {
    p.life--;
    p.y -= 1;
    ctx.globalAlpha = Math.min(1, p.life / 18);
    drawText(p.text, p.x, p.y, 20, p.color);
    ctx.globalAlpha = 1;
  }
  popups = popups.filter(p => p.life > 0);

  // ——— HUD ———
  if (state !== 'menu') {
    drawCoin(16, 96, 9);
    drawText(String(money) + ' / ' + goal, 32, 102, 18, '#ffd166', 'left');
    drawText(T.lvl + level + LVL_SUFFIX, W / 2, 66, 16, 'rgba(245,238,222,0.85)');
    drawText(Math.ceil(timeLeft) + T.sec, W - 14, 30, 18, timeLeft < 10 ? '#ff7b6b' : 'rgba(245,238,222,0.85)', 'right');
  }
  if (state === 'menu') {
    drawText(T.title, W / 2, H * 0.45, Math.min(46, W * 0.1), '#ffd76e');
    drawText(T.sub, W / 2, H * 0.45 + 40, 17, 'rgba(245,238,222,0.9)');
    if (best > 0) drawText(T.best + best + LVL_SUFFIX, W / 2, H * 0.45 + 72, 15, 'rgba(245,238,222,0.65)');
  }
  if (state === 'lvlup') {
    drawText(T.lvlDone, W / 2, H * 0.45, 30, '#6ee7b7');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(20, 15, 40, 0.75)';
    ctx.fillRect(0, 0, W, H);
    drawText(T.over, W / 2, H * 0.42, 28, '#ff7b6b');
    drawText(T.overSub(level), W / 2, H * 0.42 + 42, 17, 'rgba(245,238,222,0.9)');
    if (level === best && best > 0) drawText(T.newRec, W / 2, H * 0.42 + 76, 17, '#ffd166');
  }

  requestAnimationFrame(update);
}
update();
</script>
