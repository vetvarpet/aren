<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Չինգաչունգ ✊</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: #12122b;
  }

  .half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    text-align: center;
  }
  #top { background: #8f2d36; transform: rotate(180deg); }
  #bottom { background: #1e5a9e; }

  .score { font-size: clamp(1.6rem, 7vw, 2.6rem); font-weight: bold; color: #fff; }
  .msg { font-size: clamp(0.95rem, 4vw, 1.2rem); color: rgba(255,255,255,0.92); min-height: 2.4em; line-height: 1.3; }
  .big { font-size: clamp(2.6rem, 12vw, 4rem); min-height: 1.2em; }

  .picks { display: flex; gap: 12px; }
  .pick {
    width: clamp(58px, 18vw, 84px);
    height: clamp(58px, 18vw, 84px);
    border-radius: 18px;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    font-size: clamp(28px, 9vw, 42px);
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    font-family: inherit;
    color: #fff;
  }
  .pick:active { transform: scale(0.92); }
  .half.locked .pick { opacity: 0.35; pointer-events: none; }
  .half.locked .pick.mine { opacity: 1; background: #ffd166; border-color: #fff; }

  .divider { height: 8px; background: #12122b; flex-shrink: 0; }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../../" style="position:fixed;top:50%;left:10px;transform:translateY(-50%);z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>

<div class="half" id="top">
  <div class="score" id="scoreT">0</div>
  <div class="big" id="bigT"></div>
  <div class="msg" id="msgT"></div>
  <div class="picks">
    <button class="pick" data-p="rock">✊</button>
    <button class="pick" data-p="scissors">✌️</button>
    <button class="pick" data-p="paper">✋</button>
  </div>
</div>
<div class="divider"></div>
<div class="half" id="bottom">
  <div class="score" id="scoreB">0</div>
  <div class="big" id="bigB"></div>
  <div class="msg" id="msgB"></div>
  <div class="picks">
    <button class="pick" data-p="rock">✊</button>
    <button class="pick" data-p="scissors">✌️</button>
    <button class="pick" data-p="paper">✋</button>
  </div>
</div>

<script>
// ——————————————————————————————————————
//  ՉԻՆԳԱՉՈՒՆԳ ✊✌️✋ — քար, մկրատ, թուղթ երկու հոգու համար
//  Ամեն մեկը ԳԱՂՏՆԻ ընտրում է իր նշանը, հետո միասին բացվում է։
//  5 հաղթանակ հավաքողը չեմպիոն է 🏆
// ——————————————————————————————————————

const WIN_AT = 5;

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: {
    pickIt: 'Ընտրի՛ր նշանդ 🤫', ready: 'Պատրա՛ստ ✓ Սպասիր մյուսին…',
    chant: ['Չին…', 'Չին… գա…', 'Չին… գա… ՉՈՒՆԳ!'],
    win: 'Հաղթեցի՜ր +1', lose: 'Պարտվեցիր…', drawTxt: 'Ոչ-ոքի՜ Նորից',
    champ: n => '🏆 ' + n + ' ՀԱՂԹԵՑ։ Սեղմեք՝ ռևանշ',
    RED: 'ԿԱՐՄԻՐԸ', BLUE: 'ԿԱՊՈՒՅՏԸ',
  },
  ru: {
    pickIt: 'Выбери знак 🤫', ready: 'Готово ✓ Жди второго…',
    chant: ['Чин…', 'Чин… га…', 'Чин… га… ЧУНГ!'],
    win: 'Победа! +1', lose: 'Проиграл…', drawTxt: 'Ничья! Ещё раз',
    champ: n => '🏆 ' + n + ' ПОБЕДИЛ! Нажмите — реванш',
    RED: 'КРАСНЫЙ', BLUE: 'СИНИЙ',
  },
  en: {
    pickIt: 'Pick your sign 🤫', ready: 'Ready ✓ Wait for the other…',
    chant: ['Ching…', 'Ching… ga…', 'Ching… ga… CHUNG!'],
    win: 'You win! +1', lose: 'You lost…', drawTxt: 'Draw! Again',
    champ: n => '🏆 ' + n + ' WINS! Tap for a rematch',
    RED: 'RED', BLUE: 'BLUE',
  },
};
const T = TRL[ggLang] || TRL.hy;

const EMOJI = { rock: '✊', scissors: '✌️', paper: '✋' };
// Ո՞վ ում է հաղթում. քարը՝ մկրատին, մկրատը՝ թղթին, թուղթը՝ քարին
const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };

const halves = { top: document.getElementById('top'), bottom: document.getElementById('bottom') };
const el = id => document.getElementById(id);

let sT = 0, sB = 0;
let pickT = null, pickB = null;
let state = 'pick';   // pick → chant → reveal → end

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sPick = () => tone(500, 0.1);
const sChant = k => tone(400 + k * 150, 0.18, 'square', 0.18);
const sPoint = () => { tone(660, 0.12); tone(990, 0.18, 'triangle', 0.2, 0.1); };
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));

function updateScores() {
  el('scoreT').textContent = sT;
  el('scoreB').textContent = sB;
}

function newRound() {
  state = 'pick';
  pickT = pickB = null;
  for (const h of ['top', 'bottom']) {
    halves[h].classList.remove('locked');
    halves[h].querySelectorAll('.pick').forEach(b => b.classList.remove('mine'));
  }
  el('bigT').textContent = '';
  el('bigB').textContent = '';
  el('msgT').textContent = T.pickIt;
  el('msgB').textContent = T.pickIt;
}

function pick(who, val, btn) {
  if (state !== 'pick') return;
  initAudio();
  sPick();
  if (who === 'top') { if (pickT) return; pickT = val; }
  else { if (pickB) return; pickB = val; }
  halves[who].classList.add('locked');
  btn.classList.add('mine');
  el(who === 'top' ? 'msgT' : 'msgB').textContent = T.ready;
  if (pickT && pickB) chant();
}

// «Չին… գա… չունգ!» — երեք քայլ, հետո բացում ենք
function chant() {
  state = 'chant';
  T.chant.forEach((line, k) => {
    setTimeout(() => {
      el('msgT').textContent = line;
      el('msgB').textContent = line;
      sChant(k);
    }, k * 450);
  });
  setTimeout(reveal, T.chant.length * 450 + 200);
}

function reveal() {
  state = 'reveal';
  el('bigT').textContent = EMOJI[pickT] + ' — ' + EMOJI[pickB];
  el('bigB').textContent = EMOJI[pickB] + ' — ' + EMOJI[pickT];

  if (pickT === pickB) {
    el('msgT').textContent = T.drawTxt;
    el('msgB').textContent = T.drawTxt;
    tone(300, 0.3, 'sine', 0.15);
    setTimeout(newRound, 1600);
    return;
  }
  const topWins = BEATS[pickT] === pickB;
  if (topWins) sT++; else sB++;
  updateScores();
  sPoint();
  el('msgT').textContent = topWins ? T.win : T.lose;
  el('msgB').textContent = topWins ? T.lose : T.win;

  if (sT >= WIN_AT || sB >= WIN_AT) {
    setTimeout(() => {
      state = 'end';
      const name = sT >= WIN_AT ? T.RED : T.BLUE;
      el('msgT').textContent = T.champ(name);
      el('msgB').textContent = T.champ(name);
      sWin();
      confetti();
    }, 1200);
  } else {
    setTimeout(newRound, 1800);
  }
}

document.querySelectorAll('.half').forEach(h => {
  h.querySelectorAll('.pick').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pick(h.id, btn.dataset.p, btn);
    });
  });
  // խաղն ավարտվել է՝ ցանկացած սեղմումով նոր մենամարտ
  h.addEventListener('pointerdown', () => {
    if (state === 'end') {
      sT = 0; sB = 0;
      updateScores();
      newRound();
    }
  });
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

function confetti() {
  const stuff = ['🎉', '⭐', '✊', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

updateScores();
newRound();
</script>
