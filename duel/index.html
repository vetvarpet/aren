<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Մենամարտ ⚡</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: #12122b;
  }

  /* Երկու խաղադաշտ. վերևինը շրջված է, որ դիմացի ընկերը կարդա */
  .half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s;
    padding: 20px;
    text-align: center;
  }
  #top { background: #8f2d36; transform: rotate(180deg); }
  #bottom { background: #1e5a9e; }
  body.go #top, body.go #bottom { background: #1f9d55; }

  .score { font-size: clamp(2rem, 9vw, 3.4rem); font-weight: bold; color: #fff; }
  .msg { font-size: clamp(1rem, 4.5vw, 1.4rem); color: rgba(255,255,255,0.92); min-height: 2.6em; line-height: 1.3; }

  .divider {
    height: 8px;
    background: #12122b;
    flex-shrink: 0;
  }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<div class="half" id="top">
  <div class="score" id="scoreT">0</div>
  <div class="msg" id="msgT"></div>
</div>
<div class="divider"></div>
<div class="half" id="bottom">
  <div class="score" id="scoreB">0</div>
  <div class="msg" id="msgB"></div>
</div>

<script>
// ——————————————————————————————————————
//  ՄԵՆԱՄԱՐՏ ⚡ — խաղ երկու հոգու համար՝ ՄԵԿ հեռախոսով
//  Դիր հեռախոսը սեղանին. մեկը կարմիրն է, մյուսը՝ կապույտը։
//  Երբ էկրանը ԿԱՆԱՉԻ՝ սեղմիր քո կեսը։ Ով առաջինը՝ նա միավոր։
//  Ով շտապի կանաչից առաջ՝ միավորը հակառակորդինն է 😈
// ——————————————————————————————————————

const WIN_AT = 5;   // այսքան միավոր հավաքողը հաղթում է

const topEl = document.getElementById('top');
const botEl = document.getElementById('bottom');
const scoreT = document.getElementById('scoreT');
const scoreB = document.getElementById('scoreB');
const msgT = document.getElementById('msgT');
const msgB = document.getElementById('msgB');

let state = 'menu';   // menu → wait → go → pause → end
let sT = 0, sB = 0;   // միավորները
let goTime = 0;
let goTimer = null;

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sGo = () => tone(880, 0.2, 'square', 0.25);
const sPoint = () => { tone(660, 0.12); tone(990, 0.18, 'triangle', 0.2, 0.1); };
const sFoul = () => tone(140, 0.5, 'sawtooth', 0.25);
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));

// Երկու էկրանին միաժամանակ գրելը
function say(text) {
  msgT.textContent = text;
  msgB.textContent = text;
}
function updateScores() {
  scoreT.textContent = sT;
  scoreB.textContent = sB;
}

function menu() {
  state = 'menu';
  sT = 0; sB = 0;
  updateScores();
  say('Կարմիր ընդդեմ կապույտի․ ո՞վ է ավելի արագ։ Սեղմեք՝ սկսելու');
}

function startRound() {
  state = 'wait';
  document.body.classList.remove('go');
  say('Սպասե՛ք կանաչին… 🤫');
  clearTimeout(goTimer);
  // 1.5-4 վայրկյան անկանխատեսելի սպասում. մի՛ շտապիր
  goTimer = setTimeout(() => {
    state = 'go';
    goTime = performance.now();
    document.body.classList.add('go');
    say('ՀԻՄԱ՛ ⚡');
    sGo();
  }, 1500 + Math.random() * 2500);
}

function roundWon(who, reactionMs) {
  if (who === 'top') sT++; else sB++;
  updateScores();
  document.body.classList.remove('go');
  state = 'pause';

  const name = who === 'top' ? 'Կարմիրը' : 'Կապույտը';
  if (reactionMs !== undefined) {
    say(name + ' վերցրեց միավորը՝ ' + (reactionMs / 1000).toFixed(3) + ' վրկ ⚡');
    sPoint();
  }

  if (sT >= WIN_AT || sB >= WIN_AT) {
    setTimeout(() => finish(sT >= WIN_AT ? 'top' : 'bottom'), 900);
  } else {
    setTimeout(startRound, 1600);
  }
}

function foul(who) {
  // շտապեցիր՝ միավորը հակառակորդինն է
  sFoul();
  const name = who === 'top' ? 'Կարմիրը' : 'Կապույտը';
  clearTimeout(goTimer);
  document.body.classList.remove('go');
  state = 'pause';
  if (who === 'top') sB++; else sT++;
  updateScores();
  say(name + ' շտապե՜ց 😅 Միավորը՝ մյուսին');

  if (sT >= WIN_AT || sB >= WIN_AT) {
    setTimeout(() => finish(sT >= WIN_AT ? 'top' : 'bottom'), 900);
  } else {
    setTimeout(startRound, 1600);
  }
}

function finish(winner) {
  state = 'end';
  const name = winner === 'top' ? 'ԿԱՐՄԻՐԸ' : 'ԿԱՊՈՒՅՏԸ';
  say('🏆 ' + name + ' ՀԱՂԹԵՑ ' + sT + ':' + sB + '։ Սեղմեք՝ նոր մենամարտ');
  sWin();
  confetti();
}

function press(who) {
  initAudio();
  if (state === 'menu' || state === 'end') { menu(); startRound(); return; }
  if (state === 'wait') { foul(who); return; }
  if (state === 'go') { roundWon(who, performance.now() - goTime); return; }
  // pause՝ ոչինչ չենք անում, հանգիստ շունչ քաշեք
}

topEl.addEventListener('pointerdown', (e) => { e.preventDefault(); press('top'); });
botEl.addEventListener('pointerdown', (e) => { e.preventDefault(); press('bottom'); });

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

function confetti() {
  const stuff = ['🎉', '⭐', '⚡', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

menu();
</script>
