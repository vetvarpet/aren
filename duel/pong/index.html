<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Պինգ-պոնգ 🏓</title>
<link rel="icon" type="image/png" href="../../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #12122b; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../../" style="position:fixed;top:50%;left:10px;transform:translateY(-50%);z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>
<canvas id="game"></canvas>

<script>
// ——————————————————————————————————————
//  ՊԻՆԳ-ՊՈՆԳ 🏓 — երկու հոգու համար՝ ՄԵԿ հեռախոսով
//  Ամեն մեկը մատով շարժում է ԻՐ ռակետկան (վերևինը՝ կարմիր, ներքևինը՝ կապույտ)։
//  Գնդակը քո կողմից անցա՞վ — միավորը մյուսինն է։ 5 միավոր = հաղթանակ։
// ——————————————————————————————————————

const WIN_AT = 5;

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { tap: 'Սեղմեք՝ սկսելու', champ: n => n + ' ՀԱՂԹԵՑ', again: 'Սեղմեք՝ ռևանշ', RED: 'ԿԱՐՄԻՐԸ', BLUE: 'ԿԱՊՈՒՅՏԸ' },
  ru: { tap: 'Нажмите, чтобы начать', champ: n => n + ' ПОБЕДИЛ', again: 'Нажмите — реванш', RED: 'КРАСНЫЙ', BLUE: 'СИНИЙ' },
  en: { tap: 'Tap to start', champ: n => n + ' WINS', again: 'Tap for a rematch', RED: 'RED', BLUE: 'BLUE' },
};
const T = TRL[ggLang] || TRL.hy;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sPaddle = () => tone(600, 0.07, 'square', 0.15);
const sWall = () => tone(350, 0.06, 'square', 0.1);
const sGoal = () => tone(200, 0.4, 'sawtooth', 0.2);
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));

// ——— Խաղի վիճակը ———
const PW = () => Math.min(110, W * 0.28);   // ռակետկայի լայնությունը
const PH = 14;
const paddles = { top: { x: 0 }, bottom: { x: 0 } };
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 9 };
let sT = 0, sB = 0;
let state = 'ready';   // ready → rally → end
let serveDir = 1;      // 1 = ներքև (կապույտի կողմ), -1 = վերև
let frame = 0;

function resetPositions() {
  paddles.top.x = W / 2;
  paddles.bottom.x = W / 2;
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = 0;
  ball.vy = 0;
}
resetPositions();

function serve() {
  state = 'rally';
  ball.x = W / 2;
  ball.y = H / 2;
  const a = (Math.random() * 0.6 - 0.3);   // թեթև անկյուն
  const sp = Math.max(4.5, H * 0.007);
  ball.vx = Math.sin(a) * sp * 1.2;
  ball.vy = Math.cos(a) * sp * serveDir;
}

// ——— Կառավարումը. ամեն մատ շարժում է ԻՐ կեսի ռակետկան ———
function steer(e) {
  const half = e.clientY < H / 2 ? 'top' : 'bottom';
  paddles[half].x = Math.max(PW() / 2, Math.min(W - PW() / 2, e.clientX));
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'ready') { serve(); return; }
  if (state === 'end') { sT = 0; sB = 0; state = 'ready'; resetPositions(); return; }
  steer(e);
});
canvas.addEventListener('pointermove', (e) => { e.preventDefault(); steer(e); });
canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// ——— Խաղի քայլը ———
function update() {
  frame++;
  if (state !== 'rally') return;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // կողային պատերից ցատկում է
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; sWall(); }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; sWall(); }

  // ռակետկաները
  const topY = 58, botY = H - 58;
  if (ball.vy < 0 && ball.y - ball.r < topY + PH / 2 && ball.y - ball.r > topY - PH &&
      Math.abs(ball.x - paddles.top.x) < PW() / 2 + ball.r) {
    ball.y = topY + PH / 2 + ball.r;
    bounce(paddles.top.x);
  }
  if (ball.vy > 0 && ball.y + ball.r > botY - PH / 2 && ball.y + ball.r < botY + PH &&
      Math.abs(ball.x - paddles.bottom.x) < PW() / 2 + ball.r) {
    ball.y = botY - PH / 2 - ball.r;
    bounce(paddles.bottom.x);
  }

  // գո՜լ
  if (ball.y < -30) { score('bottom'); }
  if (ball.y > H + 30) { score('top'); }
}

// Ռակետկայից ցատկելիս ուղղությունը կախված է, թե որտեղով դիպար
function bounce(px) {
  ball.vy *= -1;
  ball.vx += (ball.x - px) * 0.06;
  // ամեն հարվածից գնդակը մի քիչ արագանում է
  const sp = Math.hypot(ball.vx, ball.vy);
  const cap = Math.max(11, H * 0.014);
  if (sp < cap) { ball.vx *= 1.05; ball.vy *= 1.05; }
  sPaddle();
}

function score(who) {
  sGoal();
  if (who === 'top') { sT++; serveDir = 1; } else { sB++; serveDir = -1; }
  if (sT >= WIN_AT || sB >= WIN_AT) {
    state = 'end';
    sWin();
    confetti();
  } else {
    state = 'ready';
    resetPositions();
  }
}

// ——— Նկարելը ———
function drawTextBoth(text, color, dy, font) {
  // նույն տեքստը երկու խաղացողի համար՝ ամեն մեկն իր կողմից կարդա
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.fillText(text, W / 2, H / 2 + dy);
  ctx.save();
  ctx.translate(W / 2, H / 2 - dy);
  ctx.rotate(Math.PI);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function draw() {
  // դաշտը՝ երկու գույնի կեսեր
  ctx.fillStyle = '#5e222b';
  ctx.fillRect(0, 0, W, H / 2);
  ctx.fillStyle = '#173f6e';
  ctx.fillRect(0, H / 2, W, H / 2);

  // մեջտեղի գիծը
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 14]);
  ctx.beginPath();
  ctx.moveTo(0, H / 2);
  ctx.lineTo(W, H / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // հաշիվը՝ ամեն կեսի եզրին, իր խաղացողի կողմով
  ctx.font = 'bold 44px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(W - 44, H / 2 - 56);
  ctx.rotate(Math.PI);
  ctx.fillText(sT, 0, 0);
  ctx.restore();
  ctx.fillText(sB, W - 44, H / 2 + 72);

  // ռակետկաները
  ctx.fillStyle = '#ff7b6b';
  ctx.beginPath(); ctx.roundRect(paddles.top.x - PW() / 2, 58 - PH / 2, PW(), PH, 7); ctx.fill();
  ctx.fillStyle = '#6ec5ff';
  ctx.beginPath(); ctx.roundRect(paddles.bottom.x - PW() / 2, H - 58 - PH / 2, PW(), PH, 7); ctx.fill();

  // գնդակը
  if (state !== 'end') {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const midFont = 'bold ' + Math.min(22, W * 0.05) + 'px "Noto Sans Armenian", Arial, sans-serif';
  if (state === 'ready') {
    drawTextBoth(T.tap, '#6ee7b7', 60, midFont);
  } else if (state === 'end') {
    const name = sT >= WIN_AT ? T.RED : T.BLUE;
    drawTextBoth(T.champ(name) + ' ' + sT + ':' + sB, '#ffd166', 46, midFont);
    drawTextBoth(T.again, '#6ee7b7', 90, midFont);
  }
}

function confetti() {
  const stuff = ['🎉', '⭐', '🏓', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
