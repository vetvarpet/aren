<style>
  :root { --bg:#12122b; --card:#1d1d3f; --ink:#eef0ff; --dim:#9a9ec7; --accent:#ffd166; --accent2:#6ee7b7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, Helvetica, sans-serif;
    padding: 56px 14px 34px; min-height: 100vh; touch-action: manipulation; }
  .back { position: fixed; top: 10px; left: 10px; z-index: 30; color: var(--ink); text-decoration: none;
    background: rgba(20,26,34,0.8); border: 2px solid rgba(255,255,255,0.4);
    padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 3px; font-size: 1.3rem; color: var(--accent); text-align: center; }
  .sub { margin: 0 0 14px; font-size: 0.76rem; color: var(--dim); text-align: center; line-height: 1.5; }

  .box { background: var(--card); border: 2px solid #33356b; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .box.join { border-color: var(--accent); }
  .box h2 { margin: 0 0 6px; font-size: 1rem; color: var(--accent); }
  .box p { margin: 0 0 8px; font-size: 0.8rem; line-height: 1.55; color: var(--ink); }
  .rules { margin: 6px 0 10px; padding: 0 0 0 18px; font-size: 0.74rem; color: var(--dim); line-height: 1.6; }
  input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid #33356b;
    background: #0d0d22; color: var(--ink); font-family: inherit; font-size: 1rem; }
  button { width: 100%; margin-top: 9px; padding: 12px; border-radius: 12px; border: none;
    background: var(--accent); color: #2e2410; font-family: inherit; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
  button.ghost { background: transparent; color: var(--dim); border: 2px solid #33356b; font-weight: normal; font-size: 0.8rem; }
  button:active { transform: scale(0.98); }
  .msg { margin-top: 8px; font-size: 0.78rem; line-height: 1.5; }
  .msg.bad { color: #ff9a8a; }
  .msg.good { color: var(--accent2); }
  .me { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.82rem; }
  .me b { color: var(--accent); }

  select { width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid #33356b;
    background: #0d0d22; color: var(--ink); font-family: inherit; font-size: 0.95rem; }
  ol.board { list-style: none; margin: 10px 0 0; padding: 0; }
  ol.board li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center;
    padding: 9px 10px; border-radius: 11px; margin-bottom: 6px; background: #15152f; font-size: 0.88rem; }
  ol.board li.mine { background: rgba(255,209,102,0.16); border: 1px solid rgba(255,209,102,0.5); }
  ol.board .r { font-weight: bold; color: var(--dim); text-align: center; }
  ol.board li:nth-child(1) .r { color: #ffd166; } ol.board li:nth-child(2) .r { color: #d8dbe8; } ol.board li:nth-child(3) .r { color: #e0a06a; }
  ol.board .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.board .s { font-weight: bold; }
  .empty { text-align: center; color: var(--dim); font-size: 0.82rem; padding: 14px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>

        offline:'სერვერს ვერ მივწვდი. ისევ ვცდი.', loading:'იტვირთება…', empty:'აქ ჯერ არავინაა. იყავი პირველი 🏆', me:'შენ' },
  hi: { t:'🌍 विश्व रिकॉर्ड', s:'हर खेल के सबसे अच्छे, पूरी दुनिया से',
        joinT:'टेबल में आओ', joinP:'जुड़ने के बाद तुम्हारे रिकॉर्ड चुने हुए नाम से अपने आप टेबल में जाएँगे। उससे पहले कुछ नहीं भेजा जाता।',
        rules:['उपनाम या सरनेम — चलेगा','उम्र, स्कूल, पता, फ़ोन, ईमेल — नहीं','एक मिनट में एक रिकॉर्ड, सिर्फ़ सबसे अच्छा'],
        name:'तुम्हारा नाम', joinBtn:'🌍 जुड़ो', joining:'जुड़ रहा है…', you:n=>'तुम टेबल में <b>'+n+'</b> नाम से हो',
        pend:n=>'भेजने के इंतज़ार में: '+n+' (एक मिनट में एक)', allSent:'तुम्हारे सारे रिकॉर्ड भेज दिए ✓',
        leave:'भेजना बंद करो', left:'अब नहीं भेजा जाता। जो पहले से है उसे हटाने के लिए निदेशक से कहो।',
        badName:'यह नाम नियमों में नहीं आता। दूसरा चुनो।', noAnon:'सर्वर अभी तैयार नहीं है। बाद में कोशिश करो।',
        offline:'सर्वर तक नहीं पहुँचा। फिर कोशिश करूँगा।', loading:'लोड हो रहा है…', empty:'अभी कोई नहीं। पहले बनो 🏆', me:'तुम' }
};
const T = TRL[ggLang] || TRL.hy;
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function paintMe() {
  const c = window.ggCloud;
  const joined = c && c.on();
  // Անունը չանցա՞վ — ձևը նորից բացում ենք, որ ուրիշը ընտրի
  if (joined && c.status() === 'bad-name') {
    $('joinBox').hidden = false;
    $('meBox').hidden = true;
    if (document.activeElement !== $('nameIn')) $('nameIn').value = lsGet('gg-name') || '';
    $('joinMsg').className = 'msg bad';
    $('joinMsg').textContent = T.badName;
    return;
  }
  $('joinBox').hidden = !!joined;
  $('meBox').hidden = !joined;
  if (!joined) { if (document.activeElement !== $('nameIn')) $('nameIn').value = lsGet('gg-name') || ''; return; }
  $('meTxt').innerHTML = T.you(esc(lsGet('gg-name') || ''));
  const st = c.status(), n = c.pending();
  const m = $('meMsg');
  m.className = 'msg';
  if (st === 'bad-name') { m.textContent = T.badName; m.className = 'msg bad'; }
  else if (st === 'no-anon') { m.textContent = T.noAnon; m.className = 'msg bad'; }
  else if (st === 'offline') { m.textContent = T.offline; m.className = 'msg bad'; }
  else if (n > 0) m.textContent = T.pend(n);
  else { m.textContent = T.allSent; m.className = 'msg good'; }
}

function loadBoard() {
  const key = $('pick').value;
  try { localStorage.setItem('gg-world-pick', key); } catch (e) {}
  $('board').innerHTML = '';
  $('empty').hidden = false;
  $('empty').textContent = T.loading;
  if (!window.ggCloud) return;
  ggCloud.top(key, 20).then(rows => {
    if (!Array.isArray(rows) || !rows.length) { $('empty').textContent = T.empty; return; }
    $('empty').hidden = true;
    $('board').innerHTML = rows.map(r =>
      '<li class="' + (r.mine ? 'mine' : '') + '"><span class="r">' + r.rank + '</span>' +
      '<span class="n">' + esc(r.name) + (r.mine ? ' · ' + T.me : '') + '</span>' +
      '<span class="s">' + r.score + '</span></li>').join('');
  }).catch(() => { $('empty').textContent = T.offline; });
}

$('h1').textContent = T.t;
$('sub').textContent = T.s;
$('joinT').textContent = T.joinT;
$('joinP').textContent = T.joinP;
$('rules').innerHTML = T.rules.map(r => '<li>' + esc(r) + '</li>').join('');
$('nameIn').placeholder = T.name;
$('joinBtn').textContent = T.joinBtn;
$('leaveBtn').textContent = T.leave;
$('pick').innerHTML = BOARDS.map(([k, n]) => '<option value="' + k + '">' + esc(n) + '</option>').join('');

$('joinBtn').addEventListener('click', () => {
  const name = $('nameIn').value.trim();
  if (!name || !window.ggCloud) return;
  $('joinBtn').disabled = true;
  $('joinMsg').className = 'msg'; $('joinMsg').textContent = T.joining;
  ggCloud.join(name).then(() => {
    $('joinMsg').textContent = '';
    paintMe(); loadBoard();
  }).catch(e => {
    try { localStorage.setItem('gg-cloud-on', '0'); } catch (x) {}
    $('joinMsg').className = 'msg bad';
    $('joinMsg').textContent = /anonymous/i.test((e && e.message) || '') ? T.noAnon : T.offline;
  }).then(() => { $('joinBtn').disabled = false; });
});
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('leaveBtn').addEventListener('click', () => {
  if (window.ggCloud) ggCloud.leave();
  paintMe();
  $('joinMsg').className = 'msg'; $('joinMsg').textContent = T.left;
});
$('pick').addEventListener('change', loadBoard);

function boot() {
  const saved = lsGet('gg-world-pick');
  if (saved && BOARDS.some(b => b[0] === saved)) $('pick').value = saved;
  paintMe(); loadBoard();
  setInterval(paintMe, 5000);
}
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot); else boot();

let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
