<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Քաղաքի վարորդը 🚗</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    min-height: 100dvh;
    padding: 18px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  nav { position: fixed; top: 14px; left: 14px; }
  nav a {
    color: #f5eede;
    text-decoration: none;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  h1 { font-size: clamp(1.3rem, 5vw, 2rem); color: #ffd76e; text-align: center; }
  .sub { color: #9a9ec7; text-align: center; }

  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(92vw, 420px);
  }
  .g {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1d1d3f;
    border: 2px solid #33356b;
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: #f5eede;
    transition: transform 0.12s, border-color 0.12s;
  }
  .g:hover { transform: translateY(-3px); border-color: #ffd76e; }
  .g .ico {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    flex-shrink: 0;
  }
  .g1 .ico { background: linear-gradient(135deg, #2f855a, #9ae6b4); }
  .g2 .ico { background: linear-gradient(135deg, #7a1f1f, #e8e8e8); }
  .g h2 { font-size: 1.05rem; }
  .g p { color: #9a9ec7; font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
</style>

<nav><a href="../">← Golden Games</a></nav>

<h1>Քաղաքի վարորդը 🚗</h1>
<p class="sub">Ընտրի՛ր՝ ինչ ես ուզում քշել այսօր։</p>

<div class="games">
  <a class="g g1" href="./city/">
    <div class="ico">🍕</div>
    <div><h2>Քաղաք</h2><p>Պիցցայի առաքումներ, ոստիկան, խանութ ու ոսկե մեքենա 👑</p></div>
  </a>
  <a class="g g2" href="./race/">
    <div class="ico">🏁</div>
    <div><h2>Մրցարշավ</h2><p>10 մակարդակ, դու ես գազ տալիս, յուղ ու պատնեշներ ճանապարհին</p></div>
  </a>
</div>

<script>

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  ru: { h1: 'Городской водитель 🚗', sub: 'Выбери, что хочешь водить сегодня.', g1: ['Город', 'Доставка пиццы, полиция, магазин и золотая машина 👑'], g2: ['Гонка', '10 уровней, газ жмёшь ты, на дороге масло и барьеры'] },
  en: { h1: 'City Driver 🚗', sub: 'Choose what you want to drive today.', g1: ['City', 'Pizza deliveries, police, the shop and the golden car 👑'], g2: ['Race', '10 levels, you control the gas, oil and barriers on the road'] },
};
const T = TRL[ggLang];
if (T) {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.sub').textContent = T.sub;
  [['g1', '.g1'], ['g2', '.g2']].forEach(([k, sel]) => {
    document.querySelector(sel + ' h2').textContent = T[k][0];
    document.querySelector(sel + ' p').textContent = T[k][1];
  });
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
