<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Քաղաքի վարորդը 🚗</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100dvh;
    padding: 72px 18px 28px;   /* վերևից տեղ ենք թողնում «← Golden Games»-ի համար */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  nav { position: fixed; top: 14px; left: 14px; }
  nav a {
    color: #f5eede;
    text-decoration: none;
    background: #3d3560;
    border: 2px solid #6a5f9e;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  h1 { font-size: clamp(1.3rem, 5vw, 2rem); color: #ffd76e; text-align: center; }
  .sub { color: #9a9ec7; text-align: center; }

  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(92vw, 420px);
  }
  .g {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1d1d3f;
    border: 2px solid #33356b;
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: #f5eede;
    transition: transform 0.12s, border-color 0.12s;
  }
  .g:hover { transform: translateY(-3px); border-color: #ffd76e; }
  .g .ico {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    flex-shrink: 0;
  }
  .g1 .ico { background: linear-gradient(135deg, #2f855a, #9ae6b4); }
  .g2 .ico { background: linear-gradient(135deg, #7a1f1f, #e8e8e8); }
  .g .ico svg { width: 78%; height: 78%; display: block; }
  .g h2 { font-size: 1.05rem; }
  .g p { color: #9a9ec7; font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
</style>

<nav><a href="../">← Golden Games</a></nav>

<h1>Քաղաքի վարորդը 🚗</h1>
<p class="sub">Ընտրի՛ր՝ ինչ ես ուզում քշել այսօր։</p>

<div class="games">
  <a class="g g1" href="./city/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M9 10 Q24 4 39 10 L37 17 Q24 12 11 17 Z" fill="#c96f2e"/>
      <path d="M11 17 Q24 12 37 17 L24 43 Z" fill="#f6c453"/>
      <circle cx="20" cy="22" r="3" fill="#e63946"/>
      <circle cx="29" cy="23" r="3" fill="#e63946"/>
      <circle cx="24" cy="31" r="3" fill="#e63946"/>
    </svg></div>
    <div><h2>Քաղաք</h2><p>Պիցցայի առաքումներ, ոստիկան, խանութ ու ոսկե մեքենա 👑</p></div>
  </a>
  <a class="g g2" href="./race/">
    <div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="11" y="5" width="3.5" height="38" rx="1.7" fill="#5a4632"/>
      <path d="M14.5 7 Q22.5 4 30.5 7 T46.5 7 L44.5 23 Q36.5 20 28.5 23 T14.5 23 Z" fill="#ffffff" stroke="#232733" stroke-width="1.5"/>
      <g fill="#232733">
        <rect x="16" y="8.5" width="7" height="6.5"/><rect x="30" y="8.5" width="7" height="6.5"/>
        <rect x="23" y="15" width="7" height="6.5"/><rect x="37" y="15" width="6" height="6.5"/>
      </g>
    </svg></div>
    <div><h2>Մրցարշավ</h2><p>10 մակարդակ, դու ես գազ տալիս, յուղ ու պատնեշներ ճանապարհին</p></div>
  </a>
</div>

<script>

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  ru: { h1: 'Городской водитель 🚗', sub: 'Выбери, что хочешь водить сегодня.', g1: ['Город', 'Доставка пиццы, полиция, магазин и золотая машина 👑'], g2: ['Гонка', '10 уровней, газ жмёшь ты, на дороге масло и барьеры'] },
  en: { h1: 'City Driver 🚗', sub: 'Choose what you want to drive today.', g1: ['City', 'Pizza deliveries, police, the shop and the golden car 👑'], g2: ['Race', '10 levels, you control the gas, oil and barriers on the road'] },
  es: { h1: 'Conductor urbano 🚗', sub: 'Elige qué quieres conducir hoy.', g1: ['Ciudad', 'Reparte pizzas, esquiva a la policía, visita la tienda y gana el coche dorado 👑'], g2: ['Carrera', '10 niveles, tú das el gas, aceite y barreras en el camino'] },
  fr: { h1: 'Pilote de la ville 🚗', sub: 'Choisis ce que tu veux conduire aujourd’hui.', g1: ['Ville', 'Livraisons de pizza, police, magasin et voiture en or 👑'], g2: ['Course', '10 niveaux, c’est toi qui accélères, huile et barrières sur la route'] },
  de: { h1: 'Stadtfahrer 🚗', sub: 'Wähle, was du heute fahren willst.', g1: ['Stadt', 'Pizza liefern, Polizei, Laden und das goldene Auto 👑'], g2: ['Rennen', '10 Level, du gibst Gas, Öl und Hindernisse auf der Strecke'] },
  ja: { h1: 'シティドライバー 🚗', sub: '今日はどっちで走る？', g1: ['シティ', 'ピザ配達、パトカー、お店、金ピカの車 👑'], g2: ['レース', '10レベル、アクセルは自分で、オイルとバリアに注意'] },
  zh: { h1: '城市司机 🚗', sub: '选一个今天想开的吧。', g1: ['城市', '送披萨、躲警车、逛商店、赢黄金跑车 👑'], g2: ['赛车', '10个关卡，油门自己踩，小心油渍和路障'] },
};
const T = TRL[ggLang];
if (T) {
  document.querySelector('h1').textContent = T.h1;
  document.querySelector('.sub').textContent = T.sub;
  [['g1', '.g1'], ['g2', '.g2']].forEach(([k, sel]) => {
    document.querySelector(sel + ' h2').textContent = T[k][0];
    document.querySelector(sel + ' p').textContent = T[k][1];
  });
}

// Կրկնակի արագ հպումը հեռախոսում էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
