  ru: { hud: (p, l) => 'Место ' + p + '/4 · Ур. ' + l + '/10', words: ['', 'ПЕРВОЕ МЕСТО', 'Второе место', 'Третье место', 'Четвёртое место'], champ: 'ТЫ ЧЕМПИОН — 10 уровней', unlocked: l => 'Открыт уровень ' + l, must1: 'Нужно прийти первым,', must2: 'чтобы пройти уровень', title: 'Гонка', lvl: l => 'Уровень ' + l + '/10', gas: 'Газ жмёшь ты — зелёная кнопка', careful: 'Осторожно: масло и барьеры', tapStart: 'Нажми — старт', wx: { clear: 'Солнце', rain: 'Дождь', fog: 'Туман' } },
  en: { hud: (p, l) => 'Place ' + p + '/4 · Lv. ' + l + '/10', words: ['', 'FIRST PLACE', 'Second place', 'Third place', 'Fourth place'], champ: 'YOU ARE THE CHAMPION — 10 levels', unlocked: l => 'Level ' + l + ' unlocked', must1: 'You must finish first', must2: 'to pass the level', title: 'Race', lvl: l => 'Level ' + l + '/10', gas: 'You control the gas — the green button', careful: 'Watch out for oil and barriers', tapStart: 'Tap to start', wx: { clear: 'Sunny', rain: 'Rain', fog: 'Fog' } },
  es: { hud: (p, l) => 'Puesto ' + p + '/4 · Niv. ' + l + '/10', words: ['', '¡PRIMER PUESTO!', 'Segundo puesto', 'Tercer puesto', 'Cuarto puesto'], champ: 'ERES EL CAMPEÓN — 10 niveles', unlocked: l => 'Nivel ' + l + ' desbloqueado', must1: 'Tienes que llegar primero', must2: 'para pasar el nivel', title: 'Carrera', lvl: l => 'Nivel ' + l + '/10', gas: 'Tú das el gas — el botón verde', careful: 'Cuidado con el aceite y las barreras', tapStart: 'Toca para empezar', wx: { clear: 'Sol', rain: 'Lluvia', fog: 'Niebla' } },
  fr: { hud: (p, l) => 'Place ' + p + '/4 · Niv. ' + l + '/10', words: ['', 'PREMIÈRE PLACE !', 'Deuxième place', 'Troisième place', 'Quatrième place'], champ: 'TU ES LE CHAMPION — 10 niveaux', unlocked: l => 'Niveau ' + l + ' débloqué', must1: 'Il faut finir premier', must2: 'pour passer le niveau', title: 'Course', lvl: l => 'Niveau ' + l + '/10', gas: 'C’est toi qui accélères — le bouton vert', careful: 'Attention à l’huile et aux barrières', tapStart: 'Touche pour commencer', wx: { clear: 'Soleil', rain: 'Pluie', fog: 'Brouillard' } },
  de: { hud: (p, l) => 'Platz ' + p + '/4 · Lv. ' + l + '/10', words: ['', 'ERSTER PLATZ!', 'Zweiter Platz', 'Dritter Platz', 'Vierter Platz'], champ: 'DU BIST DER CHAMPION — 10 Level', unlocked: l => 'Level ' + l + ' freigeschaltet', must1: 'Du musst Erster werden,', must2: 'um das Level zu schaffen', title: 'Rennen', lvl: l => 'Level ' + l + '/10', gas: 'Du gibst Gas — der grüne Knopf', careful: 'Vorsicht vor Öl und Hindernissen', tapStart: 'Tippe zum Starten', wx: { clear: 'Sonne', rain: 'Regen', fog: 'Nebel' } },
  ja: { hud: (p, l) => '順位 ' + p + '/4 · レベル ' + l + '/10', words: ['', '1位だ！', '2位', '3位', '4位'], champ: 'チャンピオンだ！ — 全10レベル', unlocked: l => 'レベル' + l + 'がアンロック', must1: '1位にならないと', must2: '次のレベルに進めないよ', title: 'レース', lvl: l => 'レベル ' + l + '/10', gas: 'アクセルは緑のボタン', careful: 'オイルとバリアに気をつけて', tapStart: 'タップでスタート', wx: { clear: 'はれ', rain: 'あめ', fog: 'きり' } },
  zh: { hud: (p, l) => '名次 ' + p + '/4 · 第' + l + '/10关', words: ['', '第一名！', '第二名', '第三名', '第四名'], champ: '你是冠军 — 通关10关', unlocked: l => '第' + l + '关解锁了', must1: '必须拿第一名', must2: '才能过关', title: '赛车', lvl: l => '第' + l + '/10关', gas: '油门是绿色按钮', careful: '小心油渍和路障', tapStart: '点一下开始', wx: { clear: '晴天', rain: '下雨', fog: '大雾' } },
  it: { hud: (p, l) => 'Posto ' + p + '/4 · Liv. ' + l + '/10', words: ['', 'PRIMO POSTO!', 'Secondo posto', 'Terzo posto', 'Quarto posto'], champ: 'SEI IL CAMPIONE — 10 livelli', unlocked: l => 'Livello ' + l + ' sbloccato', must1: 'Devi arrivare primo', must2: 'per passare il livello', title: 'Corsa', lvl: l => 'Livello ' + l + '/10', gas: 'Il gas lo dai tu — il pulsante verde', careful: 'Attento all’olio e alle barriere', tapStart: 'Tocca per partire', wx: { clear: 'Sole', rain: 'Pioggia', fog: 'Nebbia' } },
  ka: { hud: (p, l) => 'ადგილი ' + p + '/4 · დონე ' + l + '/10', words: ['', 'ᲞᲘᲠᲕᲔᲚᲘ ᲐᲓᲒᲘᲚᲘ!', 'მეორე ადგილი', 'მესამე ადგილი', 'მეოთხე ადგილი'], champ: 'ᲨᲔᲜ ᲩᲔᲛᲞᲘᲝᲜᲘ ᲮᲐᲠ — 10 დონე', unlocked: l => 'გაიხსნა დონე ' + l, must1: 'პირველი უნდა მოხვიდე,', must2: 'რომ დონე გაიარო', title: 'რბოლა', lvl: l => 'დონე ' + l + '/10', gas: 'გაზს შენ აჭერ — მწვანე ღილაკი', careful: 'ფრთხილად: ზეთი და ბარიერები', tapStart: 'დააჭირე — სტარტი', wx: { clear: 'მზე', rain: 'წვიმა', fog: 'ნისლი' } },
  hi: { hud: (p, l) => 'स्थान ' + p + '/4 · लेवल ' + l + '/10', words: ['', 'पहला स्थान!', 'दूसरा स्थान', 'तीसरा स्थान', 'चौथा स्थान'], champ: 'तुम चैंपियन हो — 10 लेवल', unlocked: l => 'लेवल ' + l + ' खुल गया', must1: 'पहले आना ज़रूरी है,', must2: 'तभी लेवल पास होगा', title: 'रेस', lvl: l => 'लेवल ' + l + '/10', gas: 'गैस तुम दबाते हो — हरा बटन', careful: 'तेल और बैरियर से सावधान', tapStart: 'शुरू करने के लिए टैप करो', wx: { clear: 'धूप', rain: 'बारिश', fog: 'कोहरा' } },
};
const T = TRL[ggLang] || TRL.hy;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function beep(f1, f2, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sBump = () => beep(150, 60, 0.25, 'sawtooth', 0.2);
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => beep(f, f, 0.25, 'triangle', 0.2, k * 0.13));

// ——— Մակարդակներն ու ուղին ———
// 10 մակարդակ. ամեն մեկում մրցակիցներն ավելի արագ են, ուղին՝ ավելի երկար,
// իսկ ճանապարհին ավելի շատ յուղ ու արգելապատնեշ կա 🚧
const MAX_LEVEL = 10;
let level = 1;
try { level = Math.min(MAX_LEVEL, Number(localStorage.getItem('aren-race-level') || 1) || 1); } catch (e) {}
function raceLen() { return 7000 + level * 900; }
function rivalBase() { return 6.7 + level * 0.24; }
function roadW() { return Math.min(W * 0.86, 440); }
function laneX(i) {                    // 4 գոտի. 0-ն ձախն է
  const rw = roadW();
  return W / 2 - rw / 2 + rw * (i + 0.5) / 4;
}

// ——— Եղանակը 🌦 ———
// Ամեն մակարդակ իր եղանակն ունի ու հերթով փոխվում է՝ արև → անձրև → մառախուղ։
// Անձրևին անիվները սահում են, մառախուղին՝ հեռուն չես տեսնում։
const WEATHERS = ['clear', 'rain', 'fog'];
function weatherFor(l) { return WEATHERS[(l - 1) % WEATHERS.length]; }
let weather = weatherFor(level);
let drops = [];                        // անձրևի կաթիլները
function makeDrops() {
  drops = [];
  if (weather !== 'rain') return;
  for (let i = 0; i < 90; i++) {
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      len: 10 + Math.random() * 18,
      spd: 12 + Math.random() * 10,
    });
  }
}
makeDrops();
// փոքրիկ պատուհան՝ ստուգելու համար, թե հիմա ինչ եղանակ է
window.ggWeather = () => weather;

// ——— Մեքենաները ———
const player = { x: 0, progress: 0, speed: 0, vx: 0 };
const RIVALS = [
  { color: '#e63946', lane: 0 },
  { color: '#2ecc71', lane: 1 },
  { color: '#9b59b6', lane: 3 },
];
let rivals = [];
let obstacles = [];                    // յուղի բծեր ու արգելապատնեշներ
let state = 'ready';                   // ready → count → race → done
let countT = 0, frame = 0, finishPlace = 0;

function reset() {
  player.x = laneX(2);
  player.progress = 0;
  player.speed = 0;
  player.vx = 0;
  weather = weatherFor(level);   // նոր մակարդակ՝ նոր եղանակ
  makeDrops();
  rivals = RIVALS.map(r => ({
    color: r.color,
    lane: r.lane,
    x: laneX(r.lane),
    progress: 60 + Math.random() * 40,   // մի քիչ առջևից են սկսում, հասի՛ր
    speed: rivalBase() + Math.random() * 0.4,
    turn: 0,
  }));
  // խոչընդոտները շաղ ենք տալիս ուղու վրայով. ինչ մակարդակ, այնքան շատ
  obstacles = [];
  for (let i = 0; i < 6 + level * 2; i++) {
    obstacles.push({
      progress: 500 + Math.random() * (raceLen() - 1000),
      x: laneX(Math.floor(Math.random() * 4)),
      type: Math.random() < 0.55 ? 'oil' : 'barrier',
    });
  }
}
reset();

// ——— Կառավարումը ———
const keys = { left: false, right: false, gas: false };
document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') { e.preventDefault(); keys.left = true; }
  if (e.code === 'ArrowRight') { e.preventDefault(); keys.right = true; }
  if (e.code === 'ArrowUp') { e.preventDefault(); keys.gas = true; }
  if ((state === 'ready' || state === 'done') && (e.code === 'Space' || e.code === 'Enter')) start();
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp') keys.gas = false;
});

// Մեծ կոճակներ՝ էկրանի իսկական պիքսելներով (փոքր հեռախոսում էլ մեծ են)
function btnR() { return Math.max(44, Math.min(64, W * 0.09)); }
function buttons() {
  const r = btnR(), pad = 16, y = H - pad - r;
  // ձախում՝ ղեկը (◀ ▶), աջում՝ ԳԱԶԸ՝ մեծ կանաչ կոճակ
  return [
    { key: 'left',  x: pad + r,             y },
    { key: 'right', x: pad + r * 3 + 16,    y },
    { key: 'gas',   x: W - pad - r * 1.2,   y: H - pad - r * 1.2, big: true },
  ];
}
const pointers = new Map();
function updateTouch() {
  keys.left = keys.right = keys.gas = false;
  for (const p of pointers.values()) {
    for (const b of buttons()) {
      const hit = (b.big ? btnR() * 1.35 : btnR()) + 12;
      if (Math.hypot(p.x - b.x, p.y - b.y) < hit) keys[b.key] = true;
    }
  }
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'ready' || state === 'done') { start(); return; }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  updateTouch();
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  updateTouch();
});
canvas.addEventListener('pointerup', (e) => { pointers.delete(e.pointerId); updateTouch(); });
canvas.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); updateTouch(); });
canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function start() {
  reset();
  state = 'count';
  countT = 0;
}

// ——— Խաղի քայլը ———
function update() {
  frame++;

  if (state === 'count') {
    countT++;
    if (countT % 55 === 1 && countT < 165) beep(440, 440, 0.2, 'square', 0.2);
    if (countT === 165) { beep(880, 880, 0.4, 'square', 0.25); state = 'race'; }
  }

  // անձրևը թափվում է միշտ՝ նույնիսկ երբ դեռ չես մեկնարկել
  for (const d of drops) {
    d.y += d.spd;
    d.x -= 1.6;                       // քամին թեքում է կաթիլները
    if (d.y > H) { d.y = -20; d.x = Math.random() * W; }
    if (d.x < -20) d.x = W + 10;
  }

  if (state !== 'race') return;

  // ԳԱԶԸ ՔՈ ՁԵՌՔԻՆ Է. սեղմած ես՝ արագանում ես, թողեցիր՝ դանդաղում
  // անձրևին ճանապարհը թաց է — արգելակը թույլ է բռնում
  const wet = weather === 'rain';
  if (keys.gas) player.speed = Math.min(9.5, player.speed + 0.14);
  else player.speed = Math.max(0, player.speed - (wet ? 0.06 : 0.12));

  // Ղեկը. չոր եղանակին ուղիղ է լսում, անձրևին՝ սահում ու ուշանում է
  const want = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  const targetVx = want * 4.6;
  if (wet) {
    player.vx += (targetVx - player.vx) * 0.14;   // անիվները դանդաղ են «բռնում»
    player.vx *= 0.985;                           // ու մի քիչ շարունակում են սահել
  } else {
    player.vx = targetVx;
  }
  player.x += player.vx;
  const rw = roadW();
  player.x = Math.max(W / 2 - rw / 2 + 20, Math.min(W / 2 + rw / 2 - 20, player.x));
  player.progress += player.speed;

  // ——— Խոչընդոտները ———
  for (const o of obstacles) {
    const dy = o.progress - player.progress;
    if (Math.abs(dy) < 30 && Math.abs(o.x - player.x) < 34) {
      if (o.type === 'oil' && !o.hitDone) {
        o.hitDone = true;                // ամեն բիծ միայն մեկ անգամ է դանդաղեցնում
        player.speed *= 0.55;            // յուղը ՄԻԱՅՆ դանդաղեցնում է, ղեկը քոնն է
        beep(500, 200, 0.3, 'sine', 0.15);
      } else if (o.type === 'barrier') {
        if (frame % 10 === 0) sBump();
        player.speed *= 0.4;             // ուժեղ հարված՝ կտրուկ դանդաղում
        o.progress -= 60;                // պատնեշը «ետ է թռչում», որ նորից չկպնես
      }
    }
  }

  // մրցակիցները. մի քիչ խելացի են՝ ետ մնացին՝ արագանում են
  for (const r of rivals) {
    const gap = player.progress - r.progress;
    const boost = gap > 200 ? 0.5 : gap < -400 ? -0.3 : 0;
    r.progress += r.speed + boost + Math.sin(frame * 0.01 + r.lane) * 0.15;

    // երբեմն գոտի են փոխում
    if (r.turn === 0 && Math.random() < 0.003) r.turn = Math.random() < 0.5 ? -1 : 1;
    if (r.turn !== 0) {
      const target = laneX(Math.max(0, Math.min(3, r.lane + r.turn)));
      r.x += (target - r.x) * 0.05;
      if (Math.abs(target - r.x) < 2) { r.lane = Math.max(0, Math.min(3, r.lane + r.turn)); r.turn = 0; }
    }

    // բախում. երկուսս էլ դանդաղում ենք
    const dy = r.progress - player.progress;
    if (Math.abs(dy) < 46 && Math.abs(r.x - player.x) < 32) {
      if (frame % 15 === 0) sBump();
      player.speed *= 0.55;
      r.progress += 18;   // նա առաջ է թռչում, դու ետ ես ընկնում
    }
  }

  // ֆինի՜շ
  if (player.progress >= raceLen()) {
    finishPlace = 1 + rivals.filter(r => r.progress > player.progress).length;
    state = 'done';
    if (finishPlace === 1) {
      sWin();
      confetti();
      // հաղթեցիր → հաջորդ մակարդակը բացվում է
      if (level < MAX_LEVEL) {
        level++;
        try { localStorage.setItem('aren-race-level', level); } catch (e) {}
        wonLevel = true;
      } else {
        wonLevel = 'champion';
      }
    } else {
      wonLevel = false;
      beep(300, 150, 0.5, 'triangle', 0.2);
    }
  }
}
let wonLevel = false;

// ——— Նկարելը ———
function drawCar(x, y, color, stripes) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#222';
  ctx.fillRect(-15, -20, 6, 12); ctx.fillRect(9, -20, 6, 12);
  ctx.fillRect(-15, 8, 6, 12); ctx.fillRect(9, 8, 6, 12);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-12, -24, 24, 48, 7);
  ctx.fill();
  if (stripes) {
    ctx.fillStyle = '#2b6cd4';
    ctx.fillRect(-8, -24, 4, 48);
    ctx.fillRect(4, -24, 4, 48);
  }
  ctx.fillStyle = 'rgba(40,60,80,0.85)';
  ctx.beginPath();
  ctx.roundRect(-8, -10, 16, 16, 4);
  ctx.fill();
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(-9, -24, 5, 3); ctx.fillRect(4, -24, 5, 3);
  ctx.restore();
}

function draw() {
  // խոտը
  ctx.fillStyle = '#2f7a3d';
  ctx.fillRect(0, 0, W, H);

  // ճանապարհը
  const rw = roadW();
  ctx.fillStyle = '#3d4148';
  ctx.fillRect(W / 2 - rw / 2, 0, rw, H);
  ctx.fillStyle = '#f4f6f8';
  ctx.fillRect(W / 2 - rw / 2 - 6, 0, 6, H);
  ctx.fillRect(W / 2 + rw / 2, 0, 6, H);

  // գոտիների գծիկները սահում են ներքև՝ արագության զգացողության համար
  ctx.fillStyle = '#f4d13b';
  const dashShift = (player.progress * 1.2) % 70;
  for (let i = 1; i < 4; i++) {
    const x = W / 2 - rw / 2 + rw * i / 4;
    for (let y = -70 + dashShift; y < H; y += 70) ctx.fillRect(x - 3, y, 6, 34);
  }

  const py = H * 0.72;

  // ֆինիշի շախմատե գիծը երևում է, երբ մոտենում ես
  const fy = py - (raceLen() - player.progress);
  if (fy > -60 && fy < H + 60) {
    for (let i = 0; i < Math.ceil(rw / 24); i++) {
      for (let j = 0; j < 2; j++) {
        ctx.fillStyle = (i + j) % 2 === 0 ? '#fff' : '#111';
        ctx.fillRect(W / 2 - rw / 2 + i * 24, fy - 24 + j * 12, 24, 12);
      }
    }
  }

  // խոչընդոտները՝ յուղի բծեր ու արգելապատնեշներ
  for (const o of obstacles) {
    const y = py - (o.progress - player.progress);
    if (y < -60 || y > H + 60) continue;
    if (o.type === 'oil') {
      ctx.fillStyle = '#1c1f24';
      ctx.beginPath(); ctx.ellipse(o.x, y, 26, 16, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(120,160,200,0.35)';
      ctx.beginPath(); ctx.ellipse(o.x - 6, y - 4, 9, 5, 0.3, 0, Math.PI * 2); ctx.fill();
    } else {
      // կարմիր-սպիտակ գծավոր պատնեշ
      for (let k = 0; k < 4; k++) {
        ctx.fillStyle = k % 2 === 0 ? '#e63946' : '#f4f6f8';
        ctx.fillRect(o.x - 30 + k * 15, y - 7, 15, 14);
      }
      ctx.fillStyle = '#8a8f98';
      ctx.fillRect(o.x - 30, y + 7, 5, 6);
      ctx.fillRect(o.x + 25, y + 7, 5, 6);
    }
  }

  // մրցակիցները
  for (const r of rivals) {
    const y = py - (r.progress - player.progress);
    if (y > -60 && y < H + 60) drawCar(r.x, y, r.color);
  }

  // դու՝ սպիտակ սպորտայինով 🏎
  if (state !== 'ready') drawCar(player.x, py, '#f7f9fc', true);

  // ——— Եղանակը էկրանին (ամեն ինչ նկարած է, էմոջի չկա) ———
  drawWeather(py);

  // ——— Վահանակը (էմոջի չկա՝ ամեն ինչ նկարած է) ———
  // տեղը
  const place = 1 + rivals.filter(r => r.progress > player.progress).length;
  const hudFont = Math.min(20, W * 0.046);
  ctx.font = 'bold ' + hudFont + 'px "Noto Sans Armenian", Arial, sans-serif';
  const hudText = T.hud(place, level);
  const hudW = ctx.measureText(hudText).width + 28;
  ctx.fillStyle = 'rgba(20,26,34,0.72)';
  ctx.beginPath(); ctx.roundRect(12, 12, hudW, hudFont * 2, 12); ctx.fill();
  ctx.fillStyle = '#ffd166';
  ctx.textAlign = 'left';
  ctx.fillText(hudText, 26, 12 + hudFont * 1.35);

  // եղանակի պիտակը՝ նկարած պատկեր + բառը քո լեզվով
  const wxFont = hudFont * 0.82;
  ctx.font = 'bold ' + wxFont + 'px "Noto Sans Armenian", Arial, sans-serif';
  const wxLabel = T.wx[weather];
  const wxH = hudFont * 1.75;
  const wxY = 12 + hudFont * 2 + 8;
  const wxW = ctx.measureText(wxLabel).width + wxH + 22;
  ctx.fillStyle = 'rgba(20,26,34,0.72)';
  ctx.beginPath(); ctx.roundRect(12, wxY, wxW, wxH, 10); ctx.fill();
  drawWeatherIcon(12 + wxH * 0.55, wxY + wxH / 2, wxH * 0.3);
  ctx.fillStyle = '#cde7f5';
  ctx.textAlign = 'left';
  ctx.fillText(wxLabel, 12 + wxH, wxY + wxH / 2 + wxFont * 0.35);

  // առաջընթացի ձողիկը՝ աջ եզրին
  const bx = W - 26, bh = H * 0.5, by = H * 0.12;
  ctx.fillStyle = 'rgba(20,26,34,0.6)';
  ctx.beginPath(); ctx.roundRect(bx - 5, by, 10, bh, 5); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(bx - 8, by, 16, 3);
  const dot = (p, color, rr) => {
    const yy = by + bh - bh * Math.min(1, p / raceLen());
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(bx, yy, rr, 0, Math.PI * 2); ctx.fill();
  };
  for (const r of rivals) dot(r.progress, r.color, 5);
  dot(player.progress, '#fff', 7);

  // կոճակները
  if (state === 'race' || state === 'count') {
    for (const b of buttons()) {
      const r = b.big ? btnR() * 1.35 : btnR();
      const pressed = keys[b.key];
      if (b.key === 'gas') {
        // ԳԱԶԸ՝ մեծ կանաչ կոճակ
        ctx.fillStyle = pressed ? '#6ee7b7' : 'rgba(30,90,60,0.75)';
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = pressed ? '#fff' : 'rgba(160,255,210,0.7)';
        ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = pressed ? '#0c3524' : '#eafff5';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - r * 0.4);
        ctx.lineTo(b.x + r * 0.42, b.y + r * 0.28);
        ctx.lineTo(b.x - r * 0.42, b.y + r * 0.28);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = pressed ? 'rgba(255,255,255,0.4)' : 'rgba(20,26,34,0.45)';
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = pressed ? '#fff' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = pressed ? '#1c2230' : '#fff';
        const s = b.key === 'left' ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(b.x + s * r * 0.38, b.y);
        ctx.lineTo(b.x - s * r * 0.26, b.y - r * 0.4);
        ctx.lineTo(b.x - s * r * 0.26, b.y + r * 0.4);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // ——— Էկրանները ———
  ctx.textAlign = 'center';
  if (state === 'ready' || state === 'done') {
    ctx.fillStyle = 'rgba(10,14,20,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(40, W * 0.08) + 'px "Noto Sans Armenian", Arial, sans-serif';
    if (state === 'done') {
      const words = T.words;
      ctx.fillStyle = finishPlace === 1 ? '#ffd166' : '#fff';
      ctx.fillText(words[finishPlace], W / 2, H / 2 - 70);
      const midFont = Math.min(20, W * 0.048);
      if (wonLevel === 'champion') {
        ctx.font = 'bold ' + midFont + 'px "Noto Sans Armenian", Arial, sans-serif';
        ctx.fillText(T.champ, W / 2, H / 2 - 30);
        drawTrophy(W / 2, H / 2 + 30);
      } else if (wonLevel) {
        ctx.font = 'bold ' + midFont + 'px "Noto Sans Armenian", Arial, sans-serif';
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(T.unlocked(level), W / 2, H / 2 - 30);
        drawTrophy(W / 2, H / 2 + 30);
      } else {
        ctx.font = 'bold ' + midFont + 'px "Noto Sans Armenian", Arial, sans-serif';
        ctx.fillStyle = '#c8cede';
        ctx.fillText(T.must1, W / 2, H / 2 - 34);
        ctx.fillText(T.must2, W / 2, H / 2 - 6);
      }
    } else {
      ctx.font = 'bold ' + Math.min(32, W * 0.072) + 'px "Noto Sans Armenian", Arial, sans-serif';
      ctx.fillText(T.title, W / 2, H / 2 - 90);
      ctx.font = Math.min(19, W * 0.046) + 'px "Noto Sans Armenian", Arial, sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(T.lvl(level), W / 2, H / 2 - 52);
      ctx.fillStyle = '#c8cede';
      ctx.fillText(T.gas, W / 2, H / 2 - 20);
      ctx.fillText(T.careful, W / 2, H / 2 + 8);
    }
    ctx.font = 'bold ' + Math.min(22, W * 0.052) + 'px "Noto Sans Armenian", Arial, sans-serif';
    ctx.fillStyle = '#6ee7b7';
    ctx.fillText(T.tapStart, W / 2, H / 2 + 110);
  } else if (state === 'count') {
    const n = 3 - Math.floor(countT / 55);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold ' + Math.min(110, W * 0.25) + 'px Arial, sans-serif';
    ctx.fillText(n > 0 ? n : 'GO', W / 2, H / 2);
  }
}

// Անձրևի շերտիկները և մառախուղի մութ շրջանակը
function drawWeather(py) {
  if (weather === 'rain') {
    ctx.strokeStyle = 'rgba(205,228,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 3, d.y + d.len);   // թեք գիծ՝ ինչպես թափվող կաթիլ
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(20,32,54,0.20)';   // ամպամած մուգ շերտ
    ctx.fillRect(0, 0, W, H);
  } else if (weather === 'fog') {
    // մառախուղը կլոր «պատուհան» է թողնում մեքենայի շուրջը, մնացածը՝ մուգ
    const near = Math.min(W, H) * 0.07;
    const far = Math.min(W, H) * 0.45;
    const g = ctx.createRadialGradient(player.x, py, near, player.x, py, far);
    g.addColorStop(0, 'rgba(198,205,215,0)');
    g.addColorStop(0.55, 'rgba(150,160,175,0.5)');
    g.addColorStop(1, 'rgba(32,38,48,0.93)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}

// Եղանակի փոքրիկ պատկերը՝ արև, ամպ-անձրև կամ մառախուղ
function drawWeatherIcon(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  if (weather === 'clear') {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
      ctx.lineTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15);
      ctx.stroke();
    }
  } else {
    // ամպը՝ երեք կլորիկ ու մի ուղղանկյուն
    ctx.fillStyle = weather === 'fog' ? '#b9c2cf' : '#cfd8e6';
    ctx.beginPath();
    ctx.arc(-r * 0.45, -r * 0.1, r * 0.42, 0, Math.PI * 2);
    ctx.arc(0, -r * 0.35, r * 0.52, 0, Math.PI * 2);
    ctx.arc(r * 0.5, -r * 0.1, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-r * 0.9, -r * 0.15, r * 1.85, r * 0.5);
    if (weather === 'rain') {
      ctx.strokeStyle = '#7ec8f5';
      ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(k * r * 0.5, r * 0.45);
        ctx.lineTo(k * r * 0.5 - r * 0.15, r * 0.95);
        ctx.stroke();
      }
    } else {
      // մառախուղը՝ հորիզոնական մոխրագույն շերտիկներ
      ctx.strokeStyle = 'rgba(220,228,238,0.85)';
      ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(-r * 0.9 + (k % 2) * r * 0.25, r * 0.45 + k * r * 0.28);
        ctx.lineTo(r * 0.85 - (k % 2) * r * 0.2, r * 0.45 + k * r * 0.28);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

// Ոսկե գավաթ առաջին տեղի համար 🏆 (նկարում ենք ձեռքով)
function drawTrophy(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(-26, -30); ctx.lineTo(26, -30);
  ctx.quadraticCurveTo(22, 8, 0, 14);
  ctx.quadraticCurveTo(-22, 8, -26, -30);
  ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-30, -16, 10, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(30, -16, 10, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  ctx.fillRect(-5, 14, 10, 12);
  ctx.fillRect(-18, 26, 36, 8);
  ctx.restore();
}

function confetti() {
  const stuff = ['🎉', '⭐', '🏁', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
