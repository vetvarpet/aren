<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden 2048 🧊</title>
<link rel="icon" type="image/png" href="../logo-icon.png">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#2a1e3f, #1a2a4a);
    color: #f5eede;
    font-family: "Arial Rounded MT Bold", "Noto Sans Armenian", "Arial", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    height: 100dvh;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: none;   /* սվայպները խաղինն են, ոչ թե էջինը */
  }
  h1 { font-size: clamp(1.2rem, 4.5vw, 1.8rem); color: #ffd76e; }
  .hud { display: flex; gap: 16px; font-size: 1rem; color: #9a9ec7; }
  .hud b { color: #6ee7b7; }

  #board {
    position: relative;
    width: min(92vw, 56vh, 420px);
    height: min(92vw, 56vh, 420px);
    background: #241a45;
    border: 4px solid #33356b;
    border-radius: 16px;
    padding: 8px;
  }
  .cell {
    position: absolute;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
  }
  /* Սալիկը ինքն է սահում իր տեղը՝ transform-ի անցումով */
  .tile {
    position: absolute;
    left: 0;
    top: 0;
    transition: transform 0.13s ease;
    will-change: transform;
  }
  .tin {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: bold;
    color: #2e2410;
  }
  .tin.pop { animation: pop 0.16s; }
  @keyframes pop { from { transform: scale(0.4); } }
  .tin.bump { animation: bump 0.18s; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  #msg { font-size: 1.05rem; color: #ffd76e; min-height: 1.4em; text-align: center; }
  #newBtn {
    border: 2px solid #6a5f9e;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #3d3560;
    color: #f5eede;
  }

  .confetti {
    position: fixed;
    top: -50px;
    z-index: 9;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>

<a href="../" style="position:fixed;top:10px;left:10px;z-index:10;color:#f5eede;text-decoration:none;background:rgba(20,26,34,0.75);border:2px solid rgba(255,255,255,0.4);padding:5px 12px;border-radius:999px;font-size:0.78rem;">← Golden Games</a>

<h1>Golden 2048 🧊</h1>
<div class="hud"><span id="scoreBox"></span><span id="bestBox" hidden></span></div>
<div id="board"></div>
<div id="msg"></div>
<button id="newBtn"></button>

<script>
// ——————————————————————————————————————
//  GOLDEN 2048 🧊 — սահեցրու, միացրու, հասիր 2048-ին
//  Սվայպ արա էկրանի ՑԱՆԿԱՑԱԾ տեղում՝ բոլոր սալիկները սահում են այդ կողմը։
//  Երկու նույն թիվ իրար դիպան՝ դառնում են մեկ կրկնակի մեծ։
// ——————————————————————————————————————

// Լեզուն ընտրվում է գլխավոր էջում մեկ անգամ, այստեղ միայն կարդում ենք
let ggLang = 'hy';
try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}
const TRL = {
  hy: { score: 'Միավոր՝ ', best: 'Ռեկորդ՝ ', hint: 'Սվայպ արա՝ սահեցնելու', win: 'ՀԱՍԱՐ 2048-Ի՜Ն 🎉 Շարունակիր', over: 'Տեղ չմնաց… Փորձիր նորից', newGame: '🔄 Նոր խաղ' },
  ru: { score: 'Очки: ', best: 'Рекорд: ', hint: 'Свайпай, чтобы двигать', win: 'ТЫ СОБРАЛ 2048! 🎉 Продолжай', over: 'Места не осталось… Попробуй снова', newGame: '🔄 Новая игра' },
  en: { score: 'Score: ', best: 'Best: ', hint: 'Swipe to slide', win: 'YOU MADE 2048! 🎉 Keep going', over: 'No room left… Try again', newGame: '🔄 New game' },
  es: { score: 'Puntos: ', best: 'Récord: ', hint: 'Desliza para mover', win: '¡HICISTE 2048! 🎉 Sigue', over: 'No queda sitio… Inténtalo otra vez', newGame: '🔄 Nueva partida' },
  fr: { score: 'Points : ', best: 'Record : ', hint: 'Glisse pour déplacer', win: 'TU AS FAIT 2048 ! 🎉 Continue', over: 'Plus de place… Réessaie', newGame: '🔄 Nouvelle partie' },
  de: { score: 'Punkte: ', best: 'Rekord: ', hint: 'Wische zum Schieben', win: 'DU HAST 2048! 🎉 Weiter so', over: 'Kein Platz mehr… Versuch es nochmal', newGame: '🔄 Neues Spiel' },
  ja: { score: 'スコア：', best: 'ベスト：', hint: 'スワイプで動かそう', win: '2048たっせい！🎉 まだ続けられるよ', over: 'もう動けない…もう一回！', newGame: '🔄 もう一回' },
  zh: { score: '得分：', best: '纪录：', hint: '滑动来移动', win: '你拼出了2048！🎉 继续加油', over: '没有空位了…再试一次', newGame: '🔄 再来一局' },
};
const T = TRL[ggLang] || TRL.hy;

const board = document.getElementById('board');
const scoreBox = document.getElementById('scoreBox');
const bestBox = document.getElementById('bestBox');
const msgEl = document.getElementById('msg');
const newBtn = document.getElementById('newBtn');
newBtn.textContent = T.newGame;
msgEl.textContent = T.hint;

// Թվերի գույները՝ փոքրից ոսկե մեծերը
const COLORS = {
  2: ['#ece5d3', '#5c5240'], 4: ['#e8d9b0', '#5c4a20'], 8: ['#f2b179', '#5c3210'],
  16: ['#f59563', '#5c250a'], 32: ['#f67c5f', '#5c1808'], 64: ['#f65e3b', '#fff5e6'],
  128: ['#edcf72', '#5c4308'], 256: ['#edcc61', '#5c4308'], 512: ['#edc850', '#5c4308'],
  1024: ['#ffd166', '#5c4308'], 2048: ['#f0b429', '#fff5e6'], 4096: ['#c98a12', '#fff5e6'],
};

let grid = [];        // 4×4. null = դատարկ, թե չէ՝ սալիկ {v, r, c, el}
let score = 0;
let won = false;
let over = false;
let best = 0;
try { best = Number(localStorage.getItem('aren-2048-best') || 0); } catch (e) {}

// ——— Ձայները ———
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sSlide = () => tone(220, 0.06, 'square', 0.06);
const sMerge = () => { tone(440, 0.08, 'triangle', 0.14); tone(660, 0.1, 'triangle', 0.1, 0.05); };
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.25, 'triangle', 0.2, k * 0.13));
const sOver = () => [392, 330, 262].forEach((f, k) => tone(f, 0.22, 'triangle', 0.15, k * 0.14));

function hud() {
  scoreBox.innerHTML = T.score + '<b>' + score + '</b>';
  if (best > 0) { bestBox.innerHTML = T.best + '<b>' + best + '</b>'; bestBox.hidden = false; }
}

// ——— Չափերը. վանդակների ցանցը սարքում ենք մեկ անգամ ———
const GAP = 8;
let cw = 0;
const cellEls = [];
function layout() {
  const size = board.clientWidth - 16;   // padding-ից հետո
  cw = (size - GAP * 3) / 4;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const cell = cellEls[r * 4 + c];
    cell.style.left = (8 + c * (cw + GAP)) + 'px';
    cell.style.top = (8 + r * (cw + GAP)) + 'px';
    cell.style.width = cw + 'px';
    cell.style.height = cw + 'px';
  }
  eachTile(t => { sizeTile(t); styleTile(t); posTile(t); });
}
for (let i = 0; i < 16; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cellEls.push(cell);
  board.appendChild(cell);
}
window.addEventListener('resize', layout);

function eachTile(fn) {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (grid[r][c]) fn(grid[r][c]);
}
function sizeTile(t) {
  t.el.style.width = cw + 'px';
  t.el.style.height = cw + 'px';
}
function posTile(t) {
  t.el.style.transform = 'translate(' + (8 + t.c * (cw + GAP)) + 'px, ' + (8 + t.r * (cw + GAP)) + 'px)';
}
function styleTile(t) {
  const [bg, fg] = COLORS[t.v] || ['#8a5a30', '#fff5e6'];
  t.in.style.background = bg;
  t.in.style.color = fg;
  t.in.style.fontSize = (t.v < 100 ? cw * 0.44 : t.v < 1000 ? cw * 0.36 : cw * 0.3) + 'px';
  t.in.textContent = t.v;
}
function replayAnim(t, name) {   // pop/bump անիմացիան նորից միացնելու հնարքը
  t.in.classList.remove('pop', 'bump');
  void t.in.offsetWidth;
  t.in.classList.add(name);
}

function makeTile(r, c, v) {
  const t = { r, c, v, merged: false };
  t.el = document.createElement('div');
  t.el.className = 'tile';
  t.in = document.createElement('div');
  t.in.className = 'tin pop';
  t.el.appendChild(t.in);
  sizeTile(t); styleTile(t); posTile(t);
  board.appendChild(t.el);
  grid[r][c] = t;
  return t;
}

function emptyCells() {
  const out = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) out.push([r, c]);
  return out;
}

function addTile() {
  const e = emptyCells();
  if (!e.length) return;
  const [r, c] = e[Math.floor(Math.random() * e.length)];
  makeTile(r, c, Math.random() < 0.9 ? 2 : 4);
}

function newGame() {
  board.querySelectorAll('.tile').forEach(el => el.remove());
  grid = [[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];
  score = 0; won = false; over = false;
  layout();
  addTile(); addTile();
  msgEl.textContent = T.hint;
  hud();
}

// dir: 0=ձախ, 1=վերև, 2=աջ, 3=ներքև
// Ամեն սալիկ սահում է մինչև պատը կամ ուրիշ սալիկ․ նույն թվին դիպավ՝ միանում են։
function move(dir) {
  if (over) return;
  initAudio();
  const dr = [0, -1, 0, 1][dir];
  const dc = [-1, 0, 1, 0][dir];
  // սկսում ենք այն կողմից, ուր սահում ենք, որ առջևինները առաջինը գնան
  const rows = dr === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
  const cols = dc === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
  let gained = 0, moved = false;

  for (const r of rows) for (const c of cols) {
    const t = grid[r][c];
    if (!t) continue;
    let nr = r, nc = c;
    let target = null;
    while (true) {
      const rr = nr + dr, cc = nc + dc;
      if (rr < 0 || rr > 3 || cc < 0 || cc > 3) break;
      if (grid[rr][cc]) {
        if (grid[rr][cc].v === t.v && !grid[rr][cc].merged) target = grid[rr][cc];
        break;
      }
      nr = rr; nc = cc;
    }
    if (target) {
      // միանում ենք. t-ն սահում է target-ի վրա ու վերանում
      moved = true;
      grid[r][c] = null;
      target.v *= 2;
      target.merged = true;
      gained += target.v;
      t.r = target.r; t.c = target.c;
      posTile(t);
      const deadEl = t.el;
      setTimeout(() => {
        deadEl.remove();
        styleTile(target);
        replayAnim(target, 'bump');
      }, 130);
    } else if (nr !== r || nc !== c) {
      moved = true;
      grid[r][c] = null;
      grid[nr][nc] = t;
      t.r = nr; t.c = nc;
      posTile(t);
    }
  }
  eachTile(t => { t.merged = false; });
  if (!moved) return;

  score += gained;
  if (score > best) {
    best = score;
    try { localStorage.setItem('aren-2048-best', best); } catch (e) {}
  }
  gained > 0 ? sMerge() : sSlide();
  addTile();
  hud();

  if (!won && [].concat(...grid).some(t => t && t.v >= 2048)) {
    won = true;
    msgEl.textContent = T.win;
    sWin();
    confetti();
  }
  if (isStuck()) {
    over = true;
    msgEl.textContent = T.over;
    sOver();
  }
}

function valAt(r, c) { return grid[r][c] ? grid[r][c].v : 0; }
function isStuck() {
  if (emptyCells().length) return false;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (c < 3 && valAt(r, c) === valAt(r, c + 1)) return false;
    if (r < 3 && valAt(r, c) === valAt(r + 1, c)) return false;
  }
  return true;
}

// ——— Կառավարումը. սվայպ ԱՄԲՈՂՋ էկրանով + ստեղնաշար ———
// Կոճակների ու հղումների վրայից սկսված հպումները չենք խառնում խաղին
let sx = 0, sy = 0, swiping = false;
window.addEventListener('touchstart', (e) => {
  if (e.target.closest('a, button')) return;
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
  swiping = true;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
  else move(dy > 0 ? 3 : 1);
});
// մկնիկով էլ (համակարգչի համար)
let mdown = false;
window.addEventListener('mousedown', (e) => {
  if (e.target.closest('a, button')) return;
  sx = e.clientX; sy = e.clientY; mdown = true;
});
window.addEventListener('mouseup', (e) => {
  if (!mdown) return;
  mdown = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
  else move(dy > 0 ? 3 : 1);
});
window.addEventListener('keydown', (e) => {
  const dirs = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };
  if (e.code in dirs) { e.preventDefault(); move(dirs[e.code]); }
});

newBtn.addEventListener('click', newGame);

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

function confetti() {
  const stuff = ['🎉', '⭐', '🧊', '💛', '🎊', '✨'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = stuff[Math.floor(Math.random() * stuff.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (16 + Math.random() * 22) + 'px';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

newGame();
hud();
</script>
