<style>

  /* 🧰 Գործիքները. ընտրում ես մեկը, հետո դնում ես ճանապարհին */

    background: #1d1d3f; border: 2px solid rgba(255,255,255,0.14); border-radius: 12px;
    padding: 7px 2px 5px; cursor: pointer; display: flex; flex-direction: column;

  .tools button span { font-size: 0.56rem; color: #9a9ec7; line-height: 1.1; text-align: center; }
  .tools button.on span { color: #ffd166; }

  .track { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 6px; }
  .cell {
    aspect-ratio: 1; background: #1d1d3f; border: 2px solid rgba(255,255,255,0.1);
    border-radius: 9px; cursor: pointer; padding: 0; display: flex;
    align-items: flex-end; justify-content: center; position: relative; overflow: hidden;

  .cell:active { transform: scale(0.92); }
  .cell.filled { border-color: rgba(255,209,102,0.45); }
  .rowlab { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 13px; }
  .rowlab span { font-size: 0.54rem; color: #52567e; text-align: center; }

  .count { font-size: 0.72rem; color: #9a9ec7; text-align: center; margin: 0 0 14px; }
  .count b { color: #ffd166; }

  .acts { display: flex; flex-direction: column; gap: 8px; }
  .acts button {
    width: 100%; padding: 13px; border-radius: 13px; cursor: pointer;
    font-family: inherit; font-size: 0.9rem; font-weight: bold;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #eef0ff;

  .acts button.share { background: #6ee7b7; border-color: #6ee7b7; color: #102a20; }
  .acts button:active { transform: scale(0.97); }

  #link {
    margin-top: 11px; width: 100%; padding: 10px; border-radius: 11px; font-size: 0.68rem;

// ——— 🔊 Ձայնը. միանում է առաջին հպումից ———
let AC = null;
function wakeAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(f1, f2, type, len, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f1, t0);
  if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t0 + len);
  g.gain.setValueAtTime(vol || 0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + len);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + len + 0.05);
}

  // բարձրը ոչ միայն բարձր է, այլև երկու տախտակ ունի
  const box = (h, w) => {
    const x = 50 - w / 2, y = gy - h;
    let r = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#c9863f" stroke="#8f5a24" stroke-width="' + (small ? 3 : 5) + '"/>';
    r += '<rect x="' + (50 - (small ? 2 : 4)) + '" y="' + y + '" width="' + (small ? 4 : 8) + '" height="' + h + '" fill="#8f5a24"/>';
    if (h > (small ? 16 : 55)) r += '<rect x="' + x + '" y="' + (y + h / 2 - (small ? 1.5 : 3)) + '" width="' + w + '" height="' + (small ? 3 : 6) + '" fill="#8f5a24"/>';
    return r;
  };
  if (k === 'b') return ground + box(small ? 13 : 40, small ? 40 : 52);
  if (k === 'B') return ground + box(small ? 22 : 68, small ? 40 : 52);
  // ագռավը ԲԱՐՁՐ է թռչում ու թևերը բացած է — որ ձկան հետ չշփոթվի
  if (k === 'c') {
    const y = small ? 9 : 26;
    const s2 = small ? 0.5 : 1;
    return ground
      + '<path d="M' + (50 - 34 * s2) + ' ' + (y - 9 * s2) + ' q' + (16 * s2) + ' ' + (14 * s2) + ' ' + (30 * s2) + ' ' + (3 * s2)
      +   ' q' + (14 * s2) + ' ' + (11 * s2) + ' ' + (30 * s2) + ' ' + (-3 * s2) + '" stroke="#2b3350" stroke-width="' + (small ? 4 : 7) + '" fill="none" stroke-linecap="round"/>'
      + '<ellipse cx="50" cy="' + (y + 6 * s2) + '" rx="' + (13 * s2) + '" ry="' + (8 * s2) + '" fill="#2b3350"/>'
      + '<circle cx="' + (50 + 8 * s2) + '" cy="' + (y + 3 * s2) + '" r="' + (4.5 * s2) + '" fill="#2b3350"/>'
      + '<path d="M' + (50 + 12 * s2) + ' ' + (y + 3 * s2) + ' l' + (9 * s2) + ' ' + (2.5 * s2) + ' l' + (-9 * s2) + ' ' + (2.5 * s2) + ' z" fill="#e0a92b"/>'
      + '<circle cx="' + (50 + 8 * s2) + '" cy="' + (y + 2 * s2) + '" r="' + (1.4 * s2) + '" fill="#ffd166"/>';
  }
  if (k === 'f' || k === 'g') {
    const c = k === 'g' ? '#ffd166' : '#4aa3d8', d = k === 'g' ? '#e0a92b' : '#2b6cd4';
    const y = gy - (small ? 14 : 42), s2 = small ? 0.55 : 1;
    return ground
      + '<ellipse cx="48" cy="' + y + '" rx="' + (20 * s2) + '" ry="' + (12 * s2) + '" fill="' + c + '"/>'
      + '<path d="M' + (48 + 19 * s2) + ' ' + y + ' l' + (13 * s2) + ' ' + (-9 * s2) + ' v' + (18 * s2) + ' z" fill="' + d + '"/>'
      + '<circle cx="' + (48 - 9 * s2) + '" cy="' + (y - 3 * s2) + '" r="' + (2.6 * s2) + '" fill="#12122b"/>';
  }
  return ground;                                  // դատարկ վանդակ՝ ուղղակի գետին
}
const svg = (k, small) => '<svg viewBox="0 0 100 ' + (small ? 30 : 100) + '" aria-hidden="true">' + art(k, small) + '</svg>';

// ——— Ուրվականի պաշտպանություն. հեռախոսը հպումից հետո կեղծ mouse է ուղարկում ———
let lastTouchAt = 0;
function onTap(el, fn) {
  el.addEventListener('touchend', e => {
    lastTouchAt = Date.now();
    e.preventDefault();
    wakeAudio();
    fn();
  }, { passive: false });
  el.addEventListener('click', e => {
    if (Date.now() - lastTouchAt < 700) return;
    e.preventDefault();
    wakeAudio();
    fn();
  });
}

// ——— Գործիքների շարքը ———
const toolsEl = document.getElementById('tools');
for (const k of KINDS) {
  const b = document.createElement('button');
  b.dataset.k = k;
  b.innerHTML = svg(k === 'e' ? '.' : k, true) + '<span>' + T.n[k] + '</span>';
  if (k === tool) b.className = 'on';
  onTap(b, () => {
    tool = k;
    tone(560, 700, 'triangle', 0.07, 0.16);
    toolsEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === k));
  });
  toolsEl.appendChild(b);
}

// ——— Ճանապարհի վանդակները ———
const trackEl = document.getElementById('track');
const cellEls = [];
for (let i = 0; i < CELLS; i++) {
  const c = document.createElement('button');
  c.className = 'cell';
  onTap(c, () => {
    const put = tool === 'e' ? '.' : tool;
    level[i] = (level[i] === put) ? '.' : put;    // նույնը կրկին հպեցիր՝ վերցնում ես
    tone(level[i] === '.' ? 300 : 660, level[i] === '.' ? 220 : 880, 'triangle', 0.08, 0.2);
    paint();
    save();
  });
  cellEls.push(c);
  trackEl.appendChild(c);
}
// ՍԿԻԶԲ ... ՎԵՐՋ ցուցիչները առաջին շարքի տակ
const rowlab = document.getElementById('rowlab');
for (let i = 0; i < 8; i++) {
  const s = document.createElement('span');
  s.textContent = i === 0 ? T.start : (i === 7 ? '' : '');
  rowlab.appendChild(s);
}
rowlab.lastChild.textContent = T.fin;

function paint() {
  for (let i = 0; i < CELLS; i++) {
    cellEls[i].innerHTML = svg(level[i], false);
    cellEls[i].classList.toggle('filled', level[i] !== '.');
  }
  const n = level.filter(x => x !== '.').length;
  document.getElementById('count').innerHTML = T.count(n);
}

// ——— Պահում ու կարդում ենք ———
function code() { return level.join('').replace(/\.+$/, '') || '.'; }
function save() { try { localStorage.setItem('aren-builder-level', level.join('')); } catch (e) {} }
function load(str) {
  if (!str) return false;
  const arr = String(str).slice(0, CELLS).split('');
  if (!arr.every(ch => ch === '.' || KINDS.indexOf(ch) >= 0)) return false;
  level = new Array(CELLS).fill('.');
  arr.forEach((ch, i) => { if (ch !== 'e') level[i] = ch; });
  return true;
}
// հղումով եկած մակարդակը կարելի է նաև ՈՒՂՂԵԼ այստեղ
let fromUrl = null;
try { fromUrl = new URLSearchParams(location.search).get('lvl'); } catch (e) {}
if (!load(fromUrl)) { try { load(localStorage.getItem('aren-builder-level')); } catch (e) {} }
paint();

// ——— Ծանուցում ———
let toastT = 0;
function say(txt) {
  const el = document.getElementById('toast');
  el.textContent = txt;
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; }, 2600);
}

const playUrl = () => location.href.replace(/builder\/.*$/, 'cat-jump/run/') + '?lvl=' + encodeURIComponent(code());

onTap(document.getElementById('playBtn'), () => {
  if (code() === '.') { say(T.empty); tone(200, 120, 'sawtooth', 0.2, 0.14); return; }
  tone(523, 784, 'triangle', 0.16, 0.28);
  location.href = playUrl();
});

onTap(document.getElementById('shareBtn'), () => {
  if (code() === '.') { say(T.empty); tone(200, 120, 'sawtooth', 0.2, 0.14); return; }
  const url = playUrl();
  const box = document.getElementById('link');
  box.value = url;
  box.hidden = false;
  tone(660, 990, 'triangle', 0.12, 0.26);
  tone(880, 1200, 'triangle', 0.2, 0.24, 0.1);
  // Պատճենելը ամեն հեռախոսում չի ստացվում — այդ դեպքում ցույց ենք տալիս հղումը
  try {
    navigator.clipboard.writeText(url).then(() => say(T.copied), () => say(T.manual));
  } catch (e) { say(T.manual); }
});

onTap(document.getElementById('clearBtn'), () => {
  level = new Array(CELLS).fill('.');
  document.getElementById('link').hidden = true;
  tone(400, 200, 'triangle', 0.16, 0.2);
  paint();
  save();
  say(T.cleared);
});

// Կրկնակի հպումով խոշորացումը կանգնեցնում ենք
let lastEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastEnd < 300) e.preventDefault();
  lastEnd = now;
}, { passive: false });
</script>
<script src="../gg-kit.js" data-kind="info" defer></script>
</body>
</html>
