<script>
// ——————————————————————————————————————

try { ggLang = localStorage.getItem('gg-lang') || 'hy'; } catch (e) {}

  it: { sub: 'Scegli una canzone e tocca a ritmo 👇', best: 'Record: ', score: 'Punti: ', combo: 'Combo ×', perfect: 'PERFETTO!', good: 'Bene!', miss: 'Mancato…', done: 'Canzone finita!', tapMenu: 'Tocca per scegliere una canzone', newRec: 'NUOVO RECORD 🏆', songs: { star: '🌟 Stellina', birthday: '🎂 Tanti auguri', jingle: '🔔 Jingle Bells', tango: '💃 Il tango di Aren', joy: '🎼 Inno alla gioia', lamb: '🐑 L’agnellino di Mary' } },
  ka: { sub: 'აირჩიე სიმღერა და დაარტყი რიტმში 👇', best: 'რეკორდი: ', score: 'ქულა: ', combo: 'კომბო ×', perfect: 'იდეალურია!', good: 'კარგია!', miss: 'ააცდინე…', done: 'სიმღერა დასრულდა!', tapMenu: 'დააჭირე სიმღერის ასარჩევად', newRec: 'ახალი რეკორდი 🏆', songs: { star: '🌟 ვარსკვლავი', birthday: '🎂 გილოცავ დაბადების დღეს', jingle: '🔔 ეჟვნები', tango: '💃 არენის ტანგო', joy: '🎼 სიხარულის ოდა', lamb: '🐑 პატარა ბატკანი' } },
  hi: { sub: 'गाना चुनो और ताल पर टैप करो 👇', best: 'रिकॉर्ड: ', score: 'स्कोर: ', combo: 'कॉम्बो ×', perfect: 'एकदम सही!', good: 'बढ़िया!', miss: 'चूक गए…', done: 'गाना पूरा हुआ!', tapMenu: 'गाना चुनने के लिए टैप करो', newRec: 'नया रिकॉर्ड 🏆', songs: { star: '🌟 ट्विंकल ट्विंकल', birthday: '🎂 जन्मदिन मुबारक', jingle: '🔔 जिंगल बेल्स', tango: '💃 अरेन का टैंगो', joy: '🎼 खुशी का गीत', lamb: '🐑 मैरी का मेमना' } },
};
const T = TRL[ggLang] || TRL.hy;
document.querySelector('.sub').textContent = T.sub;

// Երգերը՝ ուղիղ Golden Piano-ից. [նոտայի համարը, տակտի պահը]
const SONGS = {
  star: { beat: 400, notes: [
    [0, 0], [0, 1], [7, 2], [7, 3], [9, 4], [9, 5], [7, 6],
    [5, 8], [5, 9], [4, 10], [4, 11], [2, 12], [2, 13], [0, 14],
  ] },
  birthday: { beat: 340, notes: [
    [0, 0], [0, 0.5], [2, 1], [0, 2], [5, 3], [4, 4],
    [0, 6], [0, 6.5], [2, 7], [0, 8], [7, 9], [5, 10],
    [0, 12], [0, 12.5], [12, 13], [9, 14], [5, 15], [4, 16], [2, 17],
    [10, 19], [10, 19.5], [9, 20], [5, 21], [7, 22], [5, 23],
  ] },
  jingle: { beat: 300, notes: [
    [4, 0], [4, 1], [4, 2],
    [4, 4], [4, 5], [4, 6],
    [4, 8], [7, 9], [0, 10], [2, 11], [4, 12],
    [5, 16], [5, 17], [5, 18], [5, 19], [5, 20], [4, 21], [4, 22], [4, 23],
    [7, 24], [7, 25], [5, 26], [2, 27], [0, 28],
  ] },
  tango: { beat: 320, notes: [
    [9, 0], [12, 0.5], [16, 1], [16, 2], [14, 2.5], [12, 3],
    [11, 4], [11, 5], [9, 5.5], [8, 6], [9, 7], [11, 8],
    [9, 10], [12, 10.5], [16, 11], [16, 12], [14, 12.5], [12, 13],
    [11, 14], [12, 14.5], [11, 15], [8, 16], [9, 17],
    [4, 19], [9, 19.5], [9, 20.5],
  ] },
  // «Ուրախության ձոնը» — Բեթհովեն
  joy: { beat: 360, notes: [
    [4, 0], [4, 1], [5, 2], [7, 3], [7, 4], [5, 5], [4, 6], [2, 7],
    [0, 8], [0, 9], [2, 10], [4, 11], [4, 12], [2, 13.5], [2, 14.5],
    [4, 17], [4, 18], [5, 19], [7, 20], [7, 21], [5, 22], [4, 23], [2, 24],
    [0, 25], [0, 26], [2, 27], [4, 28], [2, 29], [0, 30.5], [0, 31.5],
  ] },
  // «Փոքրիկ գառնուկը»
  lamb: { beat: 380, notes: [
    [4, 0], [2, 1], [0, 2], [2, 3], [4, 4], [4, 5], [4, 6],
    [2, 8], [2, 9], [2, 10], [4, 12], [7, 13], [7, 14],
    [4, 16], [2, 17], [0, 18], [2, 19], [4, 20], [4, 21], [4, 22], [4, 23],
    [2, 24], [2, 25], [4, 26], [2, 27], [0, 28],
  ] },
};

const menu = document.getElementById('menu');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = window.devicePixelRatio || 1;
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = innerWidth;
  H = innerHeight;
}
window.addEventListener('resize', resize);
resize();

const LANE_COLORS = ['#ff7b6b', '#ffd166', '#6ee7b7', '#6ec5ff'];
const APPROACH = 1800;   // նոտան այսքան մլվ է իջնում մինչև գիծը
const HIT_GOOD = 170;    // «լավ» խփոցի պատուհանը
const HIT_PERFECT = 75;  // «ճշգրիտ» խփոցի պատուհանը

let best = 0;
try { best = Number(localStorage.getItem('aren-beat-best') || 0); } catch (e) {}
const bestEl = document.querySelector('.best');
if (best > 0) { bestEl.textContent = T.best + best; bestEl.hidden = false; }

let state = 'menu';   // menu → play → end
let notes = [];       // { lane, time, hit, missed, judged }
let t0 = 0;
let score = 0, combo = 0, maxCombo = 0, perfects = 0;
let popups = [];
let flashes = [];     // գծի բռնկումները խփելիս
let endAt = 0;
let endedAt = 0;
let frame = 0;

// ——— Ձայնը՝ դաշնամուրի նույն «զանգակով» ———
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(semi) {
  if (!audioCtx) return;
  const freq = 261.63 * Math.pow(2, semi / 12);
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.9);
}
function thud() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = 90;
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.12);
}

// ——— Երգը սկսելը ———
let songNotes = [];   // [semi, ...] պահում ենք ձայնի համար
function startSong(key) {
  const song = SONGS[key];
  notes = song.notes.map(([idx, pos]) => ({
    semi: idx,
    lane: idx % 4,
    time: 2600 + pos * song.beat,   // 2.6 վրկ պատրաստվելու ժամանակ
    judged: false,
    y: -100,
  }));
  endAt = notes[notes.length - 1].time + 1600;
  score = 0; combo = 0; maxCombo = 0; perfects = 0;
  popups = []; flashes = [];
  t0 = performance.now();
  state = 'play';
  menu.hidden = true;
  canvas.hidden = false;
}

document.querySelectorAll('.songbtn').forEach(b => {
  b.textContent = T.songs[b.dataset.song];
  b.addEventListener('click', () => { initAudio(); startSong(b.dataset.song); });
});

// ——— Խփոցը ———
function hitLane(lane) {
  if (state !== 'play') return;
  const now = performance.now() - t0;
  let bestNote = null, bestDt = 1e9;
  for (const n of notes) {
    if (n.judged || n.lane !== lane) continue;
    const dt = Math.abs(n.time - now);
    if (dt < bestDt) { bestDt = dt; bestNote = n; }
  }
  if (bestNote && bestDt <= HIT_GOOD) {
    bestNote.judged = true;
    bestNote.hit = true;
    playTone(bestNote.semi);
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    if (bestDt <= HIT_PERFECT) { score += 100; perfects++; popText(lane, T.perfect, '#ffd166'); }
    else { score += 50; popText(lane, T.good, '#6ee7b7'); }
    flashes.push({ lane, life: 12 });
  } else {
    thud();   // դատարկ խփոց — ոչինչ, շարունակիր
  }
}

function popText(lane, text, color) {
  popups.push({ x: (lane + 0.5) * (W / 4), y: hitY() - 46, text, color, life: 38 });
}

function hitY() { return H - Math.max(110, H * 0.18); }

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (state === 'end') {
    if (Date.now() - endedAt < 1200) return;
    state = 'menu';
    canvas.hidden = true;
    menu.hidden = false;
    if (best > 0) { bestEl.textContent = T.best + best; bestEl.hidden = false; }
    return;
  }
  hitLane(Math.floor(e.clientX / W * 4));
});
window.addEventListener('keydown', (e) => {
  const lanes = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
  if (e.code in lanes) { initAudio(); hitLane(lanes[e.code]); }
});

// Կրկնակի արագ հպումը էկրանը մեծացնում էր — արգելում ենք
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

// ——— Նկարելը ———
function draw() {
  frame++;
  if (state === 'play' || state === 'end') {
    const now = performance.now() - t0;
    const HY = hitY();
    const laneW = W / 4;

    ctx.fillStyle = '#191233';
    ctx.fillRect(0, 0, W, H);

    // գծերի ֆոնը
    for (let l = 0; l < 4; l++) {
      ctx.fillStyle = l % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.055)';
      ctx.fillRect(l * laneW, 0, laneW, H);
    }

    // խփելու ոսկե գիծը
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(0, HY - 3, W, 6);
    ctx.fillStyle = 'rgba(255, 209, 102, 0.15)';
    ctx.fillRect(0, HY - 26, W, 52);

    // գծի բռնկումները
    for (const f of flashes) {
      f.life--;
      ctx.fillStyle = 'rgba(255, 235, 170, ' + (f.life / 12 * 0.5) + ')';
      ctx.fillRect(f.lane * laneW, HY - 40, laneW, 80);
    }
    flashes = flashes.filter(f => f.life > 0);

    // նոտաները
    if (state === 'play') {
      for (const n of notes) {
        if (n.judged && n.hit) continue;
        const y = HY - (n.time - now) * (HY + 60) / APPROACH;
        if (!n.judged && n.time - now < -HIT_GOOD) {
          n.judged = true;
          n.missed = true;
          combo = 0;
          popText(n.lane, T.miss, '#ff7b6b');
        }
        if (y < -40 || y > H + 40) continue;
        const x = n.lane * laneW + laneW * 0.14;
        const w = laneW * 0.72;
        ctx.globalAlpha = n.missed ? 0.25 : 1;
        ctx.fillStyle = LANE_COLORS[n.lane];
        ctx.beginPath();
        ctx.moveTo(x + 10, y - 13);
        ctx.arcTo(x + w, y - 13, x + w, y + 13, 10);
        ctx.arcTo(x + w, y + 13, x, y + 13, 10);
        ctx.arcTo(x, y + 13, x, y - 13, 10);
        ctx.arcTo(x, y - 13, x + w, y - 13, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(x + 6, y - 9, w - 12, 5);
        ctx.globalAlpha = 1;
      }
    }

    // թռչող գրությունները
    for (const p of popups) {
      p.life--;
      p.y -= 1;
      ctx.globalAlpha = Math.min(1, p.life / 15);
      ctx.fillStyle = p.color;
      ctx.font = 'bold 20px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
    popups = popups.filter(p => p.life > 0);

    // HUD
    ctx.fillStyle = '#f5eede';
    ctx.font = 'bold 22px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(T.score + score, W / 2, 84);
    if (combo > 1) {
      ctx.fillStyle = '#ffd166';
      ctx.fillText(T.combo + combo, W / 2, 114);
    }

    // երգը վերջացա՞վ
    if (state === 'play' && now > endAt) {
      state = 'end';
      endedAt = Date.now();
      if (score > best) {
        best = score;
        try { localStorage.setItem('aren-beat-best', best); } catch (e) {}
      }
    }

    if (state === 'end') {
      ctx.fillStyle = 'rgba(20, 15, 40, 0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd76e';
      ctx.font = 'bold 30px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
      ctx.fillText(T.done, W / 2, H * 0.34);
      ctx.fillStyle = '#f5eede';
      ctx.font = 'bold 24px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
      ctx.fillText(T.score + score, W / 2, H * 0.34 + 44);
      ctx.font = '17px "Arial Rounded MT Bold", "Noto Sans Armenian", Arial, sans-serif';
      ctx.fillStyle = '#9a9ec7';
      ctx.fillText(T.perfect + ' × ' + perfects + '   ·   ' + T.combo + maxCombo, W / 2, H * 0.34 + 78);
      if (score === best && score > 0) {
        ctx.fillStyle = '#ffd166';
        ctx.fillText(T.newRec, W / 2, H * 0.34 + 110);
      }
      ctx.fillStyle = '#9a9ec7';
      ctx.fillText(T.tapMenu, W / 2, H * 0.34 + 150);
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
